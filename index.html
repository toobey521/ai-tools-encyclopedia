  {"n": "Poe", "c": "AI Agent/智能体", "p": "Quora", "u": "https://poe.com", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Poe | AI Agent/智能体 | Quora | https://poe.com | 收费：免费+付费\n\n【详细介绍】\nPoe（Platform for Open Exploration）是Quora推出的AI平台和聚合聊天应用，被誉为「AI模型超市」。Poe的核心价值在于一个平台聚合了数十种主流AI模型，用户无需分别注册各个AI服务，可以在Poe上统一使用ChatGPT/GPT-4/Claude/DALL-E/Stable Diffusion/Google Gemini/Meta Llama/Mistral/Sage等多种模型。Poe的特色是Bot功能——用户和开发者可以在Poe平台上创建和发布自己的AI Bot（智能体）。Poe Bot支持知识库文件上传（让Bot基于用户提供的文档回答问题）、提示词定制、API集成和发布分享。Poe的Bot Creator工具让创建AI智能体变得非常简单——只需编写提示词和上传知识库文件，即可创建一个可分享的专业AI Bot。Poe已在Bot生态上积累了数十万个社区创建的AI智能体，覆盖写作/编程/教育/医疗/法律等各个领域。Poe还支持Bot之间的对话（Bot-to-Bot Chat）和语音输入。\n\n【核心功能】\n1. 多模型聚合：一个平台使用ChatGPT/Claude/Gemini等数十种模型\n2. Bot创建：用户自定义AI智能体，支持知识库+提示词\n3. Bot市场：数十万个社区创建的AI Bot\n4. 知识库上传：Bot基于用户提供的文档回答问题\n5. 开发者API：通过API创建和管理Bot\n6. Bot对话：多个Bot之间进行对话对比\n\n【应用场景】\n1. 模型比较：同时用多个模型回答同一问题对比效果\n2. 专用Bot：为特定场景创建专用AI助手（如法律咨询Bot）\n3. 客户服务：企业创建基于知识库的客服Bot\n4. 学习辅助：创建教学Bot帮助学生理解课程内容\n5. 内容创作：用不同风格的Bot生成文案\n6. 产品集成：通过API将Poe Bot集成到第三方应用\n\n【收费情况】\n免费+付费。免费版每天有基础模型使用额度。订阅版$19.99/月（无限使用所有模型+优先响应+Bot API）。\n\n【使用形态】\n在线SaaS服务。Web端和移动App。\n\n【使用说明】\n1. 访问 poe.com 用Quora/Apple/Google账号登录\n2. 选择模型或Bot开始对话\n3. 创建自己的Bot：点击创建Bot\n4. 设置Bot名称、提示词和知识库\n5. 发布Bot到市场供他人使用\n6. 通过API将Bot集成到自己的应用中\n\n【优势】\n1. 一个平台用所有主流模型\n2. Bot创建简单，门槛低\n3. Bot生态丰富\n4. 支持知识库上传\n5. 多模型对比方便\n\n【劣势】\n1. 免费版额度有限\n2. 中文支持不如国产平台\n3. 国内访问需要特殊网络\n4. Bot功能深度有限\n\n【支持平台】\nWeb端、iOS App、Android App、API", "s": "Poe是Quora推出的AI模型聚合平台和Bot创建平台，一个应用使用数十种AI模型，轻松创建专属AI智能体。"},
  {"n": "Mistral Large 2", "c": "通用AI大模型", "p": "Mistral AI", "u": "https://mistral.ai", "t": "对话/API", "r": "免费+付费", "d": "【产品名片】Mistral Large 2 | 通用AI大模型 | Mistral AI | https://mistral.ai | 收费：免费+付费\n\n【详细介绍】\nMistral Large 2是法国AI公司Mistral AI推出的旗舰级大语言模型。Mistral AI由前DeepMind和Meta AI研究人员于2023年创立，是欧洲最受瞩目的AI创业公司之一，估值超60亿美元。Mistral Large 2在Mistral Large的基础上大幅提升了推理能力、代码生成和多语言支持。模型支持多达数十种语言，在法语、德语、西班牙语、意大利语等欧洲语言上的表现尤为突出。Mistral AI以其开源精神著称，其Mistral 7B和Mixtral 8x7B模型在开源社区广受欢迎。Mistral Large 2采用MoE（混合专家）架构，在保持高性能的同时优化了推理成本。模型支持20万token上下文窗口，在多项基准测试中与GPT-4和Claude 3.5性能相当。Mistral AI为开发者提供了Le Chat聊天平台和API服务。\n\n【核心功能】\n1. 多语言支持：数十种语言支持，欧洲语言表现特别出色\n2. 强大推理：在数学/逻辑/编程推理方面达到顶级水平\n3. 代码生成：精通Python/JavaScript/Java/C++/Rust等主流语言\n4. 20万token上下文：支持长文档和大代码库处理\n5. MoE架构：混合专家模型优化推理效率\n6. 开源生态：Mistral 7B和Mixtral系列开源可用\n\n【应用场景】\n1. 多语言翻译：欧洲语言的高质量翻译和跨语言内容创作\n2. 代码开发：全栈编程辅助和代码审查\n3. 数据分析：复杂数据分析和报告生成\n4. 学术研究：论文阅读、总结和润色\n5. 企业应用：欧洲企业的AI集成和自动化\n6. 自部署AI：使用开源Mistral模型本地部署\n\n【收费情况】\n免费+付费。Le Chat平台免费使用。API按token计费：Mistral Large 2约$4/百万输入token，$12/百万输出token。开源模型完全免费。\n\n【使用形态】\nWeb端（Le Chat）、API接口、开源模型自部署。\n\n【使用说明】\n1. 访问 chat.mistral.ai 使用Le Chat\n2. 在API平台 console.mistral.ai 获取API Key\n3. 参考文档调用Mistral API\n4. 从HuggingFace下载Mistral开源模型本地部署\n5. 使用Ollama等工具一键运行开源版\n\n【优势】\n1. 欧洲AI领军者\n2. 多语言能力突出\n3. 开源理念好\n4. MoE架构效率高\n5. 长上下文支持\n\n【劣势】\n1. 中文能力不如国产模型\n2. 品牌知名度在中国较低\n3. 生态不如OpenAI成熟\n4. 企业技术支持有限\n\n【支持平台】\nWeb端、API、开源模型（HuggingFace/Ollama）", "s": "Mistral Large 2是法国Mistral AI的旗舰大模型，多语言能力突出，以开源精神和MoE架构著称。"},
  {"n": "ChatSonic", "c": "通用AI大模型", "p": "Writesonic", "u": "https://writesonic.com/chatsonic", "t": "对话", "r": "免费+付费", "d": "【产品名片】ChatSonic | 通用AI大模型 | Writesonic | https://writesonic.com/chatsonic | 收费：免费+付费\n\n【详细介绍】\nChatSonic是Writesonic公司开发的AI对话助手，定位为「全能型AI内容创作伴侣」。与普通的AI聊天机器人不同，ChatSonic集成了多种AI能力于一体——包括自然对话、内容生成、图像创建（集成Stable Diffusion）、语音输入/输出、实时谷歌搜索、个性化数字人角色设定等功能。ChatSonic底层基于GPT-4和自研模型，在内容营销和商业写作方面具有独特优势。ChatSonic特别强调其实时数据能力——内置Google搜索和最新资讯获取，可以回答关于最新事件的问题。ChatSonic还支持自定义角色（Persona），用户可以设置AI的性格、语气和专业领域。ChatSonic被广泛用于营销文案、SEO内容、社交媒体帖子等商业写作场景，是内容创作者的常用AI工具之一。\n\n【核心功能】\n1. 全能对话：聊天/写作/搜索/绘图多合一\n2. 实时搜索：内置Google搜索获取最新信息\n3. AI绘图：集成Stable Diffusion生成图像\n4. 语音交互：语音输入和语音输出\n5. 角色设定：自定义AI性格和专业领域\n6. 模板功能：预设营销/文案/邮件等多种场景\n\n【应用场景】\n1. 营销文案：广告文案、产品描述、转化文案\n2. SEO内容：博客文章、网站内容的批量生成\n3. 社媒运营：社交媒体帖子和互动内容\n4. 邮件营销：营销邮件序列的撰写\n5. 最新资讯：需要联网搜索的时事问答\n6. 创意写作：故事、剧本的AI辅助创作\n\n【收费情况】\n免费+付费。免费版有限使用次数。付费版$16-$33/月，无限生成+优先模型+商用版权。\n\n【使用形态】\n在线SaaS服务。Web端使用。\n【使用说明】\n1. 访问 writesonic.com/chatsonic 注册\n2. 选择聊天或内容生成模式\n3. 输入问题或选题\n4. 使用模板快速生成特定内容类型\n5. 开启联网搜索获取最新信息\n6. 设置角色风格\n\n【优势】\n1. 聊天+写作+绘图全功能\n2. 实时联网搜索\n3. 营销场景优化好\n4. 角色自定义\n5. 模板丰富\n\n【劣势】\n1. 中文支持不佳\n2. 基础AI能力不如ChatGPT\n3. 免费额度少\n4. 品牌知名度有限\n\n【支持平台】\nWeb端", "s": "ChatSonic是Writesonic开发的全能AI对话助手，集聊天/写作/搜索/绘图于一体，擅长营销内容创作。"},
  {"n": "Character.AI", "c": "通用AI大模型", "p": "Character Technologies", "u": "https://character.ai", "t": "对话", "r": "免费+付费", "d": "【产品名片】Character.AI | 通用AI大模型 | Character Technologies | https://character.ai | 收费：免费+付费\n\n【详细介绍】\nCharacter.AI是由前Google LaMDA团队研究人员Noam Shazeer和Daniel De Freitas创立的AI对话平台。Character.AI的最大特色是「角色扮演对话」——用户可以和AI扮演的任何角色进行沉浸式对话，包括虚构人物、历史人物、名人、原创角色等。平台上有数千万个由用户创建的角色（Characters），覆盖文学、影视、游戏、历史、教育、娱乐等各个领域。Character.AI的底层模型专门针对对话进行了深度优化，其对话自然度、情感理解能力和上下文连贯性在角色扮演场景中表现极为出色。角色不仅会说话，还有设定好的性格、背景故事、说话风格和情感变化。Character.AI还支持群组对话（多个AI角色同时聊天）和语音对话功能。平台月活跃用户超过2000万，是全球最大的AI角色扮演社区。\n\n【核心功能】\n1. 角色对话：与AI角色进行沉浸式对话\n2. 角色创建：用户自定义角色的性格/背景/说话风格\n3. 角色社区：数千万用户创建的AI角色库\n4. 群组对话：多个AI角色同时互动\n5. 语音对话：支持语音输入和语音回复\n6. 情感记忆：角色记住对话历史和情感变化\n\n【应用场景】\n1. 娱乐聊天：与喜爱的虚构角色对话\n2. 语言学习：与外语角色对话练习语言\n3. 创意启发：与历史人物讨论获取灵感\n4. 情感陪伴：与温柔角色倾诉和交流\n5. 写作练习：与角色互动激发故事创作\n6. 角色探索：体验不同视角和人格对话\n\n【收费情况】\n免费+付费。免费版有基本功能和使用限制。c.ai+订阅$9.99/月，优先访问+更快生成+更多功能。\n\n【使用形态】\n在线SaaS服务。Web端和移动App。\n\n【使用说明】\n1. 访问 character.ai 注册\n2. 在角色库浏览或搜索感兴趣的角色\n3. 点击角色开始对话\n4. 创建自己的角色：点击创建→设定名称/描述/性格\n5. 调整高级设置：角色的语气/知识/对话风格\n6. 分享角色给社区\n\n【优势】\n1. 角色对话体验最自然\n2. 角色库极其丰富\n3. 情感理解和共鸣好\n4. 角色自定义深度高\n5. 社区活跃创作多\n\n【劣势】\n1. 不适合严肃工作场景\n2. 角色有时会跑偏\n3. 中文支持不够好\n4. 内容审核有时严格\n\n【支持平台】\nWeb端、iOS App、Android App", "s": "Character.AI是由前Google LaMDA团队创立的AI角色扮演对话平台，用户可与数百万自定义AI角色沉浸式对话。"},
  {"n": "Microsoft Copilot", "c": "通用AI大模型", "p": "微软", "u": "https://copilot.microsoft.com", "t": "对话", "r": "免费+付费", "d": "【产品名片】Microsoft Copilot | 通用AI大模型 | 微软 | https://copilot.microsoft.com | 收费：免费+付费\n\n【详细介绍】\nMicrosoft Copilot（原名Bing Chat）是微软基于OpenAI GPT-4/GPT-4 Turbo模型打造的AI助手，深度集成于Windows操作系统和Microsoft 365办公套件中。Copilot是微软全面AI战略的核心产品，定位为「每个人的日常AI伴侣」。Copilot通过三种方式提供服务：Windows Copilot（系统级AI侧边栏，可操作系统设置和文件）、Microsoft 365 Copilot（集成在Word/Excel/PPT/Outlook/Teams中的AI助手）、以及Copilot Web（独立的聊天界面，具备联网搜索功能）。Copilot的联网搜索能力基于Bing搜索引擎，可以获取最新信息并附上来源链接。Copilot还支持图像识别（基于GPT-4 Vision）、DALL-E 3图像生成、代码解释器和插件扩展。Windows Copilot可以直接读取屏幕内容、操作系统剪贴板和系统设置，提供上下文感知的帮助。\n\n【核心功能】\n1. Windows集成：系统级AI助手，操作文件和设置\n2. 联网搜索：基于Bing搜索引擎获取实时信息\n3. Office集成：Word/Excel/PPT/Outlook中的AI辅助\n4. 图像识别：理解图片内容并回答相关问题\n5. 图像生成：内置DALL-E 3生成图像\n6. 插件系统：扩展Copilot的第三方能力\n\n【应用场景】\n1. 日常办公：在Office中写文档/做表/做PPT\n2. 系统操作：用自然语言控制Windows设置\n3. 实时搜索：获取最新新闻和信息\n4. 会议辅助：Teams会议中实时总结和记录\n5. 编程助手：在VS Code中写代码\n6. 信息整理：网页内容分析和摘要\n\n【收费情况】\n免费+付费。Windows Copilot和Copilot Web免费使用。Microsoft 365 Copilot需要订阅$30/用户/月（需已有Microsoft 365商业版）\n\n【使用形态】\n系统内置+Web端+Office集成。\n\n【使用说明】\n1. Windows 11用户按Win+C键启动Copilot侧边栏\n2. 访问 copilot.microsoft.com 使用Web版\n3. 使用自然语言提问或描述需求\n4. 在Edge浏览器中通过侧边栏调用\n5. Office用户登录后点击Copilot按钮\n6. 在Teams会议中调用Copilot总结\n\n【优势】\n1. Windows系统深度集成\n2. Office办公天然优势\n3. 联网搜索能力强\n4. 免费版功能强大\n5. 微软生态协同\n\n【劣势】\n1. 仅限Windows 11\n2. 对话连贯性不如ChatGPT\n3. 国产化支持不足\n4. 深度依赖微软账号\n\n【支持平台】\nWindows 11、Web端（Edge/Chrome）、Office套件、Teams", "s": "Microsoft Copilot是微软基于GPT-4的AI助手，深度集成Windows/Office/Edge，具备联网搜索和图像生成能力。"},
  {"n": "智谱清言 GLM-5", "c": "通用AI大模型", "p": "智谱AI", "u": "https://chatglm.cn", "t": "对话", "r": "免费+付费", "d": "【产品名片】智谱清言 GLM-5 | 通用AI大模型 | 智谱AI | https://chatglm.cn | 收费：免费+付费\n\n【详细介绍】\n智谱清言（ChatGLM）是智谱AI（Zhipu AI）基于GLM（General Language Model）系列大模型开发的AI对话产品。智谱AI由清华大学计算机系唐杰教授团队孵化，是中国最早研发大模型的公司之一。GLM-5是其第五代模型，在推理能力、多模态理解和知识覆盖方面实现了重大突破。智谱清言在中文理解、数理推理、代码生成和知识问答方面表现优异，特别是在中文语境下的深度理解和专业知识问答能力突出。智谱清言支持100万token超长上下文，可以处理整本书级别的文本。产品还具备多模态能力，支持图像理解、文档阅读、代码执行、联网搜索和智能体功能。智谱清言GLM系列模型在多个中文AI基准测试中名列前茅，GLM-5在SuperCLUE和C-Eval等中文评测中达到领先水平。智谱清言还提供企业级API服务和私有化部署方案。\n\n【核心功能】\n1. 深度中文理解：在中国文化/政策/法规方面理解精准\n2. 百万token上下文：超长文本处理能力\n3. 多模态理解：图像/文档/表格混合输入分析\n4. 代码执行：内置Python代码运行沙箱\n5. 联网搜索：手动开启联网获取最新信息\n6. 智能体：支持自定义AI Agent和执行任务\n\n【应用场景】\n1. 中文专业问答：法律/医学/教育等专业领域咨询\n2. 学术论文辅助：中文论文撰写/润色/格式调整\n3. 企业公文写作：通知/报告/方案等企业文档\n4. 编程开发：Python/Java/Go等语言的代码生成和调试\n5. 长文档处理：合同/论文/政策文件的全文阅读和分析\n6. 教育培训：学术辅导/考试准备/知识讲解\n\n【收费情况】\n免费+付费。基础版免费使用。Pro版￥30/月，优先模型+更多token+代码执行。API按token计费，GLM-5约￥5-10/百万token。\n\n【使用形态】\nWeb端、移动App、API接口。\n\n【使用说明】\n1. 访问 chatglm.cn 注册（手机号/微信）\n2. 在对话框输入问题或上传文件/图片\n3. 点击联网搜索图标获取最新信息\n4. 使用代码执行功能运行Python代码\n5. 创建自定义智能体完成特定任务\n6. 企业用户通过API集成到业务系统\n\n【优势】\n1. 中文理解能力国内顶尖\n2. 清华背景，学术底蕴深厚\n3. 百万token超长上下文\n4. 多模态能力强\n5. 企业API和私有化部署\n\n【劣势】\n1. 国际市场知名度低\n2. 创意写作不如ChatGPT\n3. 联网搜索需手动开启\n4. 生态不如百度/阿里\n\n【支持平台】\nWeb端、iOS App、Android App、API", "s": "智谱清言是智谱AI基于GLM-5大模型开发的AI对话产品，中文理解能力国内顶尖，支持百万token上下文。"},
  {"n": "MiniMax 01", "c": "通用AI大模型", "p": "稀宇科技", "u": "https://www.minimaxi.com", "t": "对话/API", "r": "免费+付费", "d": "【产品名片】MiniMax 01 | 通用AI大模型 | 稀宇科技 | https://www.minimaxi.com | 收费：免费+付费\n\n【详细介绍】\nMiniMax是稀宇科技（MiniMax）开发的大语言模型产品。稀宇科技成立于2021年，由前商汤科技副总裁闫俊杰创立，是中国AI大模型领域的明星创业公司。MiniMax 01是MiniMax的最新旗舰模型，在多项能力上取得了显著进步。MiniMax的技术路线以「线性注意力机制」为特色，在大幅降低长文本推理计算成本的同时保持了优秀的模型性能。MiniMax 01支持高达100万token的超长上下文窗口，在长文档理解和分析方面表现突出。MiniMax还开发了语音大模型和视频理解模型，形成了多模态能力矩阵。MiniMax在C端推出了「海螺AI」对话产品，在B端提供企业级API服务。MiniMax在2024年完成了超过6亿美元的融资，投资方包括阿里、腾讯等头部机构。MiniMax的Hailuo AI在音频和视频生成领域也有独特优势。\n\n【核心功能】\n1. 超长上下文：100万token窗口，支持长文档全量分析\n2. 线性注意力：创新的注意力机制降低长文本推理成本\n3. 多模态能力：文本+语音+视频的复合理解\n4. 代码生成：主流编程语言的代码编写和调试\n5. 推理能力：数学/逻辑/常识推理表现优异\n6. API服务：企业级API，支持流式输出\n\n【应用场景】\n1. 长文档分析：专业书籍/技术文档/法律合同的全文理解\n2. 科研辅助：学术论文的阅读和分析\n3. 编程开发：代码生成/重构/审查\n4. 知识问答：科学/技术/历史等专业知识问答\n5. 内容创作：文章/报告的AI辅助撰写\n6. 企业应用：通过API集成到客服/知识库/办公系统\n\n【收费情况】\n免费+付费。海螺AI App免费使用。企业API按token计费，具体价格联系销售。MiniMax定价在国产模型中具有竞争力。\n\n【使用形态】\nWeb端、移动App（海螺AI）、API接口。\n\n【使用说明】\n1. 使用海螺AI App或访问 minimaxi.com\n2. 注册并开始对话\n3. 上传长文档进行分析\n4. 企业用户通过API集成\n5. 在开发者平台查看文档\n6. 按需购买API包\n\n【优势】\n1. 超长上下文能力强\n2. 线性注意力技术独特\n3. 多模态布局完整\n4. 资本和技术实力强\n5. 海螺AI C端产品体验好\n\n【劣势】\n1. 品牌知名度还需提升\n2. 生态不如百度/阿里\n3. 海外影响力有限\n4. 企业服务刚起步\n\n【支持平台】\nWeb端、iOS App、Android App（海螺AI）、API", "s": "MiniMax 01是稀宇科技的大语言模型，以线性注意力和100万token超长上下文为特色，多模态能力完整。"},
  {"n": "月之暗面 Moonshot", "c": "通用AI大模型", "p": "月之暗面", "u": "https://www.moonshot.cn", "t": "对话", "r": "免费+付费", "d": "【产品名片】月之暗面 Moonshot | 通用AI大模型 | 月之暗面 | https://www.moonshot.cn | 收费：免费+付费\n\n【详细介绍】\n月之暗面（Moonshot AI）是杨植麟创立的AI公司，于2023年成立后迅速成为中国AI大模型领域的明星企业。公司名称来源于摇滚乐队Pink Floyd的经典专辑《The Dark Side of the Moon》。Moonshot是月之暗面自研的大语言模型系列，其旗舰产品Kimi Chat以其超长上下文处理能力而闻名。Kimi Chat率先在国产模型中支持200万字（约200万token）的超长上下文窗口，可以一次性处理《三体》三部曲体量的文本。Moonshot模型在长文本理解、文档分析和知识推理方面表现突出。月之暗面在2024年完成了超过10亿美元的融资，投资方包括阿里、红杉、砺思资本等，估值超过30亿美元。Kimi Chat是Moonshot模型的C端产品，以对话形式提供AI服务。Moonshot还为企业提供大模型API服务和行业解决方案。\n\n【核心功能】\n1. 200万token超长上下文：国产最长上下文窗口，处理超长文档\n2. 深度文档理解：PDF/网页/论文的长文本精准分析和问答\n3. 联网搜索：自动搜索互联网获取最新信息\n4. 多文件处理：同时上传和分析多个文档\n5. 对话记忆：长对话中的跨轮上下文保持\n6. API服务：企业级Moonshot模型API\n\n【应用场景】\n1. 长文档阅读：专业书籍/研究报告/论文/合同的全文分析\n2. 学术研究：多篇论文的交叉比对和综述撰写\n3. 法律审查：合同条款的逐条分析和风险识别\n4. 市场研究：行业报告和市场数据的深度分析\n5. 代码库分析：大型代码仓的理解和文档生成\n6. 知识管理：企业文档库的智能问答\n\n【收费情况】\n免费+付费。Kimi Chat免费使用，支持联网搜索和长文本。企业API按量计费，具体价格联系销售。\n\n【使用形态】\nWeb端、移动App、API接口。\n\n【使用说明】\n1. 访问 kimi.moonshot.cn 注册\n2. 在对话框上传文件或输入问题\n3. 选择联网搜索模式获取最新信息\n4. 长文本模式下输入超长文档链接或直接粘贴\n5. 对比分析多个文件的内容\n6. 企业用户通过API集成Moonshot模型\n\n【优势】\n1. 200万token超长上下文（国产最长）\n2. 文档分析能力极强\n3. 融资实力雄厚\n4. 创始团队背景优秀\n5. 产品体验流畅\n\n【劣势】\n1. 模型通用能力还在追赶\n2. 多模态能力有限（主要是文本）\n3. 计算成本较高\n4. 企业级产品还在完善中\n\n【支持平台】\nWeb端、iOS App、Android App、API接口", "s": "月之暗面Moonshot是杨植麟创立的AI公司旗舰模型，Kimi Chat支持200万字超长上下文，文档分析能力极强。"},
  {"n": "Ideogram", "c": "AI设计/图像", "p": "Ideogram AI", "u": "https://ideogram.ai", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Ideogram | AI设计/图像 | Ideogram AI | https://ideogram.ai | 收费：免费+付费\n\n【详细介绍】\nIdeogram是由前Google Brain研究人员创立的AI图像生成平台，其最大特色是「文字渲染」能力——在图像中生成清晰、准确、排版精美的文字。这是Ideogram与Midjourney、DALL-E等工具的core差异化优势。Ideogram 2.0版本在图像质量、风格多样性和文字生成方面达到了业界领先水平。平台支持多种图像风格（写实摄影/数字艺术/油画/动漫/3D渲染/像素风等），并提供「Magic Prompt」功能自动优化用户的提示词。Ideogram还支持图像编辑（局部重绘/扩展）、图生图（以图生图/风格迁移）以及画布模式。Ideogram对设计师特别友好，因为高质量的文字渲染使其可以直接用于Logo设计、海报制作、社交媒体配文图等需要文字的设计场景。\n\n【核心功能】\n1. 文字渲染：AI图像中生成清晰精美的文字\n2. 多风格支持：写实/数字艺术/油画/动漫/3D等\n3. Magic Prompt：自动优化提示词\n4. 图像编辑：局部重绘、图像扩展\n5. 图生图：基于参考图片生成新图像\n6. 画布模式：自由布局多个元素\n\n【应用场景】\n1. Logo设计：生成带文字的品牌Logo\n2. 海报制作：活动海报/促销海报，文字精美\n3. 社媒配图：带标题的社交媒体图片\n4. 广告素材：带文案的广告Banner\n5. 名片设计：带联系方式的名片\n6. 营销素材：带营销文案的产品图\n\n【收费情况】\n免费+付费。免费用户每天约25次生成。付费版$20-$80/月，更多生成次数+更高分辨率+商业使用。\n\n【使用形态】\n在线SaaS服务。Web端使用。\n\n【使用说明】\n1. 访问 ideogram.ai 注册\n2. 在输入框中输入图像描述（含文字用引号标注）\n3. 选择图像风格和比例\n4. 点击生成\n5. 使用Magic Prompt自动优化\n6. 下载或编辑\n\n【优势】\n1. 文字渲染能力独一无二\n2. 图像质量高\n3. 使用简单\n4. 免费额度不错\n5. 适合设计师\n\n【劣势】\n1. 风格多样性不如Midjourney\n2. 高级功能需付费\n3. 中文文字渲染不如英文\n4. 社区生态不如MJ\n\n【支持平台】\nWeb端", "s": "Ideogram以前Google Brain团队背景和业界领先的AI文字渲染能力著称，适合Logo/海报等带文字的设计。"},
  {"n": "Flux", "c": "AI设计/图像", "p": "Black Forest Labs", "u": "https://blackforestlabs.ai", "t": "开源模型", "r": "开源免费", "d": "【产品名片】Flux | AI设计/图像 | Black Forest Labs | https://blackforestlabs.ai | 收费：开源免费\n\n【详细介绍】\nFlux是由Black Forest Labs开发的顶级开源AI绘图模型。Black Forest Labs由前Stability AI核心团队成员（包括Stable Diffusion的原创作者）于2024年创立。Flux一经发布就被广泛认为是目前最强的开源图像生成模型，在图像质量、提示词遵循度和文字渲染方面全面超越了Stable Diffusion 3和SDXL。Flux提供了多个版本：Flux.1 Pro（完整版，最强质量）、Flux.1 Dev（开发者版，开源非商用）和Flux.1 Schnell（快速版，Apache 2.0开源可商用）。Flux采用全新的整流流（Rectified Flow）架构，生成速度比SDXL快约10倍，同时图像质量显著提升。Flux在人体解剖、手部细节、光影表现和材质质感方面表现极为出色，已经逼近甚至在某些场景超越了Midjourney。Flux的开源生态迅速发展，ComfyUI、Stable Web UI等工具均已支持。\n\n【核心功能】\n1. 顶级质量：开源模型中图像质量最高，逼近Midjourney\n2. 多版本：Pro/Dev/Schnell三个版本满足不同需求\n3. 整流流架构：生成速度快，10倍于SDXL\n4. 手部细节：人体解剖和手部生成准确性大幅提升\n5. 文字渲染：开源模型中文字生成能力最强\n6. 开源可商用：Schnell版Apache 2.0协议\n\n【应用场景】\n1. 商业设计：Flux Schnell可商用的高质量图像生成\n2. 本地部署：在本地GPU上运行Flux Dev/Schnell\n3. AI艺术创作：高质量的AI艺术作品生成\n4. 产品设计：产品效果图和概念设计\n5. 游戏美术：游戏角色和场景概念设计\n6. 科研实验：AI图像生成学术研究\n\n【收费情况】\n开源免费。Flux Dev和Schnell免费下载使用。Flux Pro通过API按量计费。\n\n【使用形态】\n开源模型自部署（ComfyUI/Web UI）+ 在线API。\n\n【使用说明】\n1. 从HuggingFace下载Flux模型\n2. 在ComfyUI或Stable Web UI中加载\n3. 输入提示词生成图像\n4. 使用Flux API（通过Replicate/Fal.ai等平台）\n5. 本地推理推荐24GB+ VRAM\n6. 使用Schnell版可免费商用\n\n【优势】\n1. 开源模型质量最高\n2. 生成速度快\n3. 手部和人体表现好\n4. 文字渲染能力\n5. 开源可商用\n\n【劣势】\n1. 硬件要求高（24GB+ VRAM）\n2. 生态不如SD成熟\n3. Pro版不开源\n4. 中文理解有限\n\n【支持平台】\nComfyUI、Stable Web UI、Replicate、Fal.ai、HuggingFace", "s": "Flux是Black Forest Labs开发的顶级开源AI绘图模型，由前Stability AI核心团队打造，图像质量逼近Midjourney。"},
  {"n": "Recraft AI", "c": "AI设计/图像", "p": "Recraft", "u": "https://www.recraft.ai", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Recraft AI | AI设计/图像 | Recraft | https://www.recraft.ai | 收费：免费+付费\n\n【详细介绍】\nRecraft AI是一款专注于矢量插画和品牌图形生成的AI设计工具。与传统AI图像工具（主要生成位图/照片）不同，Recraft AI可以生成SVG矢量图形——这意味着生成的图像可以无限放大而不失真，可以自由编辑颜色和形状，非常适合专业设计师和品牌物料制作。Recraft AI支持多种输出风格：矢量插画、平面设计图标、Logo、卡通角色、写实图像等。Recraft提供「品牌工具包」功能，用户可以设定品牌色板、字体和风格，所有生成的内容自动遵循品牌规范。Recraft还支持「风格一致」功能——用户可以上传参考图让AI学习特定风格，然后在后续生成中保持风格统一。Recraft的矢量输出能力使其在UI设计、图标设计、品牌物料和印刷品设计领域有独特价值。\n【核心功能】\n1. SVG矢量输出：生成可无限放大的矢量图形\n2. 品牌工具包：设定配色/字体/风格的品牌规范\n3. 风格一致：学习参考图风格并保持统一\n4. 多风格支持：矢量插画/图标/Logo/写实等\n5. 颜色编辑：自由修改生成图形的颜色\n6. 背景移除：一键移除图像背景\n\n【应用场景】\n1. 品牌设计：Logo/VI/品牌色板的设计\n2. 图标设计：UI图标/应用图标/功能图标\n3. 插画创作：矢量插画/角色设计/场景插画\n4. 印刷物料：名片/传单/海报的矢量素材\n5. 包装设计：产品包装的图形和纹样\n6. 演示素材：PPT/Keynote的矢量化图表和图标\n\n【收费情况】\n免费+付费。免费用户每天约10次生成。付费版$20-$48/月，更多生成+SVG导出+品牌工具包。\n\n【使用形态】\n在线SaaS服务。Web端使用。\n\n【使用说明】\n1. 访问 recraft.ai 注册\n2. 选择生成模式（矢量/写实/插画等）\n3. 输入描述或上传参考图\n4. 设定品牌颜色和风格\n5. 生成后编辑颜色和细节\n6. 导出SVG/PNG/PDF格式\n\n【优势】\n1. 矢量输出业界独家\n2. 品牌工具包实用\n3. 风格一致性保持好\n4. 适合专业设计师\n5. SVG可无限放大\n\n【劣势】\n1. 写实图像能力弱\n2. 免费额度少\n3. 中文支持不足\n4. 生成速度一般\n\n【支持平台】\nWeb端", "s": "Recraft AI专注矢量插画和品牌图形生成，支持SVG输出、品牌工具包和风格统一，适合专业设计师。"},

  {"n": "醒图 AI", "c": "AI设计/图像", "p": "美图公司", "u": "https://www.xingtu.cn", "t": "移动App", "r": "免费+付费", "d": "【产品名片】醒图 AI | AI设计/图像 | 美图公司 | https://www.xingtu.cn | 收费：免费+付费\n\n【详细介绍】\n醒图是美图公司推出的AI图像编辑和AI绘画App，是中国最流行的移动端AI修图工具之一。醒图将AI绘画与传统修图功能深度融合，提供「AI绘画」「AI写真」「AI扩图」「智能抠图」「画质修复」「老照片修复」「一键美颜」等一系列AI驱动的图像处理功能。醒图的AI绘画功能支持文生图和图生图，提供了丰富的风格模板——动漫风、油画风、水彩风、插画风、3D风等。醒图的AI写真功能用户只需上传几张自拍即可生成各种风格的写真照片。醒图最大的优势是移动端体验优秀，操作简单，功能集成度高，适合普通用户而非专业设计师。醒图的AI功能大部分免费使用，高级功能需要VIP会员。醒图在中文市场的用户基数极大，月活跃用户超过5000万。\n\n【核心功能】\n1. AI绘画：文生图/图生图，多风格模板\n2. AI写真：上传照片生成多风格写真\n3. AI扩图：智能扩展图片边缘内容\n4. 智能抠图：一键精准去除背景\n5. 画质修复：模糊图片AI增强\n6. 老照片修复：黑白上色+划痕修复\n\n【应用场景】\n1. 个人修图：日常照片的美化和编辑\n2. 社交媒体：朋友圈/小红书的美图\n3. AI头像：生成AI风格头像\n4. 老照片翻新：家庭老照片的修复和上色\n5. 证件照：AI自动生成证件照\n6. 创意编辑：图片的艺术风格转换\n\n【收费情况】\n免费+付费。基础AI功能免费。VIP会员￥15-￥30/月，解锁全部AI功能和高级模板。\n\n【使用形态】\n移动App。iOS和Android。\n\n【使用说明】\n1. 在应用商店下载醒图App\n2. 打开选择AI绘画或AI写真\n3. AI绘画：输入描述或选模板\n4. AI写真：上传3-5张自拍\n5. 等待生成\n6. 保存或分享\n\n【优势】\n1. 移动端体验最好\n2. AI功能集成丰富\n3. 操作极简\n4. 免费功能多\n5. 用户基数大\n\n【劣势】\n1. 专业设计能力不足\n2. 图像质量有上限\n3. 依赖网络\n4. 商业版权有限\n\n【支持平台】\niOS App、Android App", "s": "醒图是美图公司的AI图像编辑App，AI绘画/写真/扩图/修图功能集成度高，移动端体验优秀。"},
  {"n": "美图设计室 AI", "c": "AI设计/图像", "p": "美图公司", "u": "https://design.meitu.com", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】美图设计室 AI | AI设计/图像 | 美图公司 | https://design.meitu.com | 收费：免费+付费\n\n【详细介绍】\n美图设计室（Meitu Design Studio）是美图公司面向商业设计的AI设计平台，定位为「AI商用设计工具」。与醒图（面向个人用户）不同，美图设计室专注于商业场景——提供AI海报设计、AI Logo设计、AI电商产品图、AI模特换装、AI商品背景替换等商业设计功能。美图设计室内置了海量设计模板，覆盖电商主图、社交媒体海报、促销Banner、名片、菜单、邀请函等常见商业场景。用户只需输入文字或选择模板，AI即可自动生成完整的商业设计稿。美图设计室的AI模特功能特别适合电商——上传商品图片，AI自动生成真人模特展示图。美图设计室还提供AI商品视频功能，支持将商品图转为动态展示视频。\n\n【核心功能】\n1. AI海报设计：输入描述自动生成商业海报\n2. AI Logo：文字描述生成Logo方案\n3. AI电商产品图：商品图+替换背景+添加文字\n4. AI模特换装：商品图生成真人模特展示\n5. AI商品视频：商品图转动态展示视频\n6. 设计模板：海量商用模板一键套用\n\n【应用场景】\n1. 电商运营：商品主图/详情页/促销海报\n2. 社媒营销：公众号/小红书/抖音的视觉素材\n3. 品牌设计：Logo/名片/品牌VI\n4. 线下物料：菜单/传单/展架/邀请函\n5. 店铺装修：电商店铺整体的视觉设计\n6. 批量设计：多SKU商品的统一风格出图\n\n【收费情况】\n免费+付费。基础模板免费使用。高级模板和AI功能需要VIP，￥29-￥99/月。企业版按需定制。\n\n【使用形态】\n在线SaaS服务。Web端使用。\n\n【使用说明】\n1. 访问 design.meitu.com 登录\n2. 选择设计场景（海报/Logo/电商图等）\n3. 选择模板或输入AI描述\n4. 编辑文字和颜色\n5. AI自动排版和美化\n6. 下载高清图片\n\n【优势】\n1. 商业设计场景针对性强\n2. 模板丰富覆盖广\n3. AI电商功能独特\n4. 操作简便\n5. 美图品牌信任\n\n【劣势】\n1. 创作自由度有限\n2. 高级功能需付费\n3. 非电商场景较弱\n4. 输出格式有限\n\n【支持平台】\nWeb端", "s": "美图设计室是美图公司面向商业设计的AI平台，专注电商/海报/Logo等场景的AI商用设计。"},
  {"n": "Photoshop Generative Fill", "c": "AI设计/图像", "p": "Adobe", "u": "https://www.adobe.com/products/photoshop/generative-fill.html", "t": "桌面软件", "r": "付费", "d": "【产品名片】Photoshop Generative Fill | AI设计/图像 | Adobe | https://www.adobe.com/products/photoshop/generative-fill.html | 收费：付费\n\n【详细介绍】\nPhotoshop Generative Fill（生成式填充）是Adobe在Photoshop中集成的AI功能，基于Adobe Firefly模型。这是AI图像编辑领域最具里程碑意义的功能之一——用户只需在Photoshop中选择区域，输入文字描述，AI即可在选区内生成与周围图像无缝融合的内容。Generative Fill可以用于：扩展图像（超出原始边界的智能填充）、移除对象（选中不需要的内容并让AI填充）、添加对象（在图像中添加新的元素）、修改背景（一键替换或修改背景）。Generative Fill的生成结果与原图的光影、色调和纹理完美匹配，几乎看不出AI处理的痕迹。Adobe将Firefly模型直接集成到Photoshop的工作流程中，无需离开Photoshop即可使用AI功能。Generative Fill需要订阅Adobe Creative Cloud（含Firefly额度）。\n\n【核心功能】\n1. 生成式填充：选区AI生成内容无缝融合\n2. 图像扩展：超出画布边界的智能扩展\n3. 对象移除：选中内容AI智能消除\n4. 对象添加：在图像中添加新元素\n5. 背景替换：一键替换图片背景\n6. Photoshop原生集成：无需切换工具\n\n【应用场景】\n1. 产品修图：商品图背景替换和瑕疵修复\n2. 人像修图：去除路人/杂物/皮肤瑕疵\n3. 创意合成：多张图像的智能合成和延展\n4. 广告设计：创意海报的元素添加和扩展\n5. 电商图片：商品图的场景化处理和优化\n6. 摄影后期：风光摄影的构图调整和扩展\n\n【收费情况】\n付费。需要Adobe Creative Cloud订阅（含Photoshop），$22.99/月起。Generative Fill使用Firefly额度，根据订阅等级每月有不同的生成次数。\n\n【使用形态】\n桌面端软件。Photoshop内置功能。\n\n【使用说明】\n1. 在Photoshop中打开图像\n2. 使用选区工具选择要填充的区域\n3. 点击「生成式填充」按钮\n4. 输入描述或留空让AI自动填充\n5. AI生成多个方案供选择\n6. 确认或重新生成\n\n【优势】\n1. 与Photoshop无缝集成\n2. 生成结果与原图融合好\n3. 专业级图像编辑能力\n4. 生成质量高\n5. 设计行业标准工具\n\n【劣势】\n1. 需要付费订阅\n2. 需要Firefly额度\n3. 生成速度较慢\n4. 国内访问受限\n5. 学习曲线存在\n\n【支持平台】\nWindows桌面、macOS桌面", "s": "Photoshop Generative Fill是Adobe在PS中集成的AI生成式填充功能，选区AI内容生成与原图无缝融合。"},
  {"n": "Figma AI", "c": "AI设计/图像", "p": "Figma", "u": "https://www.figma.com/ai", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Figma AI | AI设计/图像 | Figma | https://www.figma.com/ai | 收费：免费+付费\n\n【详细介绍】\nFigma AI是Figma设计平台内置的AI功能集合，将AI能力深度集成到UI/UX设计工作流中。Figma自2024年起陆续推出的AI功能包括：AI设计生成（根据文字描述自动生成UI界面和组件）、AI内容填充（自动生成真实的占位文本和数据）、AI图片生成（在设计稿中直接生成图像）、AI设计系统管理、AI自动命名图层和组件、AI搜索设计资源等。Figma AI使设计师可以在几秒内从空白画布生成完整的页面设计，大幅提升了UI设计的效率。Figma AI特别适合产品设计团队——可以快速生成多个设计方案供评审，自动生成设计系统的组件变体，以及自动完成重复性的设计工作。Figma AI在设计社区引起了广泛关注，被认为是UI/UX设计领域最具影响力的AI工具之一。\n\n【核心功能】\n1. AI设计生成：文字描述自动生成UI界面\n2. AI内容填充：设计稿中自动生成真实内容\n3. AI图片生成：设计稿内直接生成图像素材\n4. AI命名：自动命名图层/组件/样式\n5. AI设计搜索：自然语言搜索设计资源\n6. AI组件变体：自动生成组件的不同状态\n\n【应用场景】\n1. UI界面设计：快速生成App/Web页面设计\n2. 设计系统：自动管理和扩展设计系统\n3. 原型设计：从草图到高保真原型的快速转化\n4. 设计评审：快速生成多个方案供对比\n5. 素材生成：在设计稿中直接生成配图\n6. 设计规范：自动维护设计规范和一致性\n\n【收费情况】\n免费+付费。Figma AI包含在Figma专业版中。免费版有有限的AI使用额度。专业版$15/月，含完整AI功能。企业版$45/月。\n\n【使用形态】\n在线SaaS服务。Web端和桌面App。\n\n【使用说明】\n1. 在Figma中打开设计文件\n2. 点击AI按钮或使用快捷键\n3. 选择AI功能（生成设计/填充内容/生成图像等）\n4. 输入描述或选择需求\n5. AI自动生成并插入设计稿\n6. 手动调整和精细化\n\n【优势】\n1. UI设计AI功能最强\n2. 与Figma工作流无缝集成\n3. 大幅提升设计效率\n4. 设计系统AI管理\n5. 行业内标准工具\n\n【劣势】\n1. 仅限UI/UX场景\n2. 需要Figma订阅\n3. 图像生成不如专业工具\n4. 国内访问需特殊网络\n\n【支持平台】\nWeb端、macOS桌面App、Windows桌面App", "s": "Figma AI是Figma设计平台的AI功能集合，文字生成UI界面/内容填充/图像生成，大幅提升设计效率。"},
  {"n": "Remove.bg", "c": "AI设计/图像", "p": "Remove.bg / Kaliber", "u": "https://www.remove.bg", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Remove.bg | AI设计/图像 | Remove.bg / Kaliber | https://www.remove.bg | 收费：免费+付费\n\n【详细介绍】\nRemove.bg是全球最知名的AI背景移除工具，专注于「一键去除图片背景」这一核心功能并将其做到极致。Remove.bg基于深度学习模型，能够在几秒内精准识别图像中的前景主体并移除背景，支持人物、动物、产品、车辆、食物等几乎所有类型的物体。Remove.bg的处理精度非常高——头发丝、动物毛发、半透明物体等复杂边缘也能处理得较为干净。Remove.bg支持批量处理（一次最多处理50张图片）、API集成（企业可以将背景移除功能嵌入自己的应用或网站中）和多种输出格式（透明PNG/白色背景/自定义颜色背景）。Remove.bg还提供AI背景替换功能，移除背景后可自动生成新的场景背景。Remove.bg每天处理超过100万张图片，是电商、设计、摄影等行业的常用工具。\n\n【核心功能】\n1. AI抠图：一键精准移除图片背景\n2. 复杂边缘：头发/毛发/透明物体精细处理\n3. 背景替换：移除后AI生成新背景\n4. 批量处理：一次最多50张批量处理\n5. API集成：将抠图能力嵌入自有应用\n6. 多格式输出：透明PNG/自定义背景色\n\n【应用场景】\n1. 电商产品图：商品图去背景+替换场景\n2. 证件照制作：人像去背景替换纯色背景\n3. 设计素材：为设计稿准备透明PNG素材\n4. 产品展示：产品图片的统一背景处理\n5. 人像修图：人物照片的背景替换\n6. 自动化流程：通过API批量处理图片\n\n【收费情况】\n免费+付费。免费版低分辨率预览（500x500）。高清下载需要付费，$0.99/张或包月$9/月（50张）起。API按量计费。\n\n【使用形态】\n在线SaaS服务 + API接口。Web端和桌面端。\n\n【使用说明】\n1. 访问 remove.bg\n2. 上传图片\n3. AI自动识别并移除背景\n4. 检查抠图效果，可手动微调\n5. 替换背景或保留透明\n6. 下载高清图片\n\n【优势】\n1. 抠图精度业内最高\n2. 使用极简单（上传即出结果）\n3. 支持批量处理\n4. API完善\n5. 复杂边缘处理好\n\n【劣势】\n1. 免费版只有低清预览\n2. 高清下载需付费\n3. 仅做抠图单一功能\n4. 大图处理速度慢\n\n【支持平台】\nWeb端、Windows桌面、macOS桌面、API、PS插件", "s": "Remove.bg是全球最知名的AI去背景工具，一键精准抠图，头发/毛发等复杂边缘处理出色。"},
  {"n": "Topaz Photo AI", "c": "AI设计/图像", "p": "Topaz Labs", "u": "https://www.topazlabs.com/topaz-photo-ai", "t": "桌面软件", "r": "付费", "d": "【产品名片】Topaz Photo AI | AI设计/图像 | Topaz Labs | https://www.topazlabs.com/topaz-photo-ai | 收费：付费\n\n【详细介绍】\nTopaz Photo AI是Topaz Labs推出的AI图像增强软件，被誉为「AI修图界的瑞士军刀」。Topaz Photo AI集成了三个核心AI模块：Denoise AI（AI降噪——在去除噪点的同时保留细节）、Sharpen AI（AI锐化——修复模糊图片，纠正相机抖动和失焦）、Gigapixel AI（AI放大——将低分辨率图片无损放大至4倍/6倍甚至更高）。Topaz Photo AI的AI模型基于数百万张专业照片训练，能够在增强图像的同时保持自然质感，不会出现过度平滑或伪影。Topaz Photo AI特别适合摄影师——可以用AI挽救因高ISO、手抖或低分辨率而「报废」的照片。Topaz Photo AI的操作极其简单，用户只需加载图片，AI会自动分析并应用最佳的处理参数，也可以手动微调。\n\n【核心功能】\n1. AI降噪：高ISO照片降噪保留细节\n2. AI锐化：修复模糊/抖动/失焦的照片\n3. AI放大：低分辨率无损放大至高分辨率\n4. 人脸增强：AI修复人脸细节和清晰度\n5. 自动分析：AI自动分析照片并优化参数\n6. 批量处理：整批照片一键优化\n\n【应用场景】\n1. 摄影后期：高ISO照片降噪和锐化\n2. 老照片修复：老旧扫描照片的高清修复\n3. 监控截图：低清监控画面的人脸增强\n4. 手机照片：手机拍摄照片的质量提升\n5. 电商图片：产品图的清晰度和细节增强\n6. 档案数字化：档案扫描件的清晰化处理\n\n【收费情况】\n付费。一次性购买$199。提供30天免费试用。\n\n【使用形态】\n桌面端独立软件。支持Photoshop/Lightroom插件模式。\n\n【使用说明】\n1. 打开Topaz Photo AI\n2. 拖入需要处理的图片\n3. AI自动分析并推荐处理方案\n4. 选择AI降噪/锐化/放大\n5. 调整参数预览效果\n6. 导出高清图片\n\n【优势】\n1. 图像增强效果最好\n2. AI自动分析省心\n3. 一次性购买非订阅\n4. 支持PS/LR插件\n5. 批量处理效率高\n\n【劣势】\n1. 价格较高（$199）\n2. 仅做图像增强单一方向\n3. 不支持文生图\n4. GPU要求较高\n\n【支持平台】\nWindows桌面、macOS桌面", "s": "Topaz Photo AI是专业AI图像增强软件，集降噪/锐化/放大于一体，堪称AI修图瑞士军刀。"},
  {"n": "Pixelmator AI", "c": "AI设计/图像", "p": "Pixelmator", "u": "https://www.pixelmator.com/pro/ai", "t": "桌面软件", "r": "付费", "d": "【产品名片】Pixelmator AI | AI设计/图像 | Pixelmator | https://www.pixelmator.com/pro/ai | 收费：付费\n\n【详细介绍】\nPixelmator Pro AI是Mac平台上最强大的AI图像编辑软件，被誉为「Mac版的AI Photoshop替代品」。Pixelmator Pro在传统图像编辑功能基础上深度集成了AI能力：AI去背景（ML增强的快速抠图）、AI降噪和锐化、AI超分辨率（无损放大）、AI颜色调整（智能匹配参考图的色彩风格）、AI对象移除（智能填充移除区域）、AI修复画笔（智能纹理修复）等。Pixelmator Pro最受好评的功能之一是AI去背景——无需复杂操作，一键即可精准抠出主体。另一个特色功能是AI Super Resolution——可以将低分辨率图片无损放大4倍，效果接近甚至超过Topaz Gigapixel。Pixelmator Pro采用一次性购买模式（非订阅制），定价合理，在Mac用户群体中拥有很高的口碑。\n\n【核心功能】\n1. AI去背景：一键精准抠图，边缘处理精细\n2. AI超分辨率：低清图片无损放大4倍\n3. AI修复：智能修复老照片和划痕\n4. AI颜色匹配：自动匹配参考图色调\n5. AI降噪：高ISO照片智能降噪\n6. AI对象移除：选中对象AI智能填充\n\n【应用场景】\n1. Mac用户的日常修图\n2. 人像照片的背景替换和美化\n3. 老照片/扫描件的AI修复\n4. 电商产品图的抠图和优化\n5. 设计素材的编辑和处理\n6. 社交媒体配图的快速修饰\n\n【收费情况】\n付费。Mac App Store一次性购买$49.99。免费试用15天。\n\n【使用形态】\n桌面端软件。仅支持macOS。\n\n【使用说明】\n1. 打开Pixelmator Pro\n2. 打开要编辑的图片\n3. 使用AI功能（去背景/超分辨率/修复等）\n4. AI自动处理，显示前后对比\n5. 手动微调参数\n6. 导出处理后的图片\n\n【优势】\n1. Mac平台最佳AI修图工具\n2. 一次性购买价低\n3. AI功能全面\n4. 去背景和超分辨率效果好\n5. 与macOS集成好\n\n【劣势】\n1. 仅支持Mac\n2. 不支持文生图\n3. 无Windows版\n4. 插件生态不如Photoshop\n\n【支持平台】\nmacOS桌面", "s": "Pixelmator Pro AI是Mac平台最强AI图像编辑软件，AI去背景/超分辨率/修复功能出色，一次性购买。"},
  {"n": "Magical Brush", "c": "AI设计/图像", "p": "Clipdrop/Stability AI", "u": "https://clipdrop.co/", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Magical Brush | AI设计/图像 | Clipdrop/Stability AI | https://clipdrop.co/ | 收费：免费+付费\n\n【详细介绍】\nMagical Brush（魔法笔刷）是Clipdrop平台（由Stability AI开发）推出的AI局部图像编辑工具。Magical Brush的功能直观且强大：用户只需用笔刷在图片上涂抹想要修改的区域，然后输入文字描述想要的内容，AI就会自动在该区域生成相应的图像内容。Magical Brush可以用于：移除物体（涂抹不需要的东西AI自动消除）、添加物体（在涂抹区域生成新物体）、替换颜色（涂抹区域AI智能换色）、修改纹理（改变表面的材质和纹理）、修复瑕疵（涂抹瑕疵区域AI修复）。Magical Brush的独特之处在于其「以图绘图」的交互方式——像用笔刷在画布上作画一样修改AI图像，操作直观自然。Magical Brush的底层模型经过专门优化，修改区域与原图的融合效果非常自然。\n\n【核心功能】\n1. 局部重绘：笔刷涂抹区域AI重新生成\n2. 物体移除：涂抹后AI智能消除\n3. 物体添加：涂抹区域生成新对象\n4. 颜色替换：涂抹区域AI更换颜色\n5. 纹理修改：改变表面材质和质感\n6. 瑕疵修复：涂抹区域AI智能修复\n\n【应用场景】\n1. 产品修图：去除产品上的瑕疵和污点\n2. 人像修图：去除痣/疤痕/皱纹等\n3. 创意编辑：在照片中添加或移除元素\n4. 电商图片：产品图背景的局部修改\n5. 摄影后期：风光照中移除杂物\n6. 设计制作：设计稿中调整局部元素\n\n【收费情况】\n免费+付费。Clipdrop免费版有基础功能限制。Pro版$9-19/月，更多使用次数+高清+商用。\n\n【使用形态】\n在线SaaS服务。Web端和API。\n【使用说明】\n1. 访问 clipdrop.co 并打开Magical Brush\n2. 上传要编辑的图片\n3. 用笔刷涂抹想要修改的区域\n4. 输入描述（如「一朵红色的花」）\n5. AI自动在涂抹区域生成\n6. 确认或重新生成\n\n【优势】\n1. 交互方式直观（笔刷涂抹）\n2. 局部修改精度高\n3. 融合效果自然\n4. 移除和添加都支持\n5. Stability AI技术保障\n\n【劣势】\n1. 免费版有限制\n2. 大图处理慢\n3. 复杂场景效果不稳定\n4. 国内访问需特殊网络\n\n【支持平台】\nWeb端、API", "s": "Magical Brush是Clipdrop的AI局部编辑工具，笔刷涂抹后AI生成/移除/修改局部内容，操作直观。"},
  {"n": "Synthesia", "c": "AI视频生成", "p": "Synthesia", "u": "https://www.synthesia.io", "t": "SaaS/Web", "r": "付费", "d": "【产品名片】Synthesia | AI视频生成 | Synthesia | https://www.synthesia.io | 收费：付费\n\n【详细介绍】\nSynthesia是全球领先的AI虚拟人视频生成平台，被公认为AI数字人视频领域的标杆产品。Synthesia的核心能力是让用户通过输入文稿即可生成由AI虚拟主播朗读的视频，无需真人出镜、无需拍摄设备、无需录制场地。Synthesia拥有超过230种AI虚拟人形象（涵盖不同种族、年龄、性别的角色），支持140+种语言和口音。虚拟人的口型与语音同步精准（唇形同步技术），面部表情自然，手势配合得当，观看体验接近真人。Synthesia支持以下方式创建视频：输入文字脚本→选择虚拟人→自动生成视频，或者上传PPT/文档→AI自动转化为视频讲解。Synthesia还支持多人虚拟人同屏对话、自定义品牌模板、团队协作等功能。Synthesia被广泛用于企业培训、营销视频、产品介绍、内部通讯等场景。\n\n【核心功能】\n1. AI虚拟人视频：文字转由虚拟人朗读的视频\n2. 230+虚拟人形象：多种族/多年龄/多风格\n3. 140+语言支持：多语言视频一键生成\n4. PPT转视频：上传PPT自动转化为视频讲解\n5. 多人同屏：多个虚拟人同屏对话\n6. 品牌模板：自定义品牌颜色/Logo/字体\n\n【应用场景】\n1. 企业培训：员工培训视频的快速制作\n2. 营销视频：产品介绍和品牌推广视频\n3. 内部通讯：CEO致辞/公告等内部视频\n4. 销售演示：个性化的销售展示视频\n5. 课程制作：在线教育视频内容\n6. 多语言内容：同一内容生成多语言版本\n\n【收费情况】\n付费。个人版约$29/月起。企业版按需定制，包含更多虚拟人和高级功能。\n\n【使用形态】\n在线SaaS服务。Web端使用。\n\n【使用说明】\n1. 访问 synthesia.io 注册\n2. 选择虚拟人和场景模板\n3. 输入或粘贴视频脚本文字\n4. 调整语速/停顿/高亮等参数\n5. 预览效果\n6. 导出MP4视频\n\n【优势】\n1. 虚拟人视频业界标杆\n2. 虚拟人形象丰富逼真\n3. 多语言支持全\n4. 唇形同步精准\n5. 企业级服务完善\n\n【劣势】\n1. 费用较高\n2. 中文虚拟人偏少\n3. 视频风格模板有限\n4. 不支持实时直播\n\n【支持平台】\nWeb端", "s": "Synthesia是全球领先的AI虚拟人视频平台，230+虚拟人/140+语言，文字自动转为AI主播视频。"},
  {"n": "Stable Video Diffusion", "c": "AI视频生成", "p": "Stability AI", "u": "https://stability.ai/stable-video", "t": "开源模型", "r": "开源免费", "d": "【产品名片】Stable Video Diffusion | AI视频生成 | Stability AI | https://stability.ai/stable-video | 收费：开源免费\n\n【详细介绍】\nStable Video Diffusion（SVD）是Stability AI推出的开源AI视频生成模型，是Stable Diffusion系列的视频扩展。SVD能够将静态图片转化为动态视频——给定一张起始图片，AI会基于对图片内容的理解生成后续的视频帧序列，创造出流畅自然的动画效果。SVD的核心技术是潜空间视频扩散模型，通过对大量视频数据的训练学会了物理世界的运动规律。SVD支持多种视频生成模式：图生视频（单张图片动画化）、帧插值（在两张图片之间生成过渡帧）、视频扩展（将已有视频延长）。SVD生成的视频在运动的自然度、场景一致性和风格保持方面表现良好。作为开源模型，SVD可以在本地GPU上运行，也可以通过ComfyUI等工具使用。SVD在AI视频生成开源社区具有重要地位。\n\n【核心功能】\n1. 图生视频：静态图片转为动态视频\n2. 帧插值：两张图片之间生成过渡帧\n3. 视频扩展：将短视频延长\n4. 多种运动模式：平移/缩放/旋转等\n5. 风格保持：输出视频与原图风格一致\n6. 开源可部署：本地GPU运行\n\n【应用场景】\n1. 动态插画：将插画/平面设计转为动态效果\n2. 产品展示：产品图片的动态展示\n3. 社交媒体：动态封面的制作\n4. 创意视频：艺术视频的AI生成\n5. 游戏资产：游戏动态贴图/背景动画\n6. 科研实验：AI视频生成学术研究\n\n【收费情况】\n开源免费。通过Stability AI API使用需付费。本地自部署完全免费。\n\n【使用形态】\n开源模型自部署 + API。\n\n【使用说明】\n1. 从HuggingFace下载SVD模型\n2. 在ComfyUI中加载SVD模型\n3. 上传起始图片\n4. 设置运动参数\n5. 生成视频\n6. 或通过Stability AI API在线使用\n\n【优势】\n1. 开源免费\n2. 图生视频效果好\n3. 风格保持强\n4. 社区生态支持\n5. 可本地部署\n\n【劣势】\n1. 视频时长有限（几秒）\n2. 运动复杂度有限\n3. 硬件要求高\n4. 文生视频不支持\n\n【支持平台】\nComfyUI、Stable Web UI、API、HuggingFace", "s": "Stable Video Diffusion是Stability AI的开源AI视频生成模型，将静态图片转为动态视频，可本地部署。"},
  {"n": "Veo 3", "c": "AI视频生成", "p": "Google DeepMind", "u": "https://deepmind.google/technologies/veo", "t": "SaaS/Web", "r": "付费", "d": "【产品名片】Veo 3 | AI视频生成 | Google DeepMind | https://deepmind.google/technologies/veo | 收费：付费\n\n【详细介绍】\nVeo 3是Google DeepMind推出的最新一代AI视频生成模型，是Google在AI视频领域与Sora竞争的核心产品。Veo 3能够根据文字描述生成高质量的1080p视频，最长达60秒以上。Veo 3采用了先进的DiT（Diffusion Transformer）架构，在视频的物理理解、运动自然度和场景一致性方面取得了显著进步。Veo 3支持文生视频和图生视频两种模式，对提示词的遵循度非常高——能够精准理解用户描述的动作、场景、光线和摄影风格。Veo 3特别擅长处理复杂的运动场景（如人物运动/物体交互/液体流动），运动逻辑合理、画面流畅。Veo 3还支持视频风格控制（写实/动画/电影/纪录片等风格）、镜头控制（推拉摇移跟等运镜方式）和视频编辑功能。Veo 3通过Google Vertex AI平台和VideoFX工具提供服务。\n\n【核心功能】\n1. 文生视频：文字描述生成60秒+高清视频\n2. 图生视频：起始图片生成动态视频\n3. 精准提示词遵循：高度还原用户的描述\n4. 复杂运动处理：人物/物体/流体运动自然\n5. 风格和镜头控制：电影级运镜和风格\n6. 视频编辑：对已生成视频进行修改\n\n【应用场景】\n1. 影视前期：电影/广告的概念预览\n2. 内容创作：社交媒体短视频的快速生成\n3. 广告营销：品牌推广视频的制作\n4. 游戏开发：游戏过场动画的概念生成\n5. 教育内容：教学演示视频的生成\n6. 创意探索：艺术视频的实验性创作\n\n【收费情况】\n付费。通过Google Vertex AI平台按量计费。通过VideoFX有免费试用额度。\n\n【使用形态】\n在线SaaS服务。Web端（VideoFX）和API（Vertex AI）。\n\n【使用说明】\n1. 访问 videoFX.google.com\n2. 在输入框中描述视频内容\n3. 选择风格和参数\n4. 点击生成等待输出\n5. 预览并下载\n6. 企业通过Vertex AI API集成\n\n【优势】\n1. 谷歌AI技术堆叠\n2. 提示词遵循度高\n3. 复杂运动表现好\n4. 1080p高清输出\n5. 风格控制灵活\n\n【劣势】\n1. 需要付费\n2. 仅限部分区域\n3. 中文支持弱\n4. 生成速度较慢\n\n【支持平台】\nWeb端（VideoFX）、API（Vertex AI）", "s": "Veo 3是Google DeepMind的AI视频生成模型，文生视频1080p/60秒+，精准提示词遵循和复杂运动处理出色。"},

  {"n": "OpenAI TTS", "c": "AI语音/合成", "p": "OpenAI", "u": "https://platform.openai.com/docs/guides/text-to-speech", "t": "API", "r": "付费", "d": "【产品名片】OpenAI TTS | AI语音/合成 | OpenAI | https://platform.openai.com/docs/guides/text-to-speech | 收费：付费\n\n【详细介绍】\nOpenAI TTS是OpenAI推出的AI语音合成API服务，是GPT-4o多模态能力的重要组成部分。OpenAI TTS提供了两种模型：TTS-1（标准版，优化速度）和TTS-1-HD（高清版，优化音质）。OpenAI TTS拥有多种内置AI声音，涵盖不同性别、年龄和风格特点。OpenAI TTS在英文语音的自然度方面表现优秀，支持情感控制（用提示词控制语调和情绪）和多语言朗读。OpenAI TTS的独特优势是与OpenAI生态的无缝整合——开发者可以在同一个API平台中使用GPT模型和TTS服务。OpenAI TTS支持流式输出（实时语音生成）、多种音频格式（MP3/OPUS/AAC/FLAC）和多语种（包括中文在内的多种语言）。OpenAI TTS在ChatGPT的语音对话模式中使用的是同样的底层模型。\n\n【核心功能】\n1. 文字转语音：高品质AI语音合成\n2. 多声音选择：多种内置AI声音\n3. 情感控制：提示词控制语调情绪\n4. 流式输出：实时语音流生成\n5. 多格式支持：MP3/OPUS/AAC/FLAC\n6. OpenAI生态：与GPT模型的API统一\n\n【应用场景】\n1. 对话式AI：语音助手/聊天机器人的语音输出\n2. 内容配音：视频/播客/有声内容的配音\n3. 语音提醒：APP通知/语音提示\n4. 教育应用：语言学习/有声教材\n5. 无障碍服务：文字转语音辅助\n6. 游戏开发：游戏角色的语音生成\n\n【收费情况】\n付费。按字符数计费：$0.015/1000字符（标准），$0.030/1000字符（高清）。\n\n【使用形态】\nAPI接口。通过OpenAI API调用。\n\n【使用说明】\n1. 获取OpenAI API Key\n2. 调用TTS API接口\n3. 传入文本和声音参数\n4. 接收生成的音频文件\n5. 在应用中使用\n\n【优势】\n1. OpenAI品牌保障\n2. 与GPT模型生态整合\n3. 支持流式输出\n4. 多语言支持好\n5. API接口标准化\n\n【劣势】\n1. 中文发音不如国产\n2. 声音种类有限\n3. 不支持声音克隆\n4. 按字符计费成本高\n\n【支持平台】\nAPI（OpenAI）", "s": "OpenAI TTS是OpenAI的AI语音合成API，与GPT生态整合，支持流式输出和多语言。"},

  {"n": "Speechify", "c": "AI语音/合成", "p": "Speechify", "u": "https://speechify.com", "t": "App/Web", "r": "免费+付费", "d": "【产品名片】Speechify | AI语音/合成 | Speechify | https://speechify.com | 收费：免费+付费\n\n【详细介绍】\nSpeechify是一款AI文字朗读（TTS）应用，专注于将文字内容转化为自然流畅的语音，让用户「听」文档/文章/书籍而不是阅读。Speechify最初由患有阅读障碍的Cliff Weitzman创立，旨在帮助阅读困难者通过听觉获取信息。如今Speechify已发展成为全球最流行的TTS阅读应用之一。Speechify的核心功能包括：文档朗读（上传PDF/Word/网页/电子书等自动朗读）、AI语音（自然逼真的AI朗读声音，含名人声音）、扫描朗读（用摄像头扫描纸质书页自动朗读）、多速播放（最高支持4.5倍速，适合快速听书）、多语言支持（30+种语言）、离线播放（下载后离线听）。Speechify的AI语音质量在长时间听书场景中表现优异，不会产生听觉疲劳。Speechify是学生、职场人士和阅读障碍者的常用工具。\n\n【核心功能】\n1. 文档朗读：上传PDF/Word/网页自动朗读\n2. AI语音：自然逼真的AI朗读声音\n3. 扫描朗读：摄像头扫描纸质书朗读\n4. 多速播放：支持最高4.5倍速\n5. OCR识别：图片中文字的识别和朗读\n6. 跨平台同步：多设备进度同步\n\n【应用场景】\n1. 学习阅读：学生听读教材和参考资料\n2. 论文浏览：研究者听读学术论文\n3. 职场效率：听读报告/文档/邮件\n4. 阅读障碍：帮助阅读困难者获取信息\n5. 多任务阅读：开车/运动时听文档\n6. 语言学习：通过听读学习外语\n\n【收费情况】\n免费+付费。免费版基础语音有限功能。Premium版$11.58/月，含高级AI声音+无限听+扫描。\n\n【使用形态】\n移动App + 浏览器扩展 + Web端。\n\n【使用说明】\n1. 下载Speechify App或安装浏览器扩展\n2. 导入文档/网页链接/扫描纸质内容\n3. 选择AI声音\n4. 调整播放速度\n5. 开始听读\n6. 跨设备同步进度\n\n【优势】\n1. 长时间听读不疲劳\n2. 语音自然度好\n3. OCR扫描朗读独特\n4. 多设备同步\n5. 多速播放稳定\n\n【劣势】\n1. 中文支持一般\n2. 高级功能需付费\n3. 扫描功能有限制\n4. 大文档加载慢\n\n【支持平台】\niOS App、Android App、Chrome扩展、Web端", "s": "Speechify是AI文字朗读应用，PDF/网页/纸质书自动朗读，多速播放适合听书学习。"},

  {"n": "Whisper", "c": "AI语音/合成", "p": "OpenAI", "u": "https://github.com/openai/whisper", "t": "开源模型", "r": "开源免费", "d": "【产品名片】Whisper | AI语音/合成 | OpenAI | https://github.com/openai/whisper | 收费：开源免费\n\n【详细介绍】\nWhisper是OpenAI开源的通用语音识别模型，被誉为AI语音识别领域的里程碑。Whisper能够在多种语言间进行高精度的语音转文字，支持包括中文在内的99种语言识别和翻译。Whisper采用编码器-解码器Transformer架构，在大规模多语言多任务监督数据上训练，在噪声环境、口音变化和远场拾音场景中表现出极佳的鲁棒性。Whisper提供了多个规格的模型版本（tiny/base/small/medium/large），从轻量级（~1GB显存）到高精度（~10GB显存）满足不同场景需求。Whisper支持语音转录（语音转同语言文字）和语音翻译（语音转英文文字）两种模式。Whisper的开源发布使其成为全球使用最广泛的语音识别模型，被集成到无数应用中。Whisper在中文语音识别方面表现出色，对于方言和口音的包容性也较强。\n\n【核心功能】\n1. 语音识别：99种语言高精度转文字\n2. 语音翻译：多种语言语音转英文\n3. 多规格模型：tiny到large不同精度\n4. 强鲁棒性：噪声/口音环境表现好\n5. 开源免费：完全免费本地部署\n6. 时间戳：输出逐词时间戳\n\n【应用场景】\n1. 会议转写：会议录音自动转文字\n2. 视频字幕：自动生成视频字幕\n3. 语音搜索：语音内容的文本索引\n4. 呼叫中心：通话录音的文字分析\n5. 学习工具：外语语音的翻译和笔记\n6. 无障碍：听障人士的语音转文字\n\n【收费情况】\n开源免费。本地自部署完全免费。通过OpenAI API使用需按分钟计费。\n\n【使用形态】\n开源模型自部署 + API。\n\n【使用说明】\n1. 通过pip安装whisper\n2. 下载预训练模型\n3. 准备音频文件\n4. 运行转录命令\n5. 获取文字输出和时间戳\n6. 或通过OpenAI API调用\n\n【优势】\n1. 识别精度极高\n2. 多语言支持全\n3. 噪声鲁棒性好\n4. 开源免费\n5. 社区最活跃\n\n【劣势】\n1. 大模型硬件要求高\n2. 实时性不如专用引擎\n3. 中文不如国产引擎\n4. 长音频需要分段\n\n【支持平台】\nGitHub开源、Python包、API", "s": "Whisper是OpenAI开源的通用语音识别模型，99种语言/强噪声鲁棒性/多规格模型，全球最广泛使用的ASR。"},
  {"n": "DeepGram", "c": "AI语音/合成", "p": "DeepGram", "u": "https://deepgram.com", "t": "API", "r": "免费+付费", "d": "【产品名片】DeepGram | AI语音/合成 | DeepGram | https://deepgram.com | 收费：免费+付费\n\n【详细介绍】\nDeepGram是一家专注于实时语音识别的AI公司，提供高精度的语音转文字API服务。DeepGram的核心技术是基于端到端深度学习模型的实时语音识别引擎，在识别速度上具有显著优势——延迟低至300ms以内，适合需要实时转录的场景。DeepGram支持多种语言的语音识别（包括中文），并提供定制化模型训练服务。DeepGram的语音识别在电话录音、会议录音、直播语音等场景中表现尤为出色。DeepGram还提供语音分析功能，包括情感分析、意图识别、关键词提取和说话人分离（Diarization）。DeepGram的Tiered模型体系让用户可以在速度和精度之间灵活选择。DeepGram在开发者社区中口碑良好，API文档清晰，SDK覆盖多种编程语言。\n\n【核心功能】\n1. 实时语音识别：300ms超低延迟实时转录\n2. 多语言支持：多种语言的语音识别\n3. 说话人分离：区分不同说话人\n4. 语音分析：情感/意图/关键词分析\n5. 定制模型：针对特定场景训练\n6. 多通道处理：支持多路音频同时处理\n\n【应用场景】\n1. 实时会议：视频会议实时字幕\n2. 呼叫中心：通话实时监控和分析\n3. 直播字幕：直播内容的实时字幕\n4. 语音助手：实时对话语音识别\n5. 转录服务：录音文件的批量转写\n6. 智能硬件：IoT设备语音交互\n\n【收费情况】\n免费+付费。免费用户每月$200额度。超出后按分钟计费，约$0.01-$0.05/分钟。\n\n【使用形态】\nAPI服务。云端调用。\n【使用说明】\n1. 访问 deepgram.com 注册\n2. 获取API Key\n3. 调用实时或批量转录API\n4. 接收转录结果\n5. 使用语音分析功能\n6. 查看使用量和账单\n\n【优势】\n1. 实时转录速度最快\n2. 延迟极低（300ms）\n3. 说话人分离好\n4. API文档完善\n5. 免费额度慷慨\n\n【劣势】\n1. 中文精度不如国产\n2. 仅限云端服务\n3. 不可本地部署\n4. 专业术语识别需定制\n\n【支持平台】\nAPI（DeepGram）", "s": "DeepGram是实时AI语音识别API服务，300ms超低延迟/说话人分离/情感分析，适合直播和会议场景。"},
  {"n": "Audacity AI", "c": "AI语音/合成", "p": "Audacity", "u": "https://www.audacityteam.org", "t": "桌面软件", "r": "免费", "d": "【产品名片】Audacity AI | AI语音/合成 | Audacity | https://www.audacityteam.org | 收费：免费\n\n【详细介绍】\nAudacity是世界上最流行的免费开源音频编辑软件，其AI功能主要通过开源插件和扩展实现。Audacity本身是一款功能强大的多轨音频录制和编辑软件，支持Windows/Mac/Linux全平台。Audacity的AI功能通过插件扩展实现：AI降噪（基于深度学习清除背景噪音，比传统降噪效果好得多）、AI音频修复（点击声/噼啪声/嘶声的智能去除）、AI音高修正（自动修正走音）、AI人声分离（从混合音频中提取人声或伴奏）、AI语音清晰度增强（提升语音的清晰度和可懂度）。Audacity搭配AI插件后，在音频后期处理方面可以替代昂贵的专业音频软件。Audacity是完全免费的开源软件，没有功能限制和水印。对于需要AI音频处理的播客制作者、音乐人和视频创作者来说，Audacity+AI插件是性价比最高的方案。\n\n【核心功能】\n1. AI降噪：深度学习清除背景噪音\n2. AI音频修复：点击/嘶声智能去除\n3. AI音高修正：自动修正走音\n4. AI人声分离：提取人声或伴奏\n5. AI语音增强：提升语音清晰度\n6. 多轨编辑：完整的音频编辑能力\n\n【应用场景】\n1. 播客制作：录音降噪和音频修复\n2. 音乐录音：人声修正和伴奏分离\n3. 视频配音：配音的降噪和音质提升\n4. 会议录音：会议录音的清理和修复\n5. 音频修复：老旧录音的降噪修复\n6. 声音设计：音频素材的处理\n\n【收费情况】\n完全免费。开源软件。\n\n【使用形态】\n桌面端软件。\n\n【使用说明】\n1. 下载安装Audacity\n2. 导入音频文件\n3. 选择AI降噪/修复/人声分离等功能\n4. 调整参数\n5. 预览效果\n6. 导出处理后的音频\n\n【优势】\n1. 完全免费开源\n2. AI功能通过插件增强\n3. 多轨编辑能力强\n4. 全平台支持\n5. 社区生态丰富\n\n【劣势】\n1. AI功能需额外安装插件\n2. 界面较老式\n3. 实时处理性能一般\n4. 官方AI插件有限\n\n【支持平台】\nWindows桌面、macOS桌面、Linux桌面", "s": "Audacity是免费开源的音频编辑软件，搭配AI插件实现降噪/修复/人声分离等AI音频处理功能。"},

  {"n": "CodeWhisperer", "c": "AI编程/代码", "p": "亚马逊AWS", "u": "https://aws.amazon.com/codewhisperer", "t": "IDE插件", "r": "免费", "d": "【产品名片】CodeWhisperer | AI编程/代码 | 亚马逊AWS | https://aws.amazon.com/codewhisperer | 收费：免费\n\n【详细介绍】\nAmazon CodeWhisperer是亚马逊AWS推出的AI编程助手，是GitHub Copilot的主要竞争对手之一。CodeWhisperer最大的优势是完全免费——个人开发者无需任何费用即可使用全部功能。CodeWhisperer支持多种IDE（VS Code/JetBrains/AWS Cloud9等）和15+种编程语言（Python/Java/JavaScript/TypeScript/C#/Go/Rust等）。CodeWhisperer的核心功能包括：实时代码补全（基于上下文生成代码建议）、代码生成（根据注释描述生成完整函数）、安全漏洞扫描（自动检测代码中的安全问题和漏洞）。CodeWhisperer的一个独特优势是与AWS服务的深度集成——在编写AWS相关的代码（Lambda/S3/DynamoDB等）时，CodeWhisperer能生成最佳实践代码。CodeWhisperer的免费策略使其在预算敏感的开发者和学生群体中特别受欢迎。\n\n【核心功能】\n1. AI代码补全：基于上下文实时生成代码\n2. 代码生成：注释描述生成完整函数\n3. 安全扫描：自动检测安全漏洞\n4. AWS集成：优化AWS服务代码生成\n5. 多语言支持：15+种编程语言\n6. 多IDE支持：VS Code/JetBrains等\n\n【应用场景】\n1. 日常编码：加速代码编写和函数实现\n2. AWS开发：Lambda/S3/DynamoDB等AWS开发\n3. 代码安全：安全检查扫描和修复建议\n4. 学习编程：学习不同语言的最佳实践\n5. 代码审查：AI辅助代码审查\n6. 快速原型：从注释到代码快速实现\n\n【收费情况】\n完全免费。个人开发者无需付费。企业版通过AWS提供额外管理功能。\n\n【使用形态】\nIDE插件。\n\n【使用说明】\n1. 在VS Code或JetBrains中安装CodeWhisperer插件\n2. 使用AWS账号登录\n3. 在编辑器中开始编码\n4. AI自动给出代码建议（按Tab接受）\n5. 编写注释让AI生成代码\n6. 使用安全扫描功能检查代码\n\n【优势】\n1. 完全免费\n2. AWS服务集成好\n3. 安全扫描功能独特\n4. 支持多语言多IDE\n5. 亚马逊技术保障\n\n【劣势】\n1. 代码质量不如Copilot\n2. 非AWS场景优势不明显\n3. 需要AWS账号\n4. 更新频率较低\n\n【支持平台】\nVS Code、JetBrains IDE、AWS Cloud9", "s": "CodeWhisperer是亚马逊AWS的免费AI编程助手，支持多语言多IDE，内建安全漏洞扫描。"},
  {"n": "JetBrains AI", "c": "AI编程/代码", "p": "JetBrains", "u": "https://www.jetbrains.com/ai", "t": "IDE插件", "r": "付费", "d": "【产品名片】JetBrains AI | AI编程/代码 | JetBrains | https://www.jetbrains.com/ai | 收费：付费\n\n【详细介绍】\nJetBrains AI是JetBrains为其全系列IDE（IntelliJ IDEA/PyCharm/WebStorm/GoLand/CLion等）推出的AI编程助手。JetBrains是世界上最受欢迎的Java/ Kotlin IDE IntelliJ IDEA的开发商，在开发者工具领域拥有极高的声誉。JetBrains AI与JetBrains IDE深度集成，提供了AI代码补全、AI代码生成、AI对话（在IDE中与AI讨论代码）、AI commit信息生成、AI代码审查和AI文档生成等功能。JetBrains AI的最大优势是其对JetBrains IDE的深度理解——AI能够充分利用IDE的代码分析、重构和导航能力。JetBrains AI支持多种AI模型（可以选择OpenAI/Anthropic/JetBrains自有模型等）。JetBrains AI还提供「全行代码补全」——在JetBrains IDE中提供比普通AI补全更智能的完整代码行生成。对于JetBrains IDE的重度用户来说，JetBrains AI是原生AI集成的最佳选择。\n\n【核心功能】\n1. AI代码补全：智能上下文感知的代码补全\n2. AI对话：IDE内与AI讨论代码问题\n3. AI Commit：自动生成Git commit信息\n4. AI代码审查：代码质量分析和建议\n5. AI文档生成：自动生成代码文档\n6. 多模型选择：支持多种AI后端\n\n【应用场景】\n1. Java/Kotlin开发：IntelliJ IDEA用户的AI辅助\n2. Python开发：PyCharm中的AI编程\n3. 全栈开发：WebStorm中的前端+后端开发\n4. 代码库导航：AI辅助理解大型代码库\n5. 代码审查：AI驱动的Code Review\n6. 重构辅助：AI建议代码重构方案\n\n【收费情况】\n付费。JetBrains AI Pro $10/月。包含在JetBrains All Products Pack订阅中。\n\n【使用形态】\nIDE插件。集成在JetBrains IDE中。\n\n【使用说明】\n1. 安装JetBrains IDE（IntelliJ/PyCharm/WebStorm等）\n2. 打开设置→AI→启用JetBrains AI\n3. 在代码编辑器中直接使用AI补全\n4. 使用AI对话面板提问\n5. 使用AI Commit生成提交信息\n6. 使用AI审查代码质量\n\n【优势】\n1. JetBrains IDE深度集成\n2. Java/Kotlin生态最佳\n3. 对话式AI体验好\n4. IDE功能理解深入\n5. 多模型选择灵活\n\n【劣势】\n1. 仅限JetBrains IDE\n2. 需要付费订阅\n3. 非JetBrains用户无法使用\n4. 响应速度略慢\n\n【支持平台】\nIntelliJ IDEA、PyCharm、WebStorm、GoLand、CLion等JetBrains IDE", "s": "JetBrains AI深度集成在JetBrains全系列IDE中，提供AI补全/对话/Commit/代码审查等功能。"},
  {"n": "Sourcegraph Cody", "c": "AI编程/代码", "p": "Sourcegraph", "u": "https://sourcegraph.com/cody", "t": "IDE插件", "r": "免费+付费", "d": "【产品名片】Sourcegraph Cody | AI编程/代码 | Sourcegraph | https://sourcegraph.com/cody | 收费：免费+付费\n\n【详细介绍】\nCody是Sourcegraph推出的AI编程助手，其最大优势是对「整个代码库」的理解能力。与大多数仅理解当前文件和打开选项卡的AI编程助手不同，Cody通过Sourcegraph的代码搜索和索引技术，能够理解完整的代码库——包括依赖关系、跨文件引用、API定义和使用情况。Cody的核心功能包括：代码库问答（用自然语言提问关于整个代码库的问题）、AI代码生成（基于代码库上下文生成代码）、AI代码审查（理解代码库整体架构后审查）、自动修复（分析错误后基于代码库生成修复方案）。Cody的独特能力是基于Sourcegraph的代码搜索功能——你可以问「这个函数在哪里被调用了？」「这个API的所有调用者是谁？」等代码库级别的问题。Cody支持VS Code和JetBrains IDE。对于大型代码库的开发者来说，Cody的代码库理解能力使其与其他AI编程助手形成差异化。\n\n【核心功能】\n1. 代码库问答：基于整个代码库回答技术问题\n2. AI代码生成：理解代码库上下文生成代码\n3. AI代码审查：代码库级别的智能审查\n4. 代码搜索：自然语言搜索代码\n5. 自动修复：基于代码库解决Bug\n6. 多IDE支持：VS Code和JetBrains\n\n【应用场景】\n1. 大型代码库：理解数百万行代码的复杂项目\n2. 新成员入职：快速理解陌生代码库\n3. 代码迁移：理解依赖后安全重构\n4. Bug定位：快速定位问题代码位置\n5. API使用：理解API的设计和使用方式\n6. 代码审查：代码库级别的全面审查\n\n【收费情况】\n免费+付费。免费版有限制（每月AI请求次数）。Pro版$9/月，无限请求+更多上下文。企业版按需定制。\n\n【使用形态】\nIDE插件。\n\n【使用说明】\n1. 在VS Code或JetBrains中安装Cody扩展\n2. 使用Sourcegraph账号登录\n3. 在编辑器中用@cody召唤AI\n4. 提问关于代码库的问题\n5. 使用AI生成或修改代码\n6. 使用Cody inspect分析代码\n\n【优势】\n1. 代码库级理解独一无二\n2. 大型项目场景最强\n3. 问答能力出色\n4. Sourcegraph搜索能力加持\n5. 价格合理\n\n【劣势】\n1. 小型项目优势不明显\n2. 需要Sourcegraph账号\n3. 离线功能有限\n4. 非Sourcegraph用户有学习成本\n\n【支持平台】\nVS Code、JetBrains IDE", "s": "Sourcegraph Cody是理解整个代码库的AI编程助手，支持代码库级问答/生成/审查。"},
  {"n": "Trae", "c": "AI编程/代码", "p": "字节跳动", "u": "https://www.trae.ai", "t": "桌面IDE", "r": "免费", "d": "【产品名片】Trae | AI编程/代码 | 字节跳动 | https://www.trae.ai | 收费：免费\n\n【详细介绍】\nTrae是字节跳动推出的AI原生集成开发环境（IDE），定位为「国产AI编程助手」，完全免费使用。Trae基于VS Code内核构建，继承了VS Code丰富的插件生态，同时深度集成了AI编程能力。Trae的AI功能包括：AI代码补全（智能上下文代码补全）、AI对话（内置AI聊天面板，支持多轮对话）、AI代码生成（自然语言描述生成代码）、AI代码解释（选中代码让AI解释）、AI Debug（AI自动分析和定位Bug）、AI Commit（自动生成Git提交信息）。Trae支持多种AI模型（可选豆包大模型/DeepSeek等国产模型）。Trae的最大优势是完全免费且内置了国产AI模型——用户无需额外的API Key即可使用AI功能。Trae的AI对话支持中文输入，对中文开发者的使用体验友好。Trae在国产AI编程工具中迅速获得了大量用户。\n\n【核心功能】\n1. AI代码补全：智能上下文代码建议\n2. AI对话：内置AI聊天面板\n3. AI代码生成：自然语言生成代码\n4. AI代码解释：选中代码AI解读\n5. AI Debug：自动定位和修复Bug\n6. AI Commit：自动生成提交信息\n\n【应用场景】\n1. 国产开发者：中文友好的AI编程环境\n2. 免费编程：零成本使用AI编程助手\n3. 初学者学习：边写代码边让AI解释\n4. 全栈开发：前后端代码的AI辅助\n5. 项目开发：从需求到代码的AI辅助\n6. 代码审查：AI代码质量分析\n\n【收费情况】\n完全免费。内置AI无需额外付费。\n\n【使用形态】\n桌面端IDE。\n\n【使用说明】\n1. 下载安装Trae桌面版\n2. 打开项目文件夹\n3. 使用AI对话面板\n4. 编写代码时AI自动补全\n5. 选中代码右键使用AI功能\n6. 提交代码时AI生成Commit信息\n\n【优势】\n1. 完全免费\n2. 内置国产AI模型\n3. 中文支持好\n4. VS Code插件生态兼容\n5. 字节跳动技术保障\n\n【劣势】\n1. 外挂模型不如Cursor\n2. AI功能深度有限\n3. 社区生态较小\n4. 仅限桌面端\n\n【支持平台】\nWindows桌面、macOS桌面", "s": "Trae是字节跳动推出的免费AI原生IDE，内置国产AI模型，中文编程体验友好。"},
  {"n": "豆包代码助手", "c": "AI编程/代码", "p": "字节跳动", "u": "https://code.doubao.com", "t": "IDE插件", "r": "免费", "d": "【产品名片】豆包代码助手 | AI编程/代码 | 字节跳动 | https://code.doubao.com | 收费：免费\n\n【详细介绍】\n豆包代码助手是字节跳动推出的AI编程插件，基于豆包大模型为开发者提供AI辅助编程能力。与Trae（独立IDE）不同，豆包代码助手是作为VS Code插件使用的，用户可以在自己熟悉的VS Code环境中使用豆包的AI能力。豆包代码助手的主要功能包括：AI代码补全（在编码时智能补全代码）、AI对话（在侧边栏与豆包讨论代码问题）、AI代码审查（分析代码质量和潜在问题）、AI代码解释（选中代码让AI解释功能）、AI单元测试生成（自动为函数生成测试用例）和AI文档生成。豆包代码助手最大的优势是使用字节自研的豆包大模型，在中文理解和生成方面表现优秀。豆包代码助手完全免费，无需API Key，安装即可使用。豆包代码助手还提供了「AI知识库」功能，可以上传项目文档让AI基于项目知识回答问题。\n\n【核心功能】\n1. AI代码补全：实时智能代码补全\n2. AI对话：侧边栏AI编程对话\n3. AI代码审查：代码质量分析\n4. AI测试生成：自动生成单元测试\n5. AI代码解释：解读选中代码\n6. AI文档生成：生成代码注释和文档\n\n【应用场景】\n1. 日常编码：加速代码编写效率\n2. 代码学习：让AI解释不懂的代码\n3. 测试编写：自动生成单元测试\n4. 代码审查：提交前的代码自检\n5. 技术问答：技术问题的AI解答\n6. 文档补充：为代码添加注释和文档\n\n【收费情况】\n完全免费。\n\n【使用形态】\nVS Code插件。\n\n【使用说明】\n1. 在VS Code扩展市场搜索「豆包代码助手」安装\n2. 使用字节/抖音账号登录\n3. 开始编码，AI自动提供补全\n4. 点击侧边栏豆包图标进行对话\n5. 选中代码右键使用AI功能\n6. 在设置中自定义AI行为\n【优势】\n1. 完全免费\n2. 豆包大模型中文能力强\n3. VS Code原生体验\n4. 安装即用无需配置\n5. 字节跳动技术支持\n\n【劣势】\n1. 仅支持VS Code\n2. AI能力不如GPT-4\n3. 社区反馈渠道有限\n4. 企业级功能缺乏\n\n【支持平台】\nVS Code", "s": "豆包代码助手是字节跳动的免费VS Code AI编程插件，基于豆包大模型，中文支持优秀。"},
  {"n": "Pinecone", "c": "AI开发平台", "p": "Pinecone", "u": "https://www.pinecone.io", "t": "SaaS/API", "r": "免费+付费", "d": "【产品名片】Pinecone | AI开发平台 | Pinecone | https://www.pinecone.io | 收费：免费+付费\n\n【详细介绍】\nPinecone是全球领先的向量数据库即服务（Vector Database as a Service）平台，是构建RAG（检索增强生成）应用的核心基础设施。Pinecone专门为存储和检索高维向量（Vector Embeddings）而设计，让AI应用能够实现语义搜索、相似度匹配和长期记忆功能。Pinecone的核心技术优势在于：超低延迟的向量搜索（毫秒级响应）、高精度检索（支持多种相似度算法）、自动索引管理和横向扩展能力。Pinecone提供完全托管的云服务，开发者无需自己管理和维护向量数据库基础设施。Pinecone支持与LangChain/LlamaIndex等框架的深度集成，提供了Python/Node.js/Java/Go等语言的SDK。Pinecone的Serverless模式支持按实际使用量付费，无需预先配置资源。Pinecone被广泛应用于AI知识库、智能客服、推荐系统、语义搜索、异常检测等场景。\n\n【核心功能】\n1. 向量数据库：高性能向量存储和检索\n2. 毫秒级搜索：超低延迟相似度搜索\n3. 自动索引管理：无需手动维护\n4. Serverless模式：按量付费零运维\n5. 多语言SDK：Python/Node.js/Java/Go\n6. 框架集成：LangChain/LlamaIndex支持\n\n【应用场景】\n1. RAG应用：知识库问答系统的检索组件\n2. 语义搜索：基于语义的文档/产品搜索\n3. 推荐系统：向量相似度的个性化推荐\n4. 异常检测：向量空间中的异常识别\n5. 去重系统：相似内容的检测和去重\n6. AI记忆：为AI对话系统提供长期记忆\n\n【收费情况】\n免费+付费。免费版有存储和请求限制。Serverless按量计费。标准版从$70/月起。\n\n【使用形态】\n云端SaaS服务 + API。\n\n【使用说明】\n1. 访问 pinecone.io 注册\n2. 创建Index\n3. 设置向量维度（与Embedding模型匹配）\n4. 使用SDK连接Pinecone\n5. 写入向量数据\n6. 执行相似度搜索\n\n【优势】\n1. 向量数据库市场领导者\n2. 高性能低延迟\n3. Serverless免运维\n4. 与主流AI框架集成好\n5. 文档完善SDK丰富\n\n【劣势】\n1. 成本较高（大规模场景）\n2. 仅支持云端\n3. 不可本地部署\n4. 厂商锁定风险\n\n【支持平台】\nAPI（Python/Node.js/Java/Go SDK），SaaS", "s": "Pinecone是领先的向量数据库即服务平台，为RAG应用提供毫秒级向量搜索和语义检索能力。"},
  {"n": "Chroma", "c": "AI开发平台", "p": "Chroma", "u": "https://www.trychroma.com", "t": "开源框架", "r": "开源免费", "d": "【产品名片】Chroma | AI开发平台 | Chroma | https://www.trychroma.com | 收费：开源免费\n\n【详细介绍】\nChroma是一个开源的轻量级向量数据库，专为AI应用和Embedding存储而设计。Chroma的设计理念是「AI原生向量数据库」——安装简单（pip install chromadb）、API简洁（几行代码即可使用）、运行轻量（可嵌入到应用中运行不需要独立服务器）。Chroma是构建RAG应用和小型AI项目最流行的向量数据库选择之一。Chroma的主要特点包括：内存/持久化两种运行模式、自动文档分块和Embedding、内置多种Embedding函数支持、元数据过滤、集合管理（Collection）和相似度搜索功能。Chroma的安装和使用极为简单——不需要配置独立的数据库服务器，不需要繁琐的集群管理。Chroma适合原型开发、个人项目和小型团队使用。Chroma与LangChain和LlamaIndex深度集成。Chroma是完全开源的项目（Apache 2.0协议），代码在GitHub上公开。\n\n【核心功能】\n1. 轻量向量数据库：pip安装即用\n2. 双模式运行：内存模式/持久化模式\n3. 自动Embedding：内置多种Embedding函数\n4. 语义搜索：高精度向量相似度搜索\n5. 元数据过滤：基于元数据筛选结果\n6. 集合管理：多Collection数据隔离\n\n【应用场景】\n1. 快速原型：快速搭建RAG原型系统\n2. 个人项目：个人AI知识库/笔记助手\n3. 学习AI：学习向量数据库和RAG概念\n4. 本地部署：完全离线的AI应用\n5. 教学示例：AI课程的教学演示\n6. 轻量生产：小规模AI应用的生产部署\n\n【收费情况】\n开源免费（Apache 2.0）。Chroma Cloud托管服务收费。\n\n【使用形态】\nPython库，可直接嵌入应用。\n\n【使用说明】\n1. pip install chromadb\n2. import chromadb\n3. 创建Client和Collection\n4. 添加文档（自动生成Embedding）\n5. 执行相似度查询\n6. 集成到AI应用中\n\n【优势】\n1. 安装部署最简单\n2. 学习曲线最低\n3. 完全开源\n4. 可嵌入应用运行\n5. 与LangChain集成好\n\n【劣势】\n1. 不适合大规模场景\n2. 性能不如专用向量库\n3. 分布式支持有限\n4. 高级功能较少\n\n【支持平台】\nPython库（pip安装），开源", "s": "Chroma是开源轻量向量数据库，pip安装即用，适合RAG原型和个人AI项目。"},
  {"n": "Weaviate", "c": "AI开发平台", "p": "Weaviate", "u": "https://weaviate.io", "t": "开源框架", "r": "开源免费", "d": "【产品名片】Weaviate | AI开发平台 | Weaviate | https://weaviate.io | 收费：开源免费\n\n【详细介绍】\nWeaviate是一个开源向量搜索引擎和向量数据库，定位为「AI原生向量数据库」。与Pinecone（纯SaaS）和Chroma（纯轻量）不同，Weaviate适合需要自托管和定制化的大规模向量搜索场景。Weaviate支持混合搜索——同时使用向量相似度和关键词搜索（BM25），在搜索结果的相关性方面比纯向量搜索更好。Weaviate内置了多种模块化功能：向量化模块（直接集成OpenAI/Cohere/HuggingFace等Embedding模型）、生成式模块（搜索后让LLM生成答案）、NER模块（命名实体识别）和分类模块。Weaviate支持GraphQL和RESTful两种API，Schema灵活，支持多租户和RBAC访问控制。Weaviate在企业级功能方面最为完善——支持水平扩展、数据备份、监控指标和Kubernetes部署。Weaviate适合对数据安全和定制化有较高要求的企业场景。\n\n【核心功能】\n1. 混合搜索：向量搜索+关键词BM25组合\n2. 内置向量化：集成多种Embedding模型\n3. 生成式搜索：搜索+LLM生成答案\n4. 模块化架构：向量化/生成/NER等模块\n5. 水平扩展：分布式架构无限扩展\n6. 多租户：多用户数据隔离\n\n【应用场景】\n1. 企业RAG：需要混合搜索的企业知识库\n2. 电商搜索：语义+关键词混合的商品搜索\n3. 内容管理：大规模内容的智能检索\n4. 安全合规：需要自托管的数据隔离场景\n5. AI助手：带有记忆和检索能力的AI助手\n6. 推荐系统：混合策略的智能推荐\n\n【收费情况】\n开源免费（BSD 3-Clause）。Weaviate Cloud托管服务按量计费。企业版包含高级功能。\n\n【使用形态】\n开源自部署 + 云端SaaS。\n\n【使用说明】\n1. 通过Docker或Kubernetes部署Weaviate\n2. 配置Schema定义数据模型\n3. 通过API写入数据\n4. 配置向量化模块\n5. 执行混合搜索\n6. 监控和管理集群\n\n【优势】\n1. 混合搜索能力最强\n2. 模块化架构灵活\n3. 企业级功能完善\n4. 支持自托管\n5. GraphQL API现代\n\n【劣势】\n1. 部署运维成本高\n2. 学习曲线较陡\n3. 资源需求较大\n4. 非向量搜索场景不适用\n\n【支持平台】\n自部署（Docker/K8s）、Weaviate Cloud", "s": "Weaviate是开源向量搜索引擎，支持混合搜索和模块化架构，适合企业级自托管场景。"},
  {"n": "TensorFlow", "c": "AI开发平台", "p": "Google", "u": "https://www.tensorflow.org", "t": "开源框架", "r": "开源免费", "d": "【产品名片】TensorFlow | AI开发平台 | Google | https://www.tensorflow.org | 收费：开源免费\n\n【详细介绍】\nTensorFlow是Google开源的深度学习框架，是全球使用最广泛的机器学习平台之一。TensorFlow于2015年由Google Brain团队发布，在工业界和学术界拥有极其庞大的用户基础。TensorFlow提供了完整的机器学习开发生态：Keras高级API（适合新手和快速原型）、Eager Execution（动态图模式，调试方便）、TensorFlow Hub（预训练模型仓库）、TensorFlow Lite（移动端/嵌入式部署）、TensorFlow.js（浏览器端机器学习）、TensorFlow Serving（生产模型部署）和TensorBoard（可视化训练过程）。TensorFlow 2.x版本大幅简化了API，默认采用Eager Execution模式，降低了使用门槛。TensorFlow在生产部署方面拥有最成熟的工具链——TF Serving、TFX（生产ML流水线）和TF Lite/TF.js的端侧部署能力在业界领先。TensorFlow在Google内部产品（搜索/翻译/广告/Gmail）中大规模使用。\n\n【核心功能】\n1. 深度学习框架：构建和训练神经网络\n2. Keras API：简洁高级API快速建模\n3. TF Lite：移动端/嵌入式部署\n4. TF.js：浏览器端机器学习\n5. TF Serving：生产模型服务\n6. TensorBoard：训练可视化\n\n【应用场景】\n1. 图像识别：CNN分类/目标检测/图像分割\n2. 自然语言处理：文本分类/序列标注/翻译\n3. 推荐系统：深度学习推荐模型\n4. 时间序列预测：金融/气象/销售预测\n5. 强化学习：游戏AI/机器人控制\n6. 生产部署：将模型部署到移动端/服务器\n\n【收费情况】\n开源免费（Apache 2.0）。Google Cloud AI Platform提供托管服务。\n\n【使用形态】\nPython/C++库，支持GPU/TPU加速。\n\n【使用说明】\n1. pip install tensorflow\n2. 使用Keras构建模型\n3. 编译模型（设置优化器和损失函数）\n4. 训练模型\n5. 评估模型\n6. 使用TF Serving/TF Lite部署\n\n【优势】\n1. 生产部署最成熟\n2. Google技术支撑\n3. 社区最大资源最多\n4. 端侧部署（TF Lite/TF.js）\n5. TPU训练加速\n\n【劣势】\n1. API复杂度高于PyTorch\n2. 调试不如PyTorch直观\n3. 研究界转向PyTorch\n4. Windows支持有限\n\n【支持平台】\nPython、C++、JavaScript（TF.js）、移动端（TF Lite）", "s": "TensorFlow是Google开源的深度学习框架，Keras API简洁，生产部署工具链最成熟。"},
  {"n": "PyTorch", "c": "AI开发平台", "p": "Meta", "u": "https://pytorch.org", "t": "开源框架", "r": "开源免费", "d": "【产品名片】PyTorch | AI开发平台 | Meta | https://pytorch.org | 收费：开源免费\n\n【详细介绍】\nPyTorch是Meta（Facebook）开源的深度学习框架，是目前AI研究和学术领域最受欢迎的机器学习框架。PyTorch于2016年发布，以其「Pythonic」的设计哲学和动态计算图（Define-by-Run）机制迅速获得了研究社区的青睐。PyTorch的核心优势在于其直观的调试体验——开发者可以像调试普通Python代码一样调试神经网络训练过程。PyTorch的生态系统极为丰富：torchvision（计算机视觉）、torchaudio（音频处理）、torchtext（自然语言处理）、Hugging Face Transformers（基于PyTorch的Transformer模型库）、PyTorch Lightning（简化训练代码）、TorchScript（生产部署）和TorchServe（模型服务）。PyTorch在学术界拥有压倒性的市场占有率，NeurIPS/ICML/CVPR等顶会的论文绝大多数使用PyTorch实现。近年来PyTorch也在不断强化生产部署能力——TorchScript/TorchServe/ONNX导出等在工业界也得到了广泛应用。\n\n【核心功能】\n1. 动态计算图：Define-by-Run，调试直观\n2. 自动求导：Autograd自动梯度计算\n3. torchvision：计算机视觉工具集\n4. torchaudio：音频处理工具\n5. TorchScript：模型生产部署\n6. 分布式训练：多GPU/多节点训练\n\n【应用场景】\n1. 学术研究：论文实验和模型创新\n2. 计算机视觉：图像分类/检测/分割/生成\n3. NLP：文本分类/翻译/问答\n4. 语音处理：语音识别/合成\n5. 生成模型：GAN/Diffusion模型训练\n6. 大模型微调：LLM的微调和推理\n\n【收费情况】\n开源免费。Meta不收取费用。云平台提供托管服务。\n\n【使用形态】\nPython库，支持GPU加速。\n\n【使用说明】\n1. pip install torch torchvision\n2. 定义神经网络模型（继承nn.Module）\n3. 定义损失函数和优化器\n4. 编写训练循环\n5. 在GPU上训练\n6. 导出模型（TorchScript/ONNX）\n\n【优势】\n1. Python惯用语法，学习成本低\n2. 调试体验最好\n3. 学术界最流行\n4. 生态丰富（HuggingFace等）\n5. 动态图灵活性强\n\n【劣势】\n1. 生产部署不如TF成熟\n2. 移动端支持不如TF Lite\n3. 大规模分布式部署较复杂\n4. Meta主导，企业支持顾虑\n\n【支持平台】\nPython、C++（LibTorch），支持GPU/CPU", "s": "PyTorch是Meta开源的深度学习框架，Pythonic设计/动态计算图，学术界最流行的机器学习框架。"},
  {"n": "Keras", "c": "AI开发平台", "p": "Google", "u": "https://keras.io", "t": "开源框架", "r": "开源免费", "d": "【产品名片】Keras | AI开发平台 | Google | https://keras.io | 收费：开源免费\n\n【详细介绍】\nKeras是一个高层神经网络API，被设计为「给人类使用的深度学习框架」。Keras以其极简的API设计哲学而闻名——用最少的代码实现最常用的深度学习模型。Keras 3.0版本支持多后端运行：可以在TensorFlow、JAX和PyTorch三种后端上无缝切换。Keras的主要特点包括：Sequential API（顺序模型，最简单的模型定义方式）、Functional API（函数式API，支持多输入多输出和非线性拓扑）、Subclassing API（自定义模型，完全控制前向传播）。Keras内置了大量常用的网络层（Dense/Conv2D/LSTM/Transformer等）、优化器（Adam/SGD/RMSprop等）、损失函数和评估指标。Keras还提供了预处理层（文本向量化/图像增强等）和KerasTuner（超参数自动搜索）。Keras的Sequential API使深度学习入门极为简单——几行代码即可构建和训练一个神经网络。Keras在AI教育和快速原型开发场景中特别受欢迎。\n\n【核心功能】\n1. Sequential API：数行代码构建神经网络\n2. Functional API：复杂网络拓扑\n3. 多后端支持：TensorFlow/JAX/PyTorch\n4. 内置层和模型：丰富的预构建组件\n5. KerasTuner：超参数自动搜索\n6. 预处理层：数据预处理流水线\n\n【应用场景】\n1. 深度学习入门：最简单的ML学习路径\n2. 快速原型：快速验证模型想法\n3. 教学演示：课堂演示神经网络原理\n4. 小规模项目：中小规模的AI项目\n5. 迁移学习：使用预训练模型快速应用\n6. 跨框架开发：一套代码多框架运行\n\n【收费情况】\n开源免费（Apache 2.0）。\n\n【使用形态】\nPython库，运行在TensorFlow/JAX/PyTorch之上。\n\n【使用说明】\n1. pip install keras\n2. 使用Sequential定义模型\n3. 使用model.compile配置训练\n4. 使用model.fit训练模型\n5. 使用model.evaluate评估\n6. 使用model.predict推理\n\n【优势】\n1. API最简洁，上手最快\n2. 3.x多后端支持灵活\n3. 与TensorFlow深度集成\n4. 文档丰富示例多\n5. 适合教学和学习\n\n【劣势】\n1. 灵活性不如PyTorch\n2. 不适合复杂研究场景\n3. 自定义层较麻烦\n4. 性能不如底层框架\n\n【支持平台】\nPython库", "s": "Keras是高层神经网络API，以极简设计著称，几行代码构建深度学习模型，支持多后端运行。"},
  {"n": "DeepSpeed", "c": "AI开发平台", "p": "微软", "u": "https://www.deepspeed.ai", "t": "开源框架", "r": "开源免费", "d": "【产品名片】DeepSpeed | AI开发平台 | 微软 | https://www.deepspeed.ai | 收费：开源免费\n\n【详细介绍】\nDeepSpeed是微软开源的深度学习优化库，专门用于大模型的训练和推理加速。DeepSpeed是当前训练超大规模AI模型（包括GPT-4/Llama等）的核心基础设施之一。DeepSpeed的核心技术创新是ZeRO（Zero Redundancy Optimizer）内存优化技术——通过将模型状态（优化器状态/梯度/参数）分散到多个GPU上，使得训练模型的内存占用大幅降低。ZeRO有三个级别：ZeRO-1（优化器状态分片）、ZeRO-2（优化器+梯度分片）和ZeRO-3（优化器+梯度+参数全分片）。DeepSpeed还提供了ZeRO-Infinity（扩展到数千GPU）、DeepSpeed Inference（推理加速）、DeepSpeed Chat（类ChatGPT训练流水线）、Mixture of Experts（MoE支持）和Sparse Attention（稀疏注意力）等能力。DeepSpeed是训练千亿/万亿参数大模型的关键工具。DeepSpeed完全开源，与PyTorch深度集成，通过pip安装即可使用。\n\n【核心功能】\n1. ZeRO优化：将模型内存降低数十倍\n2. ZeRO-Infinity：数千GPU规模扩展\n3. DeepSpeed Inference：推理加速\n4. DeepSpeed Chat：RLHF训练流水线\n5. MoE训练：混合专家模型训练支持\n6. Sparse Attention：长序列训练优化\n\n【应用场景】\n1. 大模型训练：LLM/GPT/Transformer的训练\n2. 模型微调：大模型的参数高效微调\n3. 模型推理：大模型的低延迟推理\n4. RLHF训练：类ChatGPT的强化学习\n5. 科学研究：需要大规模算力的实验\n6. 企业训练：企业内部大模型训练项目\n\n【收费情况】\n开源免费（MIT协议）。微软Azure提供DeepSpeed托管服务。\n\n【使用形态】\nPython库，PyTorch扩展。\n\n【使用说明】\n1. pip install deepspeed\n2. 将模型训练代码适配DeepSpeed\n3. 配置ZeRO级别（ZeRO-1/2/3）\n4. 配置训练参数\n5. 使用deepspeed命令启动训练\n6. 监控训练效率和内存使用\n\n【优势】\n1. 大模型训练优化最强\n2. ZeRO技术突破性\n3. 微软Azure支撑\n4. 支持数千GPU扩展\n5. PyTorch原生集成\n\n【劣势】\n1. 配置复杂，学习曲线陡\n2. 仅适合大模型场景\n3. 需要多GPU环境\n4. 文档不够详细\n\n【支持平台】\nPython（PyTorch）", "s": "DeepSpeed是微软的大模型训练优化库，ZeRO技术大幅降低内存，支持数千GPU扩展训练。"},

  {"n": "QuillBot", "c": "AI办公/文档", "p": "QuillBot", "u": "https://quillbot.com", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】QuillBot | AI办公/文档 | QuillBot | https://quillbot.com | 收费：免费+付费\n\n【详细介绍】\nQuillBot是一款AI句子改写和润色工具，被广泛用于英文写作中的句型优化和降重。QuillBot的核心功能是「改写」（Paraphrasing）——用户输入一段文字，AI会生成多种改写版本，保持原意不变但改变措辞和句式结构。QuillBot提供多种改写模式：标准模式（适中改写）、流畅模式（提升流畅度）、正式模式（更正式的措辞）、学术模式（适合论文）、创意模式（更丰富的表达）、简洁模式（缩短句子）和扩展模式（丰富内容）。QuillBot还集成了语法检查器、摘要生成器、引文生成器和翻译器。QuillBot在学术写作中特别受欢迎——学生用它来改写论文段落避免抄袭，或者将复杂段落改写得更容易理解。QuillBot的免费版提供有限改写次数，Premium版解锁所有模式和无限改写。\n\n【核心功能】\n1. AI改写：多种模式改写句子保持原意\n2. 语法检查：基础语法和拼写校正\n3. 摘要生成：长文本自动生成摘要\n4. 引文生成：自动生成APA/MLA等格式引用\n5. 翻译器：多语言翻译\n6. 统计面板：改写前后的字数/词汇统计\n\n【应用场景】\n1. 论文改写：降低重复率，避免抄袭\n2. 句子优化：将不通顺的句子改流畅\n3. 正式写作：口语化表达改为正式书面语\n4. 学术写作：将内容调整为学术风格\n5. 英文学习：学习不同的英文表达方式\n6. 多语言翻译：翻译后润色改写\n\n【收费情况】\n免费+付费。免费版有限改写次数+标准模式。Premium版$8.33/月，全部模式+无限改写+高级语法。\n\n【使用形态】\n在线SaaS服务。Web端 + 浏览器扩展。\n\n【使用说明】\n1. 访问 quillbot.com\n2. 在编辑框中输入或粘贴文本\n3. 选择改写模式（标准/流畅/正式/学术等）\n4. 点击「改写」按钮\n5. 查看多个改写版本\n6. 选择满意的版本复制使用\n\n【优势】\n1. 改写功能最专业\n2. 多种模式灵活\n3. 学术场景适配好\n4. 价格实惠\n5. 免费版可用\n\n【劣势】\n1. 仅支持英文\n2. 改写有时偏离原意\n3. 学术模式过于正式\n4. 长文本修改较慢\n\n【支持平台】\nWeb端、Chrome扩展", "s": "QuillBot是AI句子改写工具，多种改写模式/摘要生成/引文生成，学术写作降重利器。"},

  {"n": "Wordtune", "c": "AI办公/文档", "p": "AI21 Labs", "u": "https://www.wordtune.com", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Wordtune | AI办公/文档 | AI21 Labs | https://www.wordtune.com | 收费：免费+付费\n\n【详细介绍】\nWordtune是由AI21 Labs开发的AI英文行文优化工具，可以帮助用户改写、润色和扩展英文句子。与QuillBot（侧重改写降重）不同，Wordtune更侧重于「帮助用户找到更好的表达方式」。Wordtune的核心功能包括：Spices（为文字添加统计数据/示例/反方观点等来丰富内容）、Rewrite（句子改写，保持原意换表述）、Tone（正式/非正式/自信/谦逊等语气调整）、Lengthen/Shorten（句子扩写或缩写）、Simplify（复杂句子简化）和Translate（多语言翻译）。Wordtune的独特功能是Spices——选中一段文字，AI自动建议添加统计数据、引用、例子或反方观点来增强内容的说服力。Wordtune还提供浏览器扩展，可以在网页/邮件/Gmail/LinkedIn中直接使用。Wordtune在商务写作和内容创作领域有广泛应用。\n\n【核心功能】\n1. Spices：为文字添加数据/引用/示例增强说服力\n2. Rewrite：句子改写换个表达方式\n3. Tone：正式/非正式/自信/谦逊语气调整\n4. Lengthen/Shorten：扩写或缩写句子\n5. Simplify：简化复杂句子\n6. 浏览器扩展：在网页中直接使用\n\n【应用场景】\n1. 商务邮件：优化邮件措辞和语气\n2. 提案写作：增强提案的说服力\n3. 内容创作：丰富博文/文章的表达\n4. 学术写作：调整论文的学术语气\n5. LinkedIn优化：优化个人资料和帖子\n6. 英文学习：学习更地道的表达方式\n\n【收费情况】\n免费+付费。免费版有限改写次数。Premium版$9.99/月，无限改写+Spices+Tone+高级功能。\n\n【使用形态】\n浏览器扩展 + Web端。\n\n【使用说明】\n1. 安装Wordtune浏览器扩展\n2. 选中要优化的文字\n3. 点击Wordtune图标\n4. 选择功能（Rewrite/Spices/Tone等）\n5. 查看AI建议\n6. 选择满意的版本替换\n\n【优势】\n1. Spices功能独特（增强说服力）\n2. 语气调整自然\n3. 浏览器扩展好用\n4. 改写质量高\n5. 商务场景适配好\n\n【劣势】\n1. 仅支持英文\n2. 免费额度少\n3. Spices有时不准确\n4. 无中文界面\n\n【支持平台】\nChrome扩展、Web端", "s": "Wordtune是AI英文行文优化工具，改写/语气调整/Spices增强内容，让英文表达更精准有力。"},
  {"n": "秘塔写作猫", "c": "AI办公/文档", "p": "秘塔科技", "u": "https://xiezuocat.com", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】秘塔写作猫 | AI办公/文档 | 秘塔科技 | https://xiezuocat.com | 收费：免费+付费\n\n【详细介绍】\n秘塔写作猫是秘塔科技推出的AI中文写作辅助工具，被称为「中文版Grammarly」。秘塔写作猫专注于中文文本的校对和润色，能够自动检测中文文章中的错别字、语病、标点错误、用词不当和格式问题。秘塔写作猫的AI基于大量中文语料训练，对中文语法和表达习惯有深入理解。秘塔写作猫支持多种写作场景：学术论文、公文报告、新闻稿件、小说创作、社交媒体文案等。秘塔写作猫的核心功能包括：错别字检测（自动识别同音字/形近字错误）、语病修正（搭配不当/成分残缺/句式杂糅）、标点纠错（中英文标点混用修正）、用词建议（提供更优的词语替换）、文章评分（综合评估文章质量）和风格检测（判断文章的正式程度和风格）。秘塔写作猫在中文写作群体中拥有大量用户。\n\n【核心功能】\n1. 错别字检测：识别同音字/形近字错误\n2. 语病修正：检测搭配不当/句式杂糅等\n3. 标点纠错：中英文标点混用修正\n4. 用词建议：提供更优词语替换\n5. 文章评分：综合评估文章质量\n6. 风格检测：判断文章风格和正式程度\n\n【应用场景】\n1. 学术论文：论文的校对和语病修正\n2. 公文写作：报告/通知/公文的语言规范\n3. 新闻稿件：新闻文章的错别字检查\n4. 文学创作：小说/散文的语言润色\n5. 学生作文：作文的批改和优化建议\n6. 职场写作：邮件/报告的用语检查\n\n【收费情况】\n免费+付费。基础校对功能免费。Pro版￥9.9-￥19.9/月，更多字数+高级分析+风格检测。\n\n【使用形态】\n在线SaaS服务。Web端 + 浏览器扩展。\n\n【使用说明】\n1. 访问 xiezuocat.com 注册\n2. 输入或粘贴文章\n3. AI自动扫描并标记问题\n4. 逐个查看修改建议\n5. 一键接受修改\n6. 查看文章评分和统计\n\n【优势】\n1. 中文校对最专业\n2. 错别字检测准确\n3. 语病修正建议好\n4. 免费可用\n5. 操作简单\n\n【劣势】\n1. 对标点纠错过于敏感\n2. 长文档处理慢\n3. 无手机App\n4. 高级功能需付费\n\n【支持平台】\nWeb端、Chrome扩展", "s": "秘塔写作猫是AI中文写作校对工具，检测错别字/语病/标点/用词，称中文版Grammarly。"},
  {"n": "豆包文档助手", "c": "AI办公/文档", "p": "字节跳动", "u": "https://www.doubao.com", "t": "SaaS/Web", "r": "免费", "d": "【产品名片】豆包文档助手 | AI办公/文档 | 字节跳动 | https://www.doubao.com | 收费：免费\n\n【详细介绍】\n豆包文档助手是字节跳动豆包大模型提供的AI文档处理能力，是豆包AI在办公文档场景中的应用。豆包文档助手支持多种文档处理功能：文档摘要（上传长文档AI自动生成摘要）、文档问答（基于文档内容回答用户问题）、文档翻译（多语言文档翻译）、文档改写（润色和改写文档内容）、文档续写（基于开头继续撰写文档）和文档格式转换等。用户可以通过豆包网页端或飞书文档直接使用文档助手功能。豆包文档助手特别适合中文文档的处理——在中文长文档的理解和摘要方面表现出色。豆包文档助手完全免费使用，用户只需注册豆包账号即可使用。豆包文档助手与飞书、剪映等字节系产品协同使用效果更好。豆包文档助手支持PDF/Word/Excel/PPT/图片等多种格式。\n\n【核心功能】\n1. 文档摘要：长文档AI自动生成摘要\n2. 文档问答：基于文档内容AI问答\n3. 文档翻译：多语言文档翻译\n4. 文档改写：润色和改写文档\n5. 文档续写：AI辅助继续撰写\n6. 多格式支持：PDF/Word/Excel/PPT/图片\n\n【应用场景】\n1. 工作文档：周报/报告/方案的AI辅助撰写\n2. 学习资料：教材/论文的AI摘要和问答\n3. 会议纪要：会议记录的整理和摘要\n4. 合同审阅：合同条款的AI分析\n5. 资料翻译：外文文档的AI翻译\n6. 知识整理：多篇文档的交叉分析\n\n【收费情况】\n完全免费。\n\n【使用形态】\nWeb端 + 飞书集成。\n\n【使用说明】\n1. 访问豆包网页端\n2. 上传需要处理的文档\n3. 选择功能（摘要/问答/翻译/改写等）\n4. AI自动处理\n5. 查看结果\n6. 导出或复制\n\n【优势】\n1. 完全免费\n2. 中文处理能力强\n3. 支持多格式文档\n4. 豆包大模型技术\n5. 飞书生态整合\n\n【劣势】\n1. 功能深度有限\n2. 大文档处理慢\n3. 不支持批量\n4. 离线无法使用\n\n【支持平台】\nWeb端、飞书", "s": "豆包文档助手是豆包AI的免费文档处理工具，支持摘要/问答/翻译/改写，中文文档处理出色。"},
  {"n": "AIPPT", "c": "AI办公/文档", "p": "AIPPT", "u": "https://www.aippt.cn", "t": "SaaS/Web", "r": "付费", "d": "【产品名片】AIPPT | AI办公/文档 | AIPPT | https://www.aippt.cn | 收费：付费\n\n【详细介绍】\nAIPPT是国内知名的AI一键生成PPT工具，用户只需输入主题或大纲，AI即可自动生成完整的PPT演示文稿。AIPPT是国产AI PPT工具中的领先产品，在中文PPT生成方面效果最好。AIPPT的工作流程非常简：用户输入PPT的主题和页码要求，AI自动生成大纲和内容，然后选择合适的模板和配色方案，最后生成可编辑的PPTX文件。AIPPT内置了数千套专业PPT模板，覆盖商务汇报/工作总结/项目提案/学术答辩/教学课件/产品发布等场景。AIPPT支持多种输出格式：PPTX（可编辑）/PDF/图片/视频。AIPPT还提供AI大纲编辑（在生成PPT前可修改AI生成的大纲）、单页编辑（对不满意的一页单独优化）和批量替换（一键替换所有页面的品牌色/Logo）。AIPPT在职场人士中使用广泛，特别适合需要快速出PPT的场景。\n\n【核心功能】\n1. AI生成PPT：主题描述自动生成完整PPT\n2. 数千模板：覆盖商务/教育/学术/产品等场景\n3. 多格式输出：PPTX/PDF/图片/视频\n4. AI大纲编辑：生成前可调整大纲\n5. 单页优化：对不满意页面单独修改\n6. 品牌替换：一键替换配色/Logo\n\n【应用场景】\n1. 工作总结：季度/年度总结PPT\n2. 项目提案：项目方案和计划展示\n3. 商业计划：BP/融资PPT\n4. 教学课件：教师课程演示\n5. 产品发布：新品发布会PPT\n6. 学术答辩：论文答辩PPT\n\n【收费情况】\n付费。按次或包年。单次生成约￥9.9-￥19.9。VIP年卡￥199-￥399。\n\n【使用形态】\nWeb端。\n\n【使用说明】\n1. 访问 aippt.cn\n2. 输入PPT主题和页数\n3. AI自动生成大纲\n4. 修改确认大纲\n5. 选择模板和配色\n6. 生成并下载编辑\n\n【优势】\n1. 国产PPT工具领先\n2. 中文内容生成好\n3. 模板丰富专业\n4. 操作极简\n5. 输出格式全\n\n【劣势】\n1. 无免费版\n2. 设计灵活度有限\n3. AI内容有时偏差\n4. 高级模板需额外付费\n\n【支持平台】\nWeb端", "s": "AIPPT是国内领先的AI一键生成PPT工具，主题描述自动生成完整可编辑演示文稿。"},
  {"n": "Microsoft 365 Copilot", "c": "AI办公/文档", "p": "微软", "u": "https://www.microsoft.com/microsoft-365/copilot", "t": "SaaS/Web", "r": "付费", "d": "【产品名片】Microsoft 365 Copilot | AI办公/文档 | 微软 | https://www.microsoft.com/microsoft-365/copilot | 收费：付费\n\n【详细介绍】\nMicrosoft 365 Copilot是微软将GPT-4集成到Office办公套件中的AI助手，是AI办公领域最具影响力的产品之一。Microsoft 365 Copilot覆盖了Word/Excel/PPT/Outlook/Teams/OneNote等所有Office核心应用。在Word中，Copilot可以写文档、润色文字、总结内容和生成摘要；在Excel中，Copilot可以用自然语言分析数据、生成图表和创建公式；在PPT中，Copilot可以根据文档生成完整演示文稿；在Outlook中，Copilot可以总结邮件线程、起草回复和优化邮件措辞；在Teams中，Copilot可以实时总结会议讨论、生成会议纪要和待办事项。Copilot的独特之处在于它理解用户的工作上下文——可以读取当前文档的内容、邮件历史和会议记录来提供更精准的帮助。Microsoft 365 Copilot需要购买商业版订阅。\n\n【核心功能】\n1. Word AI：写文档/润色/摘要/生成\n2. Excel AI：数据分析/图表/公式\n3. PPT AI：文档转演示文稿\n4. Outlook AI：邮件总结/起草/优化\n5. Teams AI：会议总结/待办\n6. 上下文理解：读取工作数据提供精准帮助\n\n【应用场景】\n1. 文档撰写：Word中AI撰写报告/方案\n2. 数据分析：Excel中自然语言分析数据\n3. 演示制作：从Word文档一键生成PPT\n4. 邮件管理：Outlook中AI处理邮件\n5. 会议记录：Teams会议自动生成纪要\n6. 内容总结：长文档/邮件的智能总结\n\n【收费情况】\n付费。需要已有Microsoft 365商业版订阅（$12.5-$22/月），再加$30/用户/月的Copilot订阅。\n\n【使用形态】\nOffice套件内置AI功能。\n\n【使用说明】\n1. 管理员在Microsoft 365管理中心开通Copilot\n2. 用户在Office应用中点击Copilot按钮\n3. 在侧边栏描述需求\n4. AI读取当前文档内容\n5. 生成结果并插入文档\n6. 按需调整\n\n【优势】\n1. Office深度集成\n2. 上下文理解精准\n3. Teams会议总结最实用\n4. 企业级安全和合规\n5. 微软生态协同\n\n【劣势】\n1. 价格极高（$30/人/月）\n2. 仅限企业用户\n3. 非微软应用不可用\n4. 中文支持不够完善\n\n【支持平台】\nWord/Excel/PPT/Outlook/Teams/OneNote（Windows/Mac/Web）", "s": "Microsoft 365 Copilot是Office套件中的AI助手，Word/Excel/PPT/Outlook/Teams全场景AI赋能。"},
  {"n": "Otter.ai", "c": "AI办公/文档", "p": "Otter.ai", "u": "https://otter.ai", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Otter.ai | AI办公/文档 | Otter.ai | https://otter.ai | 收费：免费+付费\n\n【详细介绍】\nOtter.ai是全球领先的AI会议记录和转录工具，专注于将语音会议自动转为文字记录。Otter.ai可以实时转录会议/讲座/采访/播客等语音内容，并自动生成带有说话人标记的文字记录。Otter.ai的核心功能包括：实时转录（在会议进行时自动转写文字，支持Zoom/Teams/Google Meet等平台集成）、自动笔记（AI自动提取会议要点和行动项）、说话人识别（自动区分不同说话人）、关键词搜索（在转录文本中搜索关键词）、自动摘要（会议结束后自动生成摘要）和团队协作（共享笔记和评论）。Otter.ai在远程办公场景中特别实用——参加Zoom会议时Otter会自动加入并记录，会后自动发送会议纪要给所有参会者。Otter.ai还支持从录音文件导入进行转录。\n\n【核心功能】\n1. 实时转录：会议/讲座实时语音转文字\n2. 自动笔记：AI提取会议要点和行动项\n3. 说话人识别：自动识别不同说话人\n4. 自动摘要：会后自动生成摘要\n5. 关键词搜索：在转录中快速搜索\n6. 会议集成：Zoom/Teams/Meet自动记录\n\n【应用场景】\n1. 会议记录：自动记录会议内容\n2. 采访转录：记者采访的自动转写\n3. 讲座记录：课堂/演讲的文字记录\n4. 播客制作：播客录音的转录和编辑\n5. 思路梳理：头脑风暴会议的AI笔记\n6. 法律/医疗：专业场景的准确转录\n\n【收费情况】\n免费+付费。免费版每月300分钟转录。Pro版$16.99/月，无限转录+高级功能+团队协作。\n\n【使用形态】\n在线SaaS服务。Web端 + 移动App。\n\n【使用说明】\n1. 访问 otter.ai 注册\n2. 连接日历，自动加入会议\n3. 或上传录音文件\n4. AI实时转录\n5. 会后查看自动笔记和摘要\n6. 分享给团队成员\n\n【优势】\n1. 会议转录最专业\n2. 实时转录延迟低\n3. 说话人识别准确\n4. Zoom/Teams集成好\n5. 团队协作方便\n\n【劣势】\n1. 中文支持差\n2. 免费版限额少\n3. 环境噪音影响准确率\n4. 国内访问需特殊网络\n\n【支持平台】\nWeb端、iOS App、Android App、Zoom/Teams/Meet集成", "s": "Otter.ai是全球领先的AI会议记录工具，实时语音转文字/自动摘要/说话人识别。"},

  {"n": "ChatPDF", "c": "AI办公/文档", "p": "ChatPDF", "u": "https://www.chatpdf.com", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】ChatPDF | AI办公/文档 | ChatPDF | https://www.chatpdf.com | 收费：免费+付费\n\n【详细介绍】\nChatPDF是全球最知名的AI PDF对话工具，让用户可以与PDF文档进行对话式交流。用户上传PDF后，AI会自动阅读并理解文档内容，然后用户可以像和专家对话一样向PDF提问。ChatPDF代表了「从阅读PDF到对话PDF」的范式转变。ChatPDF的核心体验非常简单：上传PDF→AI分析文档→用户提问→AI基于文档内容回答。ChatPDF对PDF中的文字、表格、图表都能理解，支持多种语言（包括中文）的PDF文档和问答。ChatPDF最大的优势是支持超长PDF（数百页的书籍/论文/合同），AI能记住整个文档的内容并回答跨章节的问题。ChatPDF支持引用标注——每个答案都会标注信息来源的页码，用户可以点击跳转到PDF原文验证。ChatPDF在学生、研究人员和法律从业者中非常受欢迎。\n\n【核心功能】\n1. PDF对话：与PDF文档自然语言对话\n2. 长文档支持：数百页PDF全文理解\n3. 多语言：中文/英文等多语言PDF和问答\n4. 引用标注：答案标注来源页码\n5. 多文档：同时上传多个PDF交叉分析\n6. 快速加载：几秒内完成文档分析\n\n【应用场景】\n1. 学术研究：论文PDF的快速理解\n2. 法律合同：合同条款的AI解读\n3. 教材学习：教材/教科书的AI问答\n4. 研究报告：行业报告的快速摘要\n5. 产品手册：技术文档的问答答疑\n6. 书籍阅读：电子书的AI总结和讨论\n\n【收费情况】\n免费+付费。免费版每天2个PDF（每个最多120页）。付费版$5-20/月，更多PDF+更大文件+更高优先级。\n\n【使用形态】\n在线SaaS服务。Web端。\n\n【使用说明】\n1. 访问 chatpdf.com\n2. 上传PDF文件\n3. 等待AI加载和分析\n4. 在对话框中提问\n5. AI基于PDF内容回答（带页码引用）\n6. 点击引用跳转到原文查看\n\n【优势】\n1. PDF对话体验最流畅\n2. 长文档理解好\n3. 引用标注方便验证\n4. 支持中文\n5. 加载速度快\n\n【劣势】\n1. 免费版限制多\n2. 复杂表格理解有限\n3. 扫描版PDF需OCR\n4. 无文档管理功能\n\n【支持平台】\nWeb端", "s": "ChatPDF是全球最流行的AI PDF对话工具，与PDF自然语言对话问答，带来源页码引用。"},

  {"n": "AutoGPT", "c": "AI Agent/智能体", "p": "Significant Gravitas", "u": "https://github.com/Significant-Gravitas/AutoGPT", "t": "开源框架", "r": "开源免费", "d": "【产品名片】AutoGPT | AI Agent/智能体 | Significant Gravitas | https://github.com/Significant-Gravitas/AutoGPT | 收费：开源免费\n\n【详细介绍】\nAutoGPT是2023年AI领域最具影响力的开源项目之一，它首次展示了「自主AI Agent」的概念——给GPT一个目标，让它自动分解任务、执行操作、评估结果并迭代直到目标完成。AutoGPT的核心创新是「自主循环」机制：AI不断进行「思考→行动→观察→再思考」的循环，直到完成任务。AutoGPT可以自主访问互联网、运行代码、读写文件、调用API和部署应用。AutoGPT项目GitHub star数超过16万，引发了全球对AI Agent的研究热潮。AutoGPT的架构设计为后来的Agent框架（如LangChain Agent、Claude Code等）奠定了基础。AutoGPT支持多种LLM后端（OpenAI/Anthropic/OpenRouter等），用户可以通过配置文件自定义AI行为。AutoGPT适合需要AI自主完成复杂多步骤任务的场景。\n\n【核心功能】\n1. 自主目标完成：设定目标后AI自动执行\n2. 思考-行动-观察循环：自主迭代推进\n3. 互联网访问：自主搜索获取信息\n4. 代码执行：自主编写和运行代码\n5. 文件管理：自主读写和管理文件\n6. 多模型支持：支持多种LLM后端\n\n【应用场景】\n1. 市场研究：自主搜集和分析市场数据\n2. 代码开发：自主编写和调试代码\n3. 内容生成：自主研究并撰写文章\n4. 数据分析：自主获取和分析数据\n5. 自动化运营：社交媒体自动运营\n6. 研究辅助：自主搜索和整理学术资料\n\n【收费情况】\n开源免费（MIT协议）。使用需要自备API Key。\n\n【使用形态】\n开源框架，本地或云端部署。\n\n【使用说明】\n1. 从GitHub克隆AutoGPT\n2. 配置LLM API Key\n3. 设定AI的目标\n4. 启动AutoGPT\n5. 观察AI自主工作过程\n6. 在需要时介入或停止\n\n【优势】\n1. AI Agent概念先驱\n2. 自主完成任务无需人工\n3. 开源可定制\n4. 社区影响力巨大\n5. 支持多种模型\n\n【劣势】\n1. 运行成本较高（API调用多）\n2. 容易陷入无限循环\n3. 任务成功率不稳定\n4. 配置和使用门槛高\n\n【支持平台】\nPython（GitHub开源）", "s": "AutoGPT是自主AI Agent的开源先驱，设定目标后AI自动分解任务/执行/评估直至完成。"},
  {"n": "OpenClaw", "c": "AI Agent/智能体", "p": "Nous Research", "u": "https://github.com/NousResearch/OpenClaw", "t": "开源框架", "r": "开源免费", "d": "【产品名片】OpenClaw | AI Agent/智能体 | Nous Research | https://github.com/NousResearch/OpenClaw | 收费：开源免费\n\n【详细介绍】\nOpenClaw是Nous Research推出的开源智能体（Agent）框架和事件驱动型自动化执行器（event-driven executor），最初为Hermes Agent提供底层Agent运行时。OpenClaw的核心设计理念是「工具驱动的Agent执行」——它提供了一个灵活的执行引擎，让AI模型能够安全地调用各类工具（文件操作/终端命令/Web搜索/API调用等），并在工具调用结果的基础上继续推理和决策。OpenClaw支持多种执行模式：单步执行（每一步都等待确认）、自动执行（AI自主决策和行动）和混合模式。OpenClaw的架构设计清晰，将Agent的「思考」「规划」「工具调用」和「结果评估」分成独立模块，便于开发者理解和定制。OpenClaw完全开源，是学习和研究AI Agent底层机制的良好起点。\n\n【核心功能】\n1. Agent执行引擎：安全的工具调用运行时\n2. 多执行模式：单步/自动/混合模式\n3. 工具集成：文件/终端/Web/API工具\n4. 模块化架构：思考/规划/执行/评估分离\n5. 事件驱动：基于事件触发的自动执行\n6. 开源可定制：完全开放的Agent框架\n\n【应用场景】\n1. Agent开发：构建自定义AI Agent\n2. 自动化工作流：多步骤自动化任务\n3. Agent研究：研究和实验Agent机制\n4. 教育学习：学习AI Agent原理\n5. 工具集成：将新工具集成到Agent中\n6. 性能测试：Agent执行效率和准确性测试\n\n【收费情况】\n开源免费。\n\n【使用形态】\nPython框架，开源代码。\n\n【使用说明】\n1. 从GitHub克隆OpenClaw\n2. 安装依赖\n3. 配置LLM和工具\n4. 定义Agent任务\n5. 运行Agent\n6. 查看执行日志\n\n【优势】\n1. 架构设计清晰\n2. 工具调用机制完善\n3. 多执行模式灵活\n4. Nous Research出品\n5. 与Hermes Agent互补\n\n【劣势】\n1. 文档不够完善\n2. 社区规模较小\n3. 功能相对基础\n4. 需要二次开发\n\n【支持平台】\nPython（GitHub开源）", "s": "OpenClaw是Nous Research的开源Agent执行框架，事件驱动/工具调用/多模式执行，Hermes Agent底层引擎。"},

  {"n": "BabyAGI", "c": "AI Agent/智能体", "p": "Yohei Nakajima", "u": "https://github.com/yoheinakajima/babyagi", "t": "开源框架", "r": "开源免费", "d": "【产品名片】BabyAGI | AI Agent/智能体 | Yohei Nakajima | https://github.com/yoheinakajima/babyagi | 收费：开源免费\n\n【详细介绍】\nBabyAGI是一个轻量级的AI自主任务管理Agent框架，由Yohei Nakajima于2023年发布，是AI Agent领域的经典项目之一。BabyAGI的核心机制是一个循环：从任务列表中取出最高优先级的任务→交给LLM执行→评估结果→根据结果创建新的子任务→重复。BabyAGI会维护一个动态的任务列表，AI自主决定做什么、怎么做、以及接下来做什么。BabyAGI的设计极其精简——核心代码只有100多行Python，但完整展示了AI Agent「任务分解→执行→结果评估→迭代」的核心原理。BabyAGI激发了大量Agent项目的灵感，对AI Agent领域的发展产生了重要影响。BabyAGI支持多种LLM后端，适合学习和实验AI Agent原理。\n\n【核心功能】\n1. 自主任务管理：AI自动创建和管理任务列表\n2. 动态优先级：根据目标调整任务优先级\n3. 任务分解：将大任务自动分解为子任务\n4. 迭代执行：循环执行直到目标完成\n5. 结果评估：AI评估任务执行结果\n6. 轻量易用：核心代码仅100+行\n\n【应用场景】\n1. 学习AI Agent：理解AI自主任务管理原理\n2. 原型开发：快速搭建Agent原型\n3. 研究实验：实验不同的Agent策略\n4. 教学演示：展示AI Agent机制\n5. 简单自动化：轻量级自主任务执行\n6. Agent开发基础：作为Agent框架的基础\n\n【收费情况】\n开源免费（MIT协议）。需自备API Key。\n\n【使用形态】\nPython开源框架。\n\n【使用说明】\n1. 从GitHub克隆BabyAGI\n2. 配置OpenAI API Key\n3. 设置目标\n4. 运行BabyAGI\n5. 观察任务分解和迭代\n6. 分析执行结果\n\n【优势】\n1. 代码极简易理解\n2. AI Agent经典实现\n3. 学习价值高\n4. 可快速实验\n5. 启发后续众多项目\n\n【劣势】\n1. 功能非常基础\n2. 不适用生产环境\n3. 缺乏错误处理\n4. 仅支持OpenAI\n\n【支持平台】\nPython（GitHub开源）", "s": "BabyAGI是轻量级AI自主任务管理Agent框架，核心代码仅100+行，展示了AI Agent核心原理。"},

  {"n": "DataGPT", "c": "AI数据分析/BI", "p": "DataGPT", "u": "https://www.datagpt.com", "t": "SaaS/Web", "r": "付费", "d": "【产品名片】DataGPT | AI数据分析/BI | DataGPT | https://www.datagpt.com | 收费：付费\n\n【详细介绍】\nDataGPT是一款AI驱动的自然语言数据分析平台，定位为「AI数据分析师」。DataGPT的核心能力是让用户用自然语言提出问题，AI自动连接到数据源、进行分析、并给出带可视化图表和数据洞察的答案。DataGPT的独特之处在于其「对话式数据分析」理念——用户不需要写SQL、不需要拖拽图表，只需要像聊天一样提问。DataGPT支持连接多种数据源（SQL数据库/数据仓库/CSV文件/Google Sheets/SaaS API等），AI自动理解数据结构和关系。DataGPT的功能包括：数据问答（自然语言→SQL→数据→图表）、数据洞察（AI自动分析数据变化原因）、异常检测（AI自动发现数据异常并分析原因）、预测分析（AI基于历史数据预测趋势）和报告自动化（定时生成和发送分析报告）。DataGPT在企业数据分析场景中应用广泛。\n\n【核心功能】\n1. 自然语言数据问答：提问AI自动分析\n2. 自动数据洞察：AI发现数据变化原因\n3. 异常检测：自动发现和解释异常\n4. 预测分析：AI预测数据趋势\n5. 报告自动化：定时生成分析报告\n6. 多数据源：连接数据库/文件/SaaS\n\n【应用场景】\n1. 业务数据分析：市场/销售/运营数据AI分析\n2. 数据驱动决策：用数据指导业务决策\n3. 临时数据查询：非技术人员自助查数据\n4. 异常监控：数据异常的AI检测和预警\n5. 定期报告：自动生成周报/月报\n6. 数据洞察分享：将分析结果分享团队\n\n【收费情况】\n付费。按用户数和数据量定价。起价约$50/月。\n\n【使用形态】\n在线SaaS服务。Web端。\n\n【使用说明】\n1. 访问 datagpt.com 注册\n2. 连接数据源\n3. 在对话框输入问题\n4. AI自动分析并生成图表\n5. 追问深入分析\n6. 分享或导出报表\n\n【优势】\n1. 自然语言分析最自由\n2. 无需SQL技能\n3. 洞察分析深入\n4. 数据源连接方便\n5. 响应速度快\n\n【劣势】\n1. 无免费版\n2. 复杂分析能力有限\n3. 数据集大小有限\n4. 中文支持一般\n\n【支持平台】\nWeb端", "s": "DataGPT是AI自然语言数据分析平台，像聊天一样提问AI自动分析数据并生成可视化图表。"},

  {"n": "Blender AI", "c": "AI 3D/建模", "p": "Blender Foundation", "u": "https://www.blender.org", "t": "开源软件", "r": "开源免费", "d": "【产品名片】Blender AI | AI 3D/建模 | Blender Foundation | https://www.blender.org | 收费：开源免费\n\n【详细介绍】\nBlender是一款全球最流行的开源3D建模和动画软件，其AI功能通过社区插件和内置功能不断扩展。Blender本身提供了完整的3D创作套件——建模/雕刻/纹理/绑定/动画/渲染/合成/视频编辑全流程支持。Blender的AI功能主要通过社区开发的插件实现，包括：AI纹理生成（AI根据描述生成PBR纹理）、AI姿态生成（AI自动生成角色绑定姿态）、AI材质智能适配、AI去噪（渲染后AI自动去除噪点）、AI自动拓扑（从高模自动生成低模的拓扑结构）和AI场景生成（AI辅助生成3D场景）。Blender完全开源免费，拥有全球最大的3D创作者社区。Blender在独立游戏开发、影视动画和建筑可视化领域有极其广泛的应用。\n\n【核心功能】\n1. 3D建模：多边形/雕刻/曲线建模\n2. AI纹理生成：AI自动生成材质纹理\n3. AI去噪：渲染AI降噪\n4. AI姿态生成：角色绑定AI辅助\n5. AI材质：智能材质适配\n6. 全流程：建模到渲染一站式\n\n【应用场景】\n1. 3D建模：角色/场景/道具模型制作\n2. 动画制作：角色动画和关键帧\n3. 游戏开发：游戏资产制作\n4. 影视特效：VFX和合成\n5. 建筑可视化：建筑室内外效果图\n6. 3D打印：模型设计和导出\n\n【收费情况】\n完全免费开源。\n\n【使用形态】\n桌面软件。Windows/Mac/Linux。\n\n【使用说明】\n1. 从blender.org下载安装\n2. 熟悉界面和工作流\n3. 使用基础建模工具\n4. 安装AI插件增强功能\n5. 建模/材质/渲染/动画\n6. 导出成品\n\n【优势】\n1. 完全免费功能强大\n2. 社区最大最活跃\n3. AI插件生态丰富\n4. 全流程覆盖\n5. 跨平台支持\n\n【劣势】\n1. 学习曲线陡峭\n2. 原生AI功能有限\n3. 插件质量参差\n4. 大场景性能不如付费软件\n\n【支持平台】\nWindows、macOS、Linux", "s": "Blender是免费开源3D建模软件，AI纹理生成/去噪/姿态生成等社区插件生态丰富。"},

  {"n": "Ollama", "c": "AI开发平台", "p": "Ollama", "u": "https://ollama.ai", "t": "开源工具", "r": "开源免费", "d": "【产品名片】Ollama | AI开发平台 | Ollama | https://ollama.ai | 收费：开源免费\n\n【详细介绍】\nOllama是一款让用户「一键本地运行大模型」的开源工具，是本地AI部署领域最受欢迎的项目之一。Ollama极大地降低了在个人电脑上运行大语言模型的门槛——用户只需在终端中输入几条命令即可下载和运行Llama/Mistral/Qwen/DeepSeek等主流开源大模型。Ollama的核心价值在于它解决了本地运行大模型的主要痛点：模型下载管理（自动下载模型文件）、GPU加速开箱即用（自动配置CUDA/Metal加速）、API兼容（提供OpenAI兼容的API接口）、模型自定义（支持GGUF格式的自定义模型）和跨平台（Windows/Mac/Linux全支持）。Ollama的使用极其简单——一条命令即可启动对话。Ollama在开发者社区中非常火爆，GitHub star数超过10万。\n\n【核心功能】\n1. 一键运行模型：命令启动本地大模型\n2. 模型管理：自动下载和管理模型\n3. GPU加速：自动配置CUDA/Metal\n4. OpenAI兼容API：本地API服务\n5. 模型自定义：支持自定义GGUF模型\n6. 跨平台：Windows/Mac/Linux\n\n【应用场景】\n1. 本地AI助手：离线使用AI对话\n2. 开发测试：本地测试AI应用\n3. 隐私保护：数据不离开本地\n4. 学习研究：学习和实验不同模型\n5. API服务：本地提供AI API\n6. 离线环境：无网络环境使用AI\n\n【收费情况】\n开源免费（MIT协议）。\n\n【使用形态】\n命令行工具 + API。\n\n【使用说明】\n1. 从ollama.ai下载安装\n2. 终端输入 ollama pull llama3\n3. 输入 ollama run llama3\n4. 开始对话\n5. 使用API调用\n6. 拉取其他模型\n\n【优势】\n1. 使用最简单\n2. GPU加速开箱即用\n3. 模型选择丰富\n4. API兼容OpenAI\n5. 社区最活跃\n\n【劣势】\n1. 不支持训练\n2. 大模型需要大内存\n3. 对话窗口有限\n4. 多模态支持有限\n\n【支持平台】\nWindows、macOS、Linux", "s": "Ollama是本地一键跑大模型工具，命令启动/GPU加速/OpenAI兼容API/跨平台，超10万GitHub star。"},
  {"n": "ComfyUI", "c": "AI设计/图像", "p": "ComfyUI社区", "u": "https://github.com/comfyanonymous/ComfyUI", "t": "开源工具", "r": "开源免费", "d": "【产品名片】ComfyUI | AI设计/图像 | ComfyUI社区 | https://github.com/comfyanonymous/ComfyUI | 收费：开源免费\n\n【详细介绍】\nComfyUI是全球最流行的AI绘图工作流工具，基于节点式图形界面（Node-based UI）让用户可视化搭建Stable Diffusion等AI模型的推理流程。与Stable Web UI（面向普通用户的页面式操作）不同，ComfyUI采用节点图的方式让用户精确控制AI绘图的每一个步骤。ComfyUI的核心优势在于：节点式工作流（用户可以自由组合和连接各个处理节点，实现无限可能的AI绘图流水线）、精确控制（每个参数和模型都可以精细调整）、高效推理（比Web UI更少的内存占用和更快的生成速度）、工作流分享（节点图可以保存为JSON文件分享给他人）和扩展生态（支持各种自定义节点/模型/LoRA/ControlNet等）。ComfyUI是目前专业AI绘图用户（包括艺术家/设计师/研究者）的首选工具。\n\n【核心功能】\n1. 节点式工作流：可视化搭建AI绘图流程\n2. 精确控制：每个参数精细调整\n3. 高效推理：低内存高速度\n4. 工作流分享：JSON格式分享节点图\n5. 扩展生态：自定义节点/LoRA/ControlNet\n6. 多模型支持：SD/SDXL/Flux等\n\n【应用场景】\n1. AI艺术创作：专业AI绘画工作流\n2. 批量出图：高效的大规模图像生成\n3. 实验研究：AI模型参数实验\n4. 视频生成：AI视频的工作流搭建\n5. 模型融合：多个模型组合使用\n6. 教学分享：工作流截图分享教学\n\n【收费情况】\n开源免费。\n\n【使用形态】\n桌面端软件。本地运行。\n\n【使用说明】\n1. 从GitHub下载ComfyUI\n2. 解压运行\n3. 在浏览器中打开界面\n4. 拖拽节点构建工作流\n5. 加载模型生成图像\n6. 保存工作流分享\n\n【优势】\n1. 最灵活的AI绘图控制\n2. 高效推理性能\n3. 节点图可分享\n4. 扩展生态最丰富\n5. 专业用户首选\n\n【劣势】\n1. 学习曲线陡峭\n2. 界面不够友好\n3. 需要手动搭建\n4. 节点复杂时混乱\n\n【支持平台】\nWindows、macOS、Linux", "s": "ComfyUI是节点式AI绘图工作流工具，可视化搭建Stable Diffusion/Flux等模型的生成流程。"},
  {"n": "Stable Web UI", "c": "AI设计/图像", "p": "AUTOMATIC1111", "u": "https://github.com/AUTOMATIC1111/stable-diffusion-webui", "t": "开源工具", "r": "开源免费", "d": "【产品名片】Stable Web UI | AI设计/图像 | AUTOMATIC1111 | https://github.com/AUTOMATIC1111/stable-diffusion-webui | 收费：开源免费\n\n【详细介绍】\nStable Web UI（全称Stable Diffusion WebUI，由AUTOMATIC1111开发）是Stable Diffusion的开源Web界面，是目前用户量最大的AI本地绘图工具。Stable Web UI将Stable Diffusion模型的复杂命令行操作封装成直观的Web界面，让用户通过浏览器即可在本地GPU上生成AI图像。Stable Web UI的功能极其丰富：文生图（Text-to-Image）、图生图（Image-to-Image）、局部重绘（Inpainting）、图像扩展（Outpainting）、批量处理（Batch Processing）、ControlNet控制（精确控制生成姿势/深度/边缘等）、LoRA模型支持、超网络（Hypernetwork）、文本反转（Textual Inversion）和训练功能（DreamBooth微调）。Stable Web UI在GitHub上拥有超过15万star，是最大的AI图像生成开源项目。\n\n【核心功能】\n1. 文生图：文字描述生成图像\n2. 图生图：基于参考图生成\n3. 局部重绘：修改图像的指定区域\n4. ControlNet：精确控制生成效果\n5. LoRA/超网络：模型微调和风格控制\n6. 批量处理：大规模批量出图\n\n【应用场景】\n1. AI绘画入门：最简单的本地绘图工具\n2. 批量创作：大规模AI图像生成\n3. 图像修改：局部重绘和图像扩展\n4. 角色设计：LoRA模型训练和生成\n5. 电商设计：产品图和场景图批量生成\n6. 学术研究：AI图像生成实验\n\n【收费情况】\n开源免费。\n\n【使用形态】\n桌面端Web界面。本地运行。\n\n【使用说明】\n1. 从GitHub下载并安装\n2. 运行启动脚本\n3. 在浏览器打开Web界面\n4. 选择模型并输入提示词\n5. 调整参数\n6. 点击生成\n\n【优势】\n1. 用户量最大的绘图工具\n2. 功能最全面\n3. 插件生态丰富\n4. 社区资源最多\n5. 持续更新\n\n【劣势】\n1. 界面老旧\n2. 内存占用高\n3. 生成速度不如ComfyUI\n4. 配置复杂\n\n【支持平台】\nWindows、macOS、Linux", "s": "Stable Web UI是Stable Diffusion的开源Web界面，功能最全的本地AI绘图工具，15万+GitHub star。"},

  var t=D.find(function(x){return x.n.replace(/'/g,'').replace(/"/g,'')===sn});
  if(!t) return;
  var d=t.d, h='';
  
  // Hero
  h+='<div class="m-hero"><div class="mi"><img class="logo" src="'+logoUrl(t.u)+'.ico" alt="'+t.n+'" onerror="tryLogo(this)"></div><div class="mt"><h2>'+esc(t.n)+'</h2><div class="mp"><span>🏢 '+esc(t.p)+'</span><span>📦 '+t.t+'</span></div><div class="mtags"><span class="mtag">'+esc(t.c)+'</span><span class="mtag">💰 '+esc(t.r)+'</span></div></div></div>';
  // URL bar - text display
  h+='<div class="m-url"><span class="ml">🌐</span><a href="'+t.u+'" target="_blank" rel="noopener">'+esc(t.u)+'</a></div>';
  
  // Form
  h+='<div class="m-form">📌 使用形态：'+t.t+'</div>';
  
  // Parse sections
  var secs=d.split('【');
  for(var i=1;i<secs.length;i++){
    var ei=secs[i].indexOf('】');
    if(ei<0) continue;
    var title=secs[i].substring(0,ei).trim();
    var body=secs[i].substring(ei+1).trim();
    if(body.length<5) continue;
    
    // Intro
    if(title.indexOf('详细介绍')>=0){
      h+='<div class="m-intro"><div class="sc">'+body.replace(/\n/g,'<br>')+'</div></div>';
    }
    // Features
    else if(title.indexOf('核心功能')>=0){
      var items=body.split(/\n+/).filter(function(x){return x.trim()});
      h+='<div class="m-h3"><span class="si">⚡</span>核心功能</div><div class="m-fg">';
      var icons=['🧠','💻','🤖','📊','🎨','🎬','🎵','📝','🔧','🌐','🔍','⚡','📚','🏥','⚖','🎧','👥','📺','🛒','🏭','🔒','🚗','🌾','🚚'];
      for(var j=0;j<items.length;j++){
        var it=items[j].trim();
        var m=it.match(/^(\d+)[\.、]\s*(.*)/);
        var num=m?parseInt(m[1]):(j+1);
        var txt=m?m[2]:it;
        var ico=icons[(num-1)%icons.length]||'🔹';
        h+='<div class="m-fi"><span class="fi">'+ico+'</span><div class="fn">功能 '+num+'</div><div class="fd">'+esc(txt)+'</div></div>';
      }
      h+='</div>';
    }
    // Scenes
    else if(title.indexOf('应用场景')>=0){
      var items=body.split(/\n+/).filter(function(x){return x.trim()});
      h+='<div class="m-h3"><span class="si">🎯</span>应用场景</div><div class="m-sg">';
      for(var j=0;j<items.length;j++){
        var it=items[j].trim();
        var m=it.match(/^(\d+)[\.、]\s*(.*)/);
        var txt=m?m[2]:it;
        h+='<div class="m-sc"><div class="st">'+(m?'<b>场景 '+m[1]+'</b> ':'')+esc(txt)+'</div></div>';
      }
      h+='</div>';
    }
    // Pricing
    else if(title.indexOf('收费')>=0||title.indexOf('价格')>=0){
      h+='<div class="m-h3"><span class="si">💰</span>收费情况</div><div class="m-price"><div class="sc">'+body.replace(/\n/g,'<br>')+'</div></div>';
    }
    // Usage
    else if(title.indexOf('使用说明')>=0){
      var items=body.split(/\n+/).filter(function(x){return x.trim()});
      h+='<div class="m-h3"><span class="si">📋</span>使用说明</div><div class="m-steps">';
      for(var j=0;j<items.length;j++){
        var it=items[j].trim();
        var txt=it.replace(/^(\d+[\.、\s]*)/,'').trim();
        h+='<div class="m-step"><span class="sn">'+(j+1)+'</span><div class="sd">'+esc(txt)+'</div></div>';
      }
      h+='</div>';
    }
    // Pros
    else if(title.indexOf('优势')>=0){
      var items=body.split(/\n+/).filter(function(x){return x.trim()});
      if(items.length>1){
        // Pair with cons if not already paired
        if(!h.match(/m-cons/)){
          // Find cons section later
        }
        var html='<div class="m-pros"><div class="pt">✅ 优势</div><div class="pl">';
        for(var j=0;j<items.length;j++){
          var it=items[j].trim();
          it=it.replace(/^\d+[\.、\s]*/,'').trim();
          html+= '<div class="li">'+esc(it)+'</div>';
        }
        html+='</div></div>';
        h+=html;
      }
    }
    // Cons
    else if(title.indexOf('劣势')>=0){
      var items=body.split(/\n+/).filter(function(x){return x.trim()});
      if(items.length>1){
        var html='<div class="m-cons"><div class="pt">⚠️ 劣势</div><div class="pl">';
        for(var j=0;j<items.length;j++){
          var it=items[j].trim();
          it=it.replace(/^\d+[\.、\s]*/,'').trim();
          html+= '<div class="li">'+esc(it)+'</div>';
        }
        html+='</div></div>';
        h+=html;
      }
    }
    // Platform
    else if(title.indexOf('平台')>=0){
      var items=body.split(/[\/\n]+/).filter(function(x){return x.trim()});
      h+='<div class="m-h3"><span class="si">📱</span>支持平台</div><div class="m-plat">';
      for(var j=0;j<items.length;j++){
        var it=items[j].trim().replace(/^[、,，\s]+/,'');
        if(it) h+='<span class="pb">'+esc(it)+'</span>';
      }
      h+='</div>';
    }
    // Card or others
    else if(title.indexOf('名片')>=0){}
    else {
      h+='<div class="m-h3"><span class="si">📋</span>'+title+'</div><div style="font-size:.82em;color:#475569;line-height:1.7;margin-bottom:20px">'+body.replace(/\n/g,'<br>')+'</div>';
    }
  }
  
  // Group pros/cons together if both exist
  var bodyEl=document.createElement('div'); bodyEl.innerHTML=h;
  var prosEl=bodyEl.querySelector('.m-pros');
  var consEl=bodyEl.querySelector('.m-cons');
  if(prosEl&&consEl){
    var wrapper=document.createElement('div'); wrapper.className='m-pc';
    wrapper.appendChild(prosEl.cloneNode(true));
    wrapper.appendChild(consEl.cloneNode(true));
    prosEl.parentNode.replaceChild(wrapper,prosEl);
    consEl.parentNode.removeChild(consEl);
    h=bodyEl.innerHTML;
  }
  
    
  // Footer buttons
  h+='<div class="m-foot"><a href="'+t.u+'" target="_blank" rel="noopener">🌐 访问官网 ↗</a><span class="mf-close" onclick="cModal()">✕ 关闭本页</span></div>';
    
  // Footer buttons

  document.getElementById('mbody').innerHTML=h;
  document.getElementById('modal').classList.add('on');
  document.body.style.overflow='hidden';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function cModal(){document.getElementById('modal').classList.remove('on');document.body.style.overflow=''}
function doSearch(){Q=document.getElementById('sq').value.trim();show()}

document.addEventListener('keydown',function(e){if(e.key==='Escape')cModal()});
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)cModal()});
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',show)}else{show()}
</script>
