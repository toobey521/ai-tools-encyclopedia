<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI 工具百科全书</title>
<style>
/* ===== DESIGN SYSTEM ===== */
:root{
  --bg:#f8fafc;
  --surface:#fff;
  --border:#e2e8f0;
  --border-bold:#cbd5e1;
  --text:#0f172a;
  --text-secondary:#475569;
  --text-muted:#94a3b8;
  --primary:#6366f1;
  --primary-light:#eef2ff;
  --accent:#8b5cf6;
  --success:#059669;
  --success-light:#ecfdf5;
  --warning:#d97706;
  --warning-light:#fffbeb;
  --danger:#dc2626;
  --danger-light:#fef2f2;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --radius-xl:24px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow-md:0 4px 16px rgba(0,0,0,.07);
  --shadow-lg:0 12px 48px rgba(0,0,0,.1);
  --shadow-xl:0 24px 80px rgba(15,23,42,.15);
  --transition:.25s cubic-bezier(.4,0,.2,1)
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;-webkit-font-smoothing:antialiased}

/* ===== HEADER ===== */
.header{text-align:center;padding:56px 24px 40px;background:linear-gradient(160deg,#eef2ff 0%,#e0e7ff 40%,#f5f3ff 100%);position:relative;overflow:hidden;border-bottom:1px solid rgba(226,232,240,.6)}
.header::before{content:'';position:absolute;top:-50%;right:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(99,102,241,.08) 0%,transparent 70%);border-radius:50%}
.header::after{content:'';position:absolute;bottom:-30%;left:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(139,92,246,.06) 0%,transparent 70%);border-radius:50%}
.header h1{font-size:1.75em;background:linear-gradient(135deg,#4338ca 0%,#6366f1 50%,#8b5cf6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;letter-spacing:-.5px;position:relative}.header h1 .he{display:inline;-webkit-text-fill-color:initial;background:none}
.header p{font-size:.82em;color:var(--text-secondary);position:relative}

/* ===== CONTAINER ===== */
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px}

/* ===== SEARCH ===== */
.sbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.sbar input{width:280px;padding:10px 16px 10px 40px;border:2px solid var(--border);border-radius:100px;font-size:.85em;background:var(--surface);outline:none;transition:var(--transition);box-shadow:var(--shadow-sm);flex-shrink:0}
.sbar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.sbar .sbar .si{font-size:.92em;color:var(--text-muted);margin-right:-32px;z-index:1;pointer-events:none;flex-shrink:0}

/* ===== CATEGORY GRID ===== */
.cgrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.catb{padding:7px 16px;border:1.5px solid var(--border);border-radius:100px;background:var(--surface);cursor:pointer;font-size:.72em;color:var(--text-secondary);transition:var(--transition);user-select:none;font-weight:500}
.catb:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);transform:translateY(-1px)}
.catb.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(99,102,241,.3)}

/* ===== TOOL COUNT ===== */
.tcnt{font-size:.8em;color:var(--text-secondary);margin-bottom:14px;padding:0 2px}
.tcnt span{font-weight:700;color:var(--primary)}

/* ===== TOOL GRID ===== */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

/* ===== TOOL CARD ===== */
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;cursor:pointer;transition:var(--transition);position:relative;box-shadow:var(--shadow-sm);overflow:hidden}
.tcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:var(--radius-lg) var(--radius-lg) 0 0;opacity:0;transition:var(--transition)}
.tcard:hover{transform:translateY(-6px);box-shadow:0 20px 60px rgba(99,102,241,.12);border-color:var(--primary)}
.tcard:hover::before{opacity:1}
.tcard:active{transform:translateY(-1px)}

.tcard .badge{position:absolute;top:14px;right:14px;font-size:.58em;padding:3px 10px;border-radius:20px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.bdg-free{background:var(--success-light);color:var(--success);border:1px solid #a7f3d0}
.bdg-paid{background:var(--danger-light);color:var(--danger);border:1px solid #fecaca}
.bdg-freemium{background:var(--warning-light);color:var(--warning);border:1px solid #fde68a}

.tcard .ch{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.tcard .ci{width:44px;height:44px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--primary-light),#f5f3ff);display:flex;align-items:center;justify-content:center;font-size:1.2em;flex-shrink:0;box-shadow:0 2px 8px rgba(99,102,241,.08)}
.tcard .ci-txt{flex:1;min-width:0}
.tcard .ci-txt h3{font-size:1em;color:var(--text);font-weight:600;margin-bottom:2px}
.tcard .ci-txt .prov{font-size:.7em;color:var(--text-muted);display:flex;align-items:center;gap:4px}
.tcard .tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tcard .tags .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.62em;font-weight:500}
.tag-cat{background:var(--primary-light);color:var(--primary);border:1px solid #c7d2fe}
.tag-type{background:#f5f3ff;color:var(--accent);border:1px solid #ede9fe}
.tcard .sum{font-size:.76em;color:var(--text-secondary);line-height:1.55;padding:8px 12px;background:#f8fafc;border-radius:var(--radius-sm);border:1px solid #f1f5f9}

/* ===== MODAL ===== */
.modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(16px);overflow-y:auto;padding:32px}
.modal.on{display:block}
.mbox{background:var(--surface);margin:0 auto;max-width:880px;border-radius:var(--radius-xl);position:relative;box-shadow:0 32px 100px rgba(15,23,42,.18);border:1px solid rgba(226,232,240,.4);animation:pop .45s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
/* mclose - top-right close button */
.mclose{position:absolute;top:16px;right:16px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:1em;cursor:pointer;color:var(--text-muted);background:var(--bg);border:none;transition:var(--transition);z-index:2}
.mclose:hover{background:var(--border);color:var(--text);transform:rotate(90deg)}

/* ===== MODAL CONTENT ===== */
#mbody{padding:32px 36px 28px}

/* Hero */
.m-hero{background:linear-gradient(160deg,#4338ca 0%,#6366f1 40%,#7c3aed 100%);border-radius:var(--radius-xl);padding:32px 36px;margin:-28px -32px 28px;display:flex;gap:20px;align-items:flex-start;color:#fff;position:relative;overflow:hidden}
.m-hero::after{content:'';position:absolute;top:-30%;right:-10%;width:200px;height:200px;background:rgba(255,255,255,.06);border-radius:50%}
.m-hero .mi{width:60px;height:60px;border-radius:var(--radius-md);background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.8em;flex-shrink:0;backdrop-filter:blur(8px);position:relative;z-index:1}
.m-hero .mt{flex:1;position:relative;z-index:1}
.m-hero .mt h2{font-size:1.55em;font-weight:700;margin-bottom:6px;letter-spacing:-.5px}
.m-hero .mt .mp{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.78em;opacity:.85;margin:6px 0;font-weight:500}
.m-hero .mt .mp span{display:inline-flex;align-items:center;gap:5px}
.m-hero .mt .mtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.m-hero .mt .mtags .mtag{padding:5px 16px;border-radius:100px;font-size:.68em;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);letter-spacing:.3px}

/* ===== MODAL URL BAR (clickable link) ===== */
.m-url{font-size:.85em;color:var(--text-secondary);margin:-6px 0 24px;padding:10px 16px;background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius-md);word-break:break-all;line-height:1.5}
.m-url .ml{color:var(--text-muted);margin-right:6px}
.m-url a{color:var(--primary);text-decoration:underline;text-decoration-color:#c7d2fe;text-underline-offset:2px}
.m-url a:hover{color:#4338ca;text-decoration-color:var(--primary)}

/* ===== MODAL FOOTER BUTTONS ===== */
.m-foot{display:flex;gap:12px;margin-top:28px;padding-top:18px;border-top:1.5px solid var(--border)}
.m-foot a,.m-foot .mf-close{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 22px;border-radius:var(--radius-md);font-size:.82em;font-weight:600;text-decoration:none;cursor:pointer;transition:var(--transition);border:1.5px solid var(--border)}
.m-foot a{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 16px rgba(99,102,241,.25)}
.m-foot a:hover{background:#4f46e5;transform:translateY(-2px);box-shadow:0 4px 12px rgba(99,102,241,.35)}
.m-foot .mf-close{background:var(--surface);color:var(--text-secondary)}
.m-foot .mf-close:hover{background:var(--bg);color:var(--text);border-color:var(--text-muted)}

/* Section title */
.m-h3{display:flex;align-items:center;gap:8px;font-size:.9em;font-weight:700;color:var(--text);margin:0 0 16px;padding-bottom:10px;border-bottom:2px solid var(--border);letter-spacing:-.2px}
.m-h3 .si{font-size:1em}

/* Intro section */
.m-intro{background:linear-gradient(135deg,#f8faff,#f5f3ff);border:1px solid #e0e7ff;border-radius:var(--radius-md);padding:20px 24px;margin-bottom:24px;border-left:4px solid var(--primary)}
.m-intro .sc{font-size:.92em;color:#334155;line-height:1.7}

/* Feature grid */
.m-fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.m-fi{border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;transition:var(--transition);background:linear-gradient(135deg,#fff,#fafaff);position:relative;overflow:hidden}
.m-fi:hover{box-shadow:0 4px 16px rgba(99,102,241,.08);border-color:#c7d2fe;transform:translateY(-2px)}
.m-fi .fi{font-size:1.1em;margin-bottom:4px;display:block}
.m-fi .fn{font-size:.85em;font-weight:600;color:var(--text);margin-bottom:2px}
.m-fi .fd{font-size:.82em;color:var(--text-secondary);line-height:1.5}

/* Scene grid */
.m-sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.m-sc{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;transition:var(--transition)}
.m-sc .st{font-size:.85em;color:#334155;line-height:1.5}
.m-sc .st b{color:var(--primary)}

/* Pricing */
.m-price{background:linear-gradient(135deg,var(--warning-light),#fef3c7);border:1px solid #fde68a;border-radius:var(--radius-md);padding:18px 24px;margin-bottom:24px}
.m-price .sc{font-size:.88em;color:#92400e;line-height:1.6}

/* Form badge */
.m-form{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:100px;font-size:.8em;background:#f5f3ff;color:var(--accent);border:1px solid #ede9fe;margin-bottom:24px;font-weight:600}

/* Steps */
.m-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.m-step{display:flex;gap:14px;align-items:flex-start;background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;transition:var(--transition)}
.m-step .sn{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.65em;font-weight:700;flex-shrink:0;margin-top:1px}
.m-step .sd{font-size:.85em;color:#334155;line-height:1.5;flex:1}

/* Pros/Cons side by side */
.m-pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.m-pros{background:var(--success-light);border:1px solid #bbf7d0;border-radius:var(--radius-md);padding:16px 20px}
.m-pros .pt{font-size:.78em;font-weight:600;color:var(--success);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.m-pros .pl{font-size:.82em;color:#166534;line-height:1.6}
.m-pros .pl .li{padding:1px 0;display:flex;gap:4px}
.m-pros .pl .li::before{content:'✦';color:#34d399;flex-shrink:0}
.m-cons{background:var(--danger-light);border:1px solid #fecaca;border-radius:var(--radius-md);padding:16px 20px}
.m-cons .pt{font-size:.78em;font-weight:600;color:var(--danger);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.m-cons .pl{font-size:.82em;color:#991b1b;line-height:1.6}
.m-cons .pl .li{padding:1px 0;display:flex;gap:4px}
.m-cons .pl .li::before{content:'⚠';color:#f87171;flex-shrink:0}

/* Platforms */
.m-plat{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.m-plat .pb{padding:5px 14px;border-radius:20px;font-size:.82em;background:var(--primary-light);color:var(--primary);border:1px solid #c7d2fe}

@media(max-width:700px){
  .header{padding:32px 16px 24px}.header h1{font-size:1.3em}
  .tgrid{grid-template-columns:1fr}
  .m-fg,.m-sg,.m-pc{grid-template-columns:1fr}
  .m-hero{flex-direction:column;padding:20px 18px;margin:-28px -16px 20px;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
  .m-hero .mi{width:44px;height:44px;font-size:1.4em}
  #mbody{padding:20px 16px}.m-url{flex-direction:column}.m-foot{flex-direction:column}
}
.em{padding:60px;text-align:center;color:var(--text-muted);font-size:.85em;grid-column:1/-1}












.cbdg{display:inline-block;font-size:.6em;padding:2px 7px;border-radius:12px;margin-left:5px;line-height:1.3;font-weight:600;vertical-align:middle;border:1px solid}
.bdg-中国{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.bdg-美国{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
.bdg-欧洲{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.bdg-英国{background:#f5f3ff;color:#7c3aed;border-color:#ddd6fe}
.bdg-法国{background:#fff7ed;color:#ea580c;border-color:#fed7aa}
.bdg-其他{background:#f8fafc;color:#64748b;border-color:#e2e8f0}

#btt{position:fixed;bottom:40px;right:30px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:22px;font-weight:700;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:999;box-shadow:0 4px 15px rgba(99,102,241,.4);transition:all .3s;border:none;user-select:none}
#btt:hover{transform:translateY(-3px);box-shadow:0 6px 25px rgba(99,102,241,.5)}

.prb{display:inline-flex;align-items:center;gap:4px;padding:7px 16px;border:1.5px solid var(--border);border-radius:100px;background:var(--surface);cursor:pointer;font-size:.72em;font-weight:500;color:var(--text-secondary);transition:var(--transition);user-select:none;white-space:nowrap}
.prb:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);transform:translateY(-1px)}
.prb.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(99,102,241,.3)}

.bdg-加拿大{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.bdg-澳大利亚{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.bdg-荷兰{background:#f5f3ff;color:#7c3aed;border-color:#ddd6fe}

/* ===== LOGO IMAGES ===== */
.logo{width:100%;height:100%;object-fit:contain;border-radius:6px;display:block}
.ci{display:flex;align-items:center;justify-content:center;overflow:hidden}
.ci img.logo{width:36px;height:36px}
.mi{display:flex;align-items:center;justify-content:center;overflow:hidden}
.mi img.logo{width:48px;height:48px;border-radius:10px}
</style>
</head>
<body>
<div class="header"><h1><span class="he">🤖</span> 中国AI工具百科全书</h1><p>覆盖17大行业 · 300款AI工具 · 每款详细实操详情</p></div>
<div class="wrap">
<div class="sbar"><span class="si">🔍</span><input id="sq" type="text" placeholder="搜索工具名称或行业..." oninput="doSearch()"><span class="prb" data-pr="" onclick="PR=null;show()">全部</span><span class="prb" data-pr="免费" onclick="PR='免费';show()">🆓 免费</span><span class="prb" data-pr="付费" onclick="PR='付费';show()">💰 付费</span><span class="prb" data-pr="免费+付费" onclick="PR='免费+付费';show()">🔄 免费+付费</span></div>
<div id="cats" class="cgrid"></div>
<div id="cnt" class="tcnt"></div>
<div id="grid" class="tgrid"></div>

域具有不可替代的价值。\n\n【核心功能】\n1. GPT-4o多模态：支持文本/图像/音频实时对话，理解图片中的物体/文字/图表\n2. 高级数据分析（原代码解释器）：上传CSV/Excel，AI自动写Python代码分析并生成图表\n3. DALL-E图像生成：在对话中直接生成和编辑图片\n4. 自定义GPTs：500万+社区创建的专属GPT，覆盖法律/金融/教育等专业领域\n5. ChatGPT Store：GPTs应用市场，搜索即用专业知识助手\n6. o1/o3推理模型：在数学/物理/编程等复杂推理任务上大幅领先所有竞品\n\n【应用场景】\n1. 数据分析师：上传销售数据Excel，ChatGPT自动清洗→分析→可视化→生成报告\n2. 程序员：用o1模型处理算法题和系统设计，GPT-4o辅助日常编码\n3. 设计师：用DALL-E生成设计灵感图，再用GPT-4o讨论修改方案\n4. 学生：上传PDF教材让ChatGPT总结重点，用自定义GPTs做模拟考试\n5. 创业者：用ChatGPT写商业计划书、做市场调研、生成产品文案\n6. 研究者：用高级数据分析处理实验数据，用联网搜索查找最新论文\n\n【收费情况】\n免费版：GPT-4o mini有限使用。Plus $20/月：GPT-4o无限使用+DALL-E+高级分析+自定义GPTs。Pro $200/月：o1/o3推理模型无限使用。API另计费。\n\n【使用形态】\n在线使用。所有功能在云端运行。提供macOS/Windows桌面客户端。\n\n【使用说明】\n1. 访问 chat.openai.com 注册OpenAI账号（需海外网络和手机号验证）\n2. 登录后在底部输入框输入问题\n3. 上传文件：点击输入框左侧+号上传图片/文档/音频\n4. DALL-E：在对话中输入「生成一张...」的图片描述\n5. 高级数据分析：上传CSV/Excel后@Data Analyst自动分析\n6. Plus升级：点击Upgrade to Plus→$20/月→绑定信用卡\n7. 自定义GPTs：左侧Explore GPTs进入商店搜索使用\n8. 数据导出：Settings→Data Controls→Export Data下载全部对话历史\n\n【优势】\n1. 模型能力在几乎所有基准测试中领先\n2. 功能生态最丰富\n3. 高级数据分析实用\n4. 全球社区最大\n5. 持续创新能力领先\n\n【劣势】\n1. 中国区不可用（需海外网络）\n2. 价格较高Plus约￥145/月\n3. 推理模型响应慢（30秒+）\n4. 中文表达不如国产模型\n5. 数据在海外处理有隐私风险\n\n【支持平台】\nWeb端、macOS桌面客户端、Windows桌面客户端、iOS App、Android App、API", "s": "ChatGPT由OpenAI开发，2022年11月上线后2个月达到1亿用户，成为全球增长最快的应用产品。"},{"n": "Kimi Chat", "c": "通用AI大模型", "p": "月之暗面", "u": "https://kimi.moonshot.cn", "t": "对话", "r": "免费+付费", "d": "【产品名片】Kimi Chat | 通用AI大模型 | 月之暗面 | https://kimi.moonshot.cn | 收费：免费+付费\n\n【详细介绍】\nKimi Chat是月之暗面（Moonshot AI）开发的大语言模型，由前清华大学交叉信息研究院助理教授杨植麟创立，公司估值超30亿美元。200万token的超长上下文窗口是目前所有主流对话产品中最高的，在Needle In A Haystack（大海捞针）长文本评测中200万字上下保持接近100%准确率。产品围绕深度阅读场景设计，法律行业的合同审查、学术界的论文阅读、编程领域的代码库分析是其典型应用场景。2023年10月首次发布时以20万字上下文引起关注，2024年升级到200万字。免费版即可使用全部功能。没有图像生成能力，功能聚焦使其在文档处理领域表现突出。Kimi在合同审查和学术论文阅读场景中具有独特优势，200万字上下文意味着用户可以将数十份合同或一整套教材一次性丢给AI分析。免费版即可使用全部功能，对于需要频繁处理长文档的用户来说是性价比很高的选择。\n\n【核心功能】\n1. 200万字超长上下文：可一次性上传完整长篇书籍/代码库/大量合同\n2. 深度文档分析：对PDF/Word/Excel/PPT/图片文字进行结构化提取和分析\n3. 链接阅读：直接输入网页URL，AI自动获取并分析网页内容\n4. 多文件对比：同时上传多个文档AI跨文档对比分析差异\n5. 联网搜索：手动开启获取实时信息\n6. Kimi k2模型：最新MoE架构模型推理能力进一步提升\n\n【应用场景】\n1. 法律合同审查：上传数十份合同，AI一次性阅读并标注关键条款差异\n2. 学术论文研究：上传一篇几十页的论文PDF，AI做全文理解和方法论分析\n3. 程序员代码库分析：把整个项目的代码目录拖进去AI理解整体架构\n4. 书籍阅读：上传一本300页的书AI自动生成章节摘要和核心论点\n5. 竞品分析：收集多个竞品产品文档和用户评价URL让AI综合对比\n6. 求职面试准备：上传JD（职位描述）和个人简历AI模拟面试并给出建议\n\n【收费情况】\n免费版：基础对话+200万字上下文+文件上传+链接阅读+联网搜索全部免费。会员￥99/月：Kimi k2模型优先使用+更快处理速度。API按量计费。\n\n【使用形态】\n在线使用。所有处理在云端完成，需网络连接。\n\n【使用说明】\n1. 访问 kimi.moonshot.cn 点击开始使用（手机号/微信/Apple ID注册）\n2. 登录后在输入框直接提问\n3. 上传文档：点击输入框左侧+号选择文件或拖拽文件到对话框\n4. 阅读网页：直接粘贴网址到输入框发送，AI自动获取并分析\n5. 多文件对比：可一次上传多个文档，AI跨文件对比分析\n6. 联网搜索：点击输入框上方的小地球图标开启\n7. 会员升级：左上角头像→会员中心→￥99/月→支付\n8. API使用：访问 platform.moonshot.cn 注册开发者→获取API Key\n\n【优势】\n1. 200万token超长上下文行业领先\n2. 文档分析专业效果好\n3. 链接阅读方便快捷\n4. 多文件对比实用\n5. 产品聚焦深度阅读精准\n\n【劣势】\n1. 没有图像/视频生成能力\n2. 创意写作不如ChatGPT\n3. 联网搜索不如Perplexity\n4. C端品牌认知度不如豆包\n5. 英文长文档处理偶有问题\n\n【支持平台】\nWeb端、iOS App、Android App、API接口", "s": "Kimi Chat是月之暗面（Moonshot AI）开发的大语言模型，由前清华大学交叉信息研究院助理教授杨植麟创立，公司估值超30亿美元。"},{"n": "WPS AI", "c": "AI办公/文档", "p": "金山办公", "u": "https://www.wps.cn/ai", "t": "桌面", "r": "免费+付费", "d": "【产品名片】WPS AI | AI办公/文档 | 金山办公 | https://www.wps.cn/ai | 收费：免费+付费\n\n【详细介绍】\nWPS AI是金山办公在其WPS Office套件中集成的AI功能模块。金山办公是中国最大的办公软件公司，WPS Office在中国有超过5亿用户，覆盖政府机关/企业/学校和普通个人用户。WPS AI于2023年底开始内测，2024年正式全面开放。AI能力深度嵌入文档/表格/PPT/PDF全组件，用户无需切换产品。PPT生成功能是国内最成熟之一：输入主题或上传大纲即可生成含完整内容/配图/配色/动画的PPT，支持在WPS中直接编辑修改。AI校对功能支持公文格式校验和敏感词检测，受到机关用户欢迎。￥99/年的会费比Office 365 Copilot（￥200+/月）便宜很多，WPS AI的PDF对话功能让用户可以直接与PDF文档对话提问，在学术研究和合同审查场景中非常实用。对于机关事业单位用户，AI校对功能支持公文格式校验，符合国内办公规范。￥99/年的价格使其在同类产品中具有显著的性价比优势。\n\n【核心功能】\n1. AI写作：在WPS文档中直接呼出AI，支持写文章/润色/续写/改写/翻译/缩写\n2. AI生成PPT：输入主题或大纲，AI自动生成完整PPT含配图/配色/排版/动画\n3. AI PDF对话：像ChatPDF一样与PDF文档对话，支持数百页文档阅读\n4. AI表格分析：在Excel中用自然语言描述数据需求AI自动执行\n5. AI阅读总结：上传文档一键生成摘要\n6. AI校对：自动检测错别字/语病/标点错误，支持公文格式校验\n\n【应用场景】\n1. 周报撰写：在WPS文档中呼出AI说我帮写周报AI自动生成\n2. 方案PPT：输入做一个新员工培训PPT，AI一键生成完整演示\n3. PDF文献阅读：上传学术论文PDF用AI对话式提问方法论和结论\n4. Excel数据分析：打开销售表格说统计各区域销售额AI自动执行\n5. 公文写作：机关事业单位写通知/报告符合公文格式规范\n6. 毕业论文：用WPS AI辅助文献综述撰写和论文润色\n\n【收费情况】\n免费版：AI写作20次/日、AI PPT 3次/日、AI PDF对话免费。WPS大会员￥99/年：所有AI功能不限次数。超级会员￥159/年。企业版按人数定价。\n\n【使用形态】\n在线+离线混合。AI功能需联网云端处理。本地编辑离线可用。\n\n【使用说明】\n1. 确保WPS已更新到最新版\n2. 登录WPS账号（微信/手机号/QQ）\n3. 呼出AI面板：在文档中点击工具栏WPS AI图标或按Ctrl+J\n4. AI写作：在AI面板输入需求，或选中文字后右键选择AI功能\n5. AI生成PPT：在WPS演示中点击AI生成PPT→输入主题→一键生成\n6. AI对话PDF：打开PDF文件→点击右下角AI图标→提问文档内容\n7. AI分析表格：在Excel中描述数据需求→AI自动执行\n8. 升级会员：头像→会员中心→WPS大会员￥99/年→支付\n\n【优势】\n1. 5亿+用户零门槛使用\n2. 文档/表格/PPT/PDF全组件AI覆盖\n3. PPT生成质量国内领先\n4. 针对中文办公场景深度优化\n5. ￥99/年性价比极高\n\n【劣势】\n1. AI功能依赖在线网络\n2. 深度分析不如专业工具\n3. PDF解析不如ChatPDF\n4. 免费版每日次数有限\n5. 仅在WPS Office内使用\n\n【支持平台】\nWindows桌面端、macOS桌面端、Web端(金山文档)、iOS App、Android App", "s": "WPS AI是金山办公在其WPS Office套件中集成的AI功能模块。"},{"n": "Midjourney", "c": "AI设计/图像", "p": "Midjourney", "u": "https://www.midjourney.com", "t": "SaaS/Web", "r": "付费", "d": "【产品名片】Midjourney | AI设计/图像 | Midjourney | https://www.midjourney.com | 收费：付费\n\n【详细介绍】\nMidjourney是美国Midjourney Inc.开发的AI图像生成工具，由前Leap Motion创始人David Holz创立。以出色的艺术品质在AI生图领域确立标杆地位，其光影处理/色彩搭配/构图比例在AI生图工具中公认第一。v6版本在真实感方面有质的提升，照片级渲染效果更加逼真。最初以Discord bot运行，2024年推出Web界面(midjourney.com/create)，大幅降低使用门槛。Discord社区超2000万用户，每天生成数亿张图片。无免费版$10/月起。文字渲染仍然不理想（画面中的文字通常是乱码），人物手势/手指等细节处理仍有缺陷。v6版本新增了Vary Region局部修改和图生视频功能，使产品功能更加完整。Midjourney在专业设计领域的使用率很高，很多游戏公司、广告公司和建筑设计事务所将其纳入工作流程。v6版本的局部修改功能解决了之前版本无法精准控制画面的痛点。建议新手从模仿社区优秀prompt开始，逐步掌握参数调优技巧。\n\n【核心功能】\n1. 文生图：输入文字描述(prompt)AI生成高质量数字图像\n2. 图生图：上传参考图+文字描述AI基于参考图风格生成新图\n3. 垫图控制：上传产品照片+场景描述AI将产品放入指定场景\n4. 风格迁移：指定艺术家风格/设计风格/摄影风格AI应用\n5. Vary Region：选择画面局部重新生成（v6版本）\n6. 图生视频：v6版本新增静态图转短动画\n\n【应用场景】\n1. 概念设计：游戏角色/场景/道具概念图快速产出多种风格方案\n2. 电商素材：产品场景图制作，上传产品照片+描述场景\n3. 建筑设计：建筑效果图/室内设计概念图/景观方案可视化\n4. 广告创意：广告海报/社交媒体配图/品牌视觉素材\n5. 影视前期：分镜脚本/场景概念图/角色造型设计\n6. 个人创作：头像/壁纸/插画/艺术作品AI生成\n\n【收费情况】\n仅付费无免费版。基础$10/月(约200张)。标准$30/月(不限量+15h快速GPU)。Pro $60/月(30h快速GPU+隐身模式)。Mega $120/月(60h)。年付8折。企业版定制。\n\n【使用形态】\n在线使用。通过Discord或Web界面操作，所有计算在云端GPU集群完成。\n\n【使用说明】\n1. 注册Discord账号\n2. 访问midjourney.com点击Join the Beta加入Discord\n3. 官网 midjourney.com/account 选择方案绑定信用卡支付\n4. 在Discord #newbies频道输入/imagine prompt: 描述词\n5. 约60秒后U1-U4按钮放大某张，V1-V4生成变体\n6. 推荐使用Web界面 midjourney.com/create 操作更直观\n7. 常用参数：--ar 16:9(宽高比) --v 6(版本) --style raw --s 250\n\n【优势】\n1. 图像质量同业公认最高\n2. 艺术感和审美价值极高\n3. 风格多样性丰富\n4. 2000万+用户社区资源丰富\n5. v6版本真实感大幅提升\n\n【劣势】\n1. $10/月起无免费版入门门槛高\n2. 需要学习prompt编写技巧\n3. 画面文字渲染为乱码\n4. 人物手指等肢体偶有畸形\n5. 控制精度不如Stable Diffusion\n\n【支持平台】\nWeb端(midjourney.com/create)、Discord服务器、企业API", "s": "Midjourney是美国Midjourney Inc.开发的AI图像生成工具，由前Leap Motion创始人David Holz创立。"},{"n": "剪映AI", "c": "AI视频生成", "p": "字节跳动", "u": "https://www.capcut.cn", "t": "App", "r": "免费", "d": "【产品名片】剪映AI | AI视频生成 | 字节跳动 | https://www.capcut.cn | 收费：免费\n\n【详细介绍】\n剪映（CapCut）是字节跳动开发的视频剪辑工具，2019年上线，是中国用户量最大的视频剪辑App。与抖音生态深度整合，大量短视频通过剪映制作。图文成片功能是当前国内最成熟的AI视频生成工具之一：用户只需输入文字或文章链接，AI就能在1-2分钟内自动匹配视频素材/配音/字幕，生成一条完整短视频。AI智能抠像效果领先，能精确分割头发丝等复杂细节。AI配音支持数十种声音含方言和外语，自动字幕对中英文混合视频支持国内最好。AI剪辑功能可自动从冗长素材中识别精彩片段生成短视频。剪映的图文成片功能特别适合内容创作者和自媒体运营者，将公众号文章快速转为抖音视频的过程只需1-2分钟。AI智能抠像效果在手机端处于领先水平，能够精确分割发丝等复杂细节。一键成片功能可以自动从长视频中提取精彩片段。\n\n【核心功能】\n1. 图文成片：输入文章链接或文字内容，AI自动匹配素材/配音/字幕生成视频\n2. AI智能抠像：一键去除/更换视频背景，支持多人同时抠像\n3. AI配音：数十种AI声音可选（含方言和外语），支持情感调节和语速控制\n4. 自动字幕：识别视频语音自动生成字幕，支持中英文和混合语言\n5. AI脚本生成：输入主题AI自动生成视频脚本和分镜\n6. AI剪辑：智能识别视频精彩片段自动剪辑成短视频\n\n【应用场景】\n1. 短视频创作者：用图文成片将公众号文章转抖音视频\n2. 教育工作者：录制课程后用AI自动生成字幕和章节标记\n3. 电商带货：商品展示视频快速制作AI抠像换背景\n4. Vlog博主：AI自动从冗长素材中提取精华片段\n5. 企业宣传：产品介绍/活动回顾快速制作\n6. 会议记录：录制视频AI自动生成字幕和文字纪要\n\n【收费情况】\n完全免费。图文成片/智能抠像/AI配音/自动字幕全部免费。部分高级特效和滤镜需要会员（￥15/月起）。\n\n【使用形态】\n在线+本地混合使用。AI配音/图文成片等功能需要联网。视频剪辑/抠像/字幕等本地处理。\n\n【使用说明】\n1. 下载安装：App Store/应用市场搜索剪映下载，或访问 capcut.cn 下载桌面版\n2. 注册登录：打开App→手机号/微信/抖音登录\n3. 图文成片：首页→图文成片→粘贴文章链接或文字→选配音→点生成视频\n4. AI抠像：导入视频→选中轨道→智能抠像→AI自动处理\n5. 自动字幕：导入视频→文本→识别字幕→选语言→AI自动生成\n6. AI剪辑：导入素材→一键成片→AI识别精彩片段并剪辑\n7. 导出：右上角导出→分辨率1080P或4K→帧率30fps\n\n【优势】\n1. 完全免费无付费门槛\n2. 图文成片1分钟文字转视频\n3. 与抖音生态打通一键分享\n4. AI抠像效果领先\n5. 界面新手友好易上手\n\n【劣势】\n1. 专业功能不如Premiere Pro\n2. AI素材匹配有时不准确\n3. 部分功能依赖网络\n4. PC版AI功能更新慢\n5. 海外版CapCut有水印\n\n【支持平台】\niOS App、Android App、Windows桌面端、macOS桌面端、CapCut Web版", "s": "剪映（CapCut）是字节跳动开发的视频剪辑工具，2019年上线，是中国用户量最大的视频剪辑App。"},{"n": "Suno", "c": "AI语音/音频", "p": "Suno", "u": "https://suno.com", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Suno | AI音乐/音频 | Suno | https://suno.com | 收费：免费+付费\n\n【详细介绍】\nSuno是美国Suno Inc.开发的AI音乐生成工具。v1于2023年发布最初只能生成简短音乐片段。v4（2025年）音质接近CD水平，人声自然度和编曲复杂度大幅提升。核心技术是Transformer架构的音乐生成模型，同时建模人声/乐器/节奏和旋律。生成歌曲包含完整的前奏/主歌/副歌/桥段/尾奏。Pro版（$10/月）可获得商用版权在YouTube/Spotify等平台发布获利。支持20+音乐风格和数十种乐器组合。用户可以通过简单的文字描述（如古风+电子+女声）快速生成多种风格的歌曲demo。免费版每天5-10次生成。Suno的v4版本在音质上取得了显著进步，生成的人声已接近真实歌手水平。对于需要快速制作音乐demo的个人创作者和小团队来说，Suno是一个高效的工具。建议使用英文歌词可获得更好的生成效果，中文歌词的发音韵律持续改善中。Pro版的商用版权对于想在音乐平台发布AI歌曲的用户来说是必备的。\n\n【核心功能】\n1. 文生音乐：输入歌词+风格描述AI生成带人声和伴奏的完整歌曲\n2. 纯器乐生成：指定风格生成纯音乐/背景音乐无人声\n3. 歌词自动生成：只输入主题描述AI自动写歌词并谱曲\n4. 歌曲扩展：将已有片段延伸为完整歌曲（主歌+副歌+桥段）\n5. 风格混合：指定多种风格融合如电子+古风\n6. v4音质升级：人声接近真实歌手水平，编曲复杂度大幅提升\n\n【应用场景】\n1. 播客制作：为播客生成专属片头片尾曲\n2. 短视频配乐：生成原创背景音乐（Pro版可商用）\n3. 游戏配乐：独立游戏场景配乐（战斗/探索/对话）\n4. 个人创作：输入自己的歌词AI生成demo\n5. 广告配乐：为宣传片快速生成匹配配乐\n6. 教学演示：音乐老师展示不同风格和编曲差异\n\n【收费情况】\n免费版：每天50学分（每次消耗5-10学分约5-10次/天）。Pro $10/月：500学分+商用版权可在音乐平台获利。Premier $30/月：2000学分+优先队列。年付优惠。\n\n【使用形态】\n在线使用。所有歌曲生成在Suno云端服务器完成，30-60秒出歌。\n\n【使用说明】\n1. 访问 suno.com 注册（Google/微软/邮箱）\n2. 免费版每天50学分\n3. 在歌词框输入歌词（留空则AI自动写词）\n4. 在Style框描述风格（如 pop, electric guitar, sad）\n5. 点击Create等待30-60秒生成两首不同版本\n6. 不满意可点击Retry重新生成（同样消耗学分）\n7. 下载：点击歌曲→Download MP3/WAV\n8. 升级Pro：Settings→Subscription→$10/月→获得商用版权\n\n【优势】\n1. AI音乐生成质量最高\n2. 生成完整歌曲结构\n3. Pro版商用版权明确\n4. 创作门槛低\n5. 生成速度快30-60秒\n\n【劣势】\n1. AI味仍可辨识\n2. 免费版限制大(5-10次/天)\n3. 风格控制有限\n4. 中文发音不自然\n5. AI音乐版权法律地位不明确\n\n【支持平台】\nWeb端(suno.com)、Discord Bot", "s": "Suno是美国Suno Inc.开发的AI音乐生成工具。"},{"n": "Perplexity", "c": "AI搜索", "p": "Perplexity", "u": "https://www.perplexity.ai", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Perplexity | AI搜索 | Perplexity | https://www.perplexity.ai | 收费：免费+付费\n\n【详细介绍】\nPerplexity由Aravind Srinivas等人于2022年创立，创始团队来自Google AI/OpenAI/Meta AI。首次将大语言模型的对话能力与传统搜索引擎的信息检索能力结合，被称为AI搜索引擎的开创者。工作流程：用户输入问题→AI理解意图→后台同时搜索多个信源→AI读取搜索结果综合生成回答→每个引用点标注来源。这种方式既利用AI的文本生成和理解能力，又通过引用来源解决AI幻觉问题。Copilot模式会先回问确认需求再给出精准答案。Collections将搜索结果按主题整理形成个人知识库。免费版每天5次Pro搜索，Pro $20/月解锁无限使用+GPT-4o等高级模型。Perplexity的学术搜索功能对研究人员特别有用，可直接查找论文并附原始链接。Copilot模式通过主动回问使搜索更精准，适合复杂问题的深度研究。Collections功能帮助用户将研究过程系统化整理。对于需要频繁进行深度信息检索的用户，Pro版的多模型选择和无限Pro搜索是值得的投资。\n\n【核心功能】\n1. AI搜索引擎：输入问题AI搜索多个信源综合生成答案，每个答案附引用来源\n2. Copilot模式：主动追问澄清需求再给出更精准回答\n3. 文件上传搜索：上传PDF/文档AI在文件和互联网中综合搜索\n4. Collections(合集)：搜索记录智能归类为知识主题\n5. 多模型切换：Pro版可选GPT-4o/Claude 3.5等\n6. Spaces(空间)：创建专属知识空间上传资料作为私有知识库\n\n【应用场景】\n1. 深度研究：输入研究主题搜索多信源给出综合分析报告\n2. 实时查询：查询最新新闻/股价/天气/赛事结果\n3. 学术检索：查找论文和学术资料附原始论文链接\n4. 技术调研：查阅技术文档和API说明对比方案优劣\n5. 购物决策：从多个评测网站汇总产品评价\n6. 事实核查：从权威信源查证信息真伪\n\n【收费情况】\n免费版：无限搜索+每天5次Pro搜索（使用GPT-4o/Claude等高级模型）。Pro $20/月：无限Pro搜索+多模型+文件上传+优先队列。企业版定制。\n\n【使用形态】\n在线使用。所有搜索和AI处理在云端完成，需网络连接。\n\n【使用说明】\n1. 访问 perplexity.ai 注册（Google/苹果/邮箱）\n2. 在搜索框输入问题（如2025年AI芯片市场格局）\n3. AI自动搜索并生成带引用来源的综合回答\n4. 点击回答中的引用编号可查看来源网页核实\n5. 输入Follow-up问题继续追问深入搜索\n6. 开启Copilot：搜索框上方切换开关AI先追问再回答\n7. 创建合集：左侧Collections→New Collection→命名→内容自动归类\n8. 安装浏览器插件：Chrome扩展搜索Perplexity安装\n\n【优势】\n1. 答案可溯源每个回答都标注来源\n2. AI搜索体验信息综合强无广告\n3. Copilot模式让搜索更精准\n4. 实时信息获取过期问题少\n5. Pro版可用多种模型\n\n【劣势】\n1. 免费版每天仅5次Pro搜索\n2. 中文搜索质量不如百度\n3. 垂直领域深度不如专业工具\n4. Pro $20/月对高频用户不便宜\n5. 在中国需海外网络\n\n【支持平台】\nWeb端、iOS App、Android App、Chrome浏览器插件、Edge浏览器插件", "s": "Perplexity由Aravind Srinivas等人于2022年创立，创始团队来自Google AI/OpenAI/Meta AI。"},{"n": "Dify", "c": "AI Agent/智能体", "p": "Dify", "u": "https://dify.ai", "t": "SaaS/Web", "r": "开源免费", "d": "【产品名片】Dify | AI Agent/智能体 | Dify | https://dify.ai | 收费：开源免费\n\n【详细介绍】\nDify是开源AI应用开发平台，由中国创业公司Dify AI（2022年成立）开发，GitHub超6万star，是全球最受欢迎的开源AI平台之一。技术架构围绕RAG和Agent两个核心方向设计。RAG管道让开发者将企业文档上传为知识库，AI在回答时自动检索相关内容作为上下文。Agent模式让AI可以自主规划任务、调用工具和执行多步操作。支持OpenAI/Claude/通义千问/Ollama等30+模型提供商。开源可自部署的优势让企业数据完全在内网中满足数据安全合规。学习曲线较陡，但可视化拖拽界面降低了搭建AI应用的门槛。Dify的RAG管道对于需要搭建企业知识库的场景特别适用，上传文档后AI自动完成分段、向量化和语义检索的配置。Agent模式可以构建自主完成多步任务的AI助手。建议企业用户从社区版开始试用，确认能满足需求后再考虑云服务付费方案。GitHub社区的6万+star意味着有大量的插件和模板可参考。\n\n【核心功能】\n1. 可视化工作流：拖拽搭建AI工作流零代码构建复杂AI逻辑\n2. RAG管道：文档导入→自动分段→向量化→检索→生成全流程可视化\n3. 多模型接入：支持OpenAI/Claude/通义千问/Ollama等30+提供商\n4. 知识库管理：上传PDF/网页/API文档作为知识源AI检索匹配\n5. Agent模式：AI智能体自主规划任务调用工具执行\n6. API发布：构建好的AI应用一键发布为API供其他系统调用\n\n【应用场景】\n1. 企业知识库：上传规章制度/产品文档搭建内部AI知识库\n2. 智能客服：接入企业知识库和工单系统构建自动客服\n3. 文档处理流程：搭建AI自动处理合同/发票/报告等工作流\n4. 数据分析Agent：配置AI连接数据库自然语言查询\n5. 内容生产流水线：AI自动抓取素材→整理→生成→发布\n6. 学习助手：上传资料构建AI一对一辅导应用\n\n【收费情况】\n社区版(开源免费)：完全免费可自部署GitHub 6万+star。云服务Team $59/月：更多工作流额度+团队协作+SSO。企业版按需报价私有部署。\n\n【使用形态】\n在线(云服务)或离线(自部署)。推荐生产环境使用Docker部署。\n\n【使用说明】\n1. 云服务：访问 dify.ai 注册→Create Application选择Chatbot\n2. 自部署：git clone Dify代码→docker-compose up -d启动→访问localhost\n3. 添加模型：Settings→Model Provider→输入API Key（30+提供商）\n4. 创建知识库：Knowledge→Create Knowledge→上传文档→自动向量化\n5. 搭建工作流：Studio→拖拽LLM/知识检索/代码等节点→连线→预览测试\n6. 发布：Publish→选择API/嵌入网页脚本/分享链接\n7. 团队协作：Team $59/月→SSO多用户协作\n\n【优势】\n1. 开源可自部署数据不出内网\n2. 30+模型提供商灵活切换\n3. 可视化零代码搭建\n4. RAG管道完善\n5. 社区6万+star资源丰富\n\n【劣势】\n1. 学习曲线陡峭\n2. 云服务免费版额度有限\n3. 版本迭代快API和配置经常变\n4. 部分功能中文文档不完整\n5. 高并发场景需自行优化架构\n\n【支持平台】\nWeb端(云服务/自部署)、Docker部署、Kubernetes部署", "s": "Dify是开源AI应用开发平台，由中国创业公司Dify AI（2022年成立）开发，GitHub超6万star，是全球最受欢迎的开源AI平台之一。"},{"n": "帆软FineBI", "c": "AI数据分析/BI", "p": "帆软", "u": "https://www.fanruan.com", "t": "SaaS/Web", "r": "付费", "d": "【产品名片】帆软FineBI | AI数据分析/BI | 帆软 | https://www.fanruan.com | 收费：付费\n\n【详细介绍】\n帆软FineBI是帆软软件有限公司（FineReport母公司）开发的企业级BI分析平台。帆软成立于2006年总部南京，是中国最大的BI软件公司，在Gartner中国BI魔力象限中位列领导者象限。核心理念自助式BI让业务人员不需要会写SQL或Python就能做数据分析，通过拖拽字段选择图表类型的可视化操作完成。2024年新增AI自然语言分析功能进一步降低使用门槛，用户可以直接用中文描述分析需求。支持亿级数据量分析性能，提供行列级数据权限管理和审计追溯。政府/银行保险/制造业是主要客户群。10万元起的价格对中小企业预算压力较大。支持信创环境部署，FineBI在政企市场的占有率领先，其行列级权限控制和审计追溯功能满足严格的数据安全要求。2024年新增的AI自然语言分析功能降低了业务人员的分析门槛。对于已在使用FineReport的企业，FineBI可以无缝对接。建议先联系帆软获取试用版进行POC验证。\n\n【核心功能】\n1. AI自然语言分析：用中文描述分析需求AI自动生成图表\n2. 数据可视化：支持柱状图/折线图/饼图/散点图/热力图/地图等50+图表\n3. 自助数据集：业务人员拖拽选择字段建立分析数据集无需IT支持\n4. 驾驶舱大屏：创建实时更新的管理驾驶舱和数据大屏\n5. 报表设计器：类Excel报表设计界面支持复杂报表布局\n6. 数据填报：支持在线数据录入和审批流程前端展示后端填报一体化\n\n【应用场景】\n1. 企业BI看板：为管理层搭建销售/财务/运营实时数据看板\n2. 财务报表：自动化生成月度/季度财务报表支持审计追溯\n3. 销售分析：按区域/产品线/客户维度数据分析和趋势预测\n4. 人力资源分析：员工入离职/薪酬/绩效HR数据分析展示\n5. 供应链分析：采购/库存/物流数据分析和预警\n6. 政府/学校：复杂报表格式定制和数据填报审批\n\n【收费情况】\n无免费版。企业版通常10万元起。FineDirect面向中小企业按年收费。含技术支持/升级维护/培训服务。具体联系帆软销售。\n\n【使用形态】\n企业内部部署。数据分析在服务端处理浏览器访问。\n\n【使用说明】\n1. 联系帆软销售（官网→联系我们）→需求沟通→申请试用或采购\n2. 帆软工程师完成部署\n3. 管理员配置数据源连接（MySQL/Oracle/SQL Server/Excel）\n4. 管理员创建用户分配权限和角色\n5. 业务用户登录→点击数据分析→选择数据表→拖拽字段→选图表\n6. AI分析：点击AI助手→输入按区域显示上季度销售额→AI自动生成\n7. 发布看板：保存仪表板→选择可见范围→发布→支持定时刷新\n8. 移动端：iOS/Android App、企业微信/钉钉集成查看\n\n【优势】\n1. 企业级大数据量处理\n2. 行列权限控制和审计追溯\n3. 符合中国财务报表格式\n4. 信创适配国产CPU/OS/DB\n5. 国内技术支持响应及时\n\n【劣势】\n1. 价格高10万元起\n2. 学习曲线较陡\n3. 可视化美观度不如Tableau\n4. 云化程度低以私有部署为主\n5. AI分析功能刚推出有待验证\n\n【支持平台】\nWeb端(Chrome/Edge等)、iOS App、Android App、企业微信/钉钉集成", "s": "帆软FineBI是帆软软件有限公司（FineReport母公司）开发的企业级BI分析平台。"},{"n": "GitHub Copilot", "c": "AI编程/代码", "p": "GitHub(微软)", "u": "https://github.com/features/copilot", "t": "桌面/IDE插件", "r": "付费", "d": "【产品名片】GitHub Copilot | AI编程/代码 | GitHub(微软) | https://github.com/features/copilot | 收费：付费\n\n【详细介绍】\nGitHub Copilot是GitHub与OpenAI联合开发的AI编程助手，基于OpenAI Codex模型（后续升级为GPT-4o和Claude 3.5），2021年首次推出技术预览版，2022年6月正式上线。Copilot能够在VS Code、JetBrains、Visual Studio、Neovim等主流IDE中实时提供代码补全建议。截至2024年，Copilot已被超过180万开发者使用，生成代码量超过30亿行，支持Python、JavaScript、TypeScript、Java、Go、Ruby、C++、Rust等数十种编程语言。Copilot通过理解代码上下文和注释，不仅提供单行补全，还能生成整个函数体和复杂算法。2024年GitHub推出Copilot Chat（基于GPT-4和Claude 3.5）允许开发者以自然语言与AI讨论代码。Copilot Enterprise版本还支持针对企业代码库的定制化建议以及Pull Request的AI摘要生成。微软将Copilot深度整合到Azure DevOps和GitHub Actions中，打造端到端的AI驱动开发体验。\n\n【核心功能】\n1. 代码自动补全：根据当前文件和上下文实时预测并生成代码片段，支持Tab键一键接受\n2. 函数级生成：从注释或函数签名生成完整的函数体，支持复杂算法和数据结构的自动实现\n3. 内联对话（Copilot Chat）：在IDE内以对话形式提问获取代码解释、重构建议和Bug修复方案\n4. 多语言支持：覆盖Python/JavaScript/TypeScript/Java/Go/Ruby/C++/Rust/Swift/Kotlin等主流语言\n5. 测试代码生成：自动为目标函数生成单元测试用例，支持Pytest/Jest/JUnit等主流框架\n6. PR摘要生成：Enterprise版可自动为Pull Request生成变更摘要和关键修改点说明\n\n【应用场景】\n1. 日常编码提速：开发者编写API接口时Copilot根据路由定义自动生成Controller和Service层代码\n2. 复杂算法实现：描述排序算法需求后Copilot生成完整的归并排序或动态规划实现\n3. 代码迁移重构：将JavaScript代码迁移到TypeScript时逐行给出类型标注建议\n4. 单元测试编写：选中目标函数后通过Copilot Chat生成覆盖边界条件的测试用例\n5. Legacy代码解读：打开老旧项目文件让Copilot解释函数逻辑和内联文档\n6. 技术方案探索：用Copilot Chat讨论架构设计选项并生成原型代码\n\n【收费情况】\n个人版$10/月（约￥72/月），Business版$19/月（约￥137/月），Enterprise版$39/月（约￥280/月）。学生和开源维护者免费。支持14天免费试用。\n\n【使用形态】\n桌面IDE插件：安装在VS Code/JetBrains/Visual Studio/Neovim等IDE中使用，需联网。\n\n【使用说明】\n1. 在VS Code扩展市场搜索GitHub Copilot并安装\n2. 点击底部状态栏Copilot图标登录GitHub账号\n3. 选择免费试用或订阅付费方案\n4. 在编辑器中编写代码时Copilot自动给出灰色建议\n5. 按Tab键接受建议按Esc键忽略\n6. 按Ctrl+Enter（Windows）查看更多备选建议\n7. 安装GitHub Copilot Chat扩展后按Ctrl+Shift+I打开对话面板\n\n【优势】\n1. 深度集成VS Code/JetBrains等主流IDE开箱即用\n2. 基于GPT-4和Claude 3.5双模型代码理解能力强\n3. 支持数十种编程语言和框架\n4. 内联对话可在不离开编辑器的前提下代码审查和调试\n5. 学生和开源维护者免费使用\n6. 企业版可针对私有代码库定制化训练\n\n【劣势】\n1. 需要持续联网离线不可用\n2. 月费较高（Business版$19/月）\n3. 对中国开发者来说部分功能需科学上网\n4. 生成代码可能存在安全漏洞或使用过时API\n5. 对冷门语言和框架支持不如主流语言好\n6. 大型项目中建议质量有时不够准确\n\n【支持平台】\nVS Code、JetBrains IDEs（IntelliJ/PyCharm/WebStorm等）、Visual Studio、Neovim、GitHub Codespaces、Azure DevOps", "s": "GitHub Copilot是GitHub与OpenAI联合开发的AI编程助手，基于GPT-4和Claude 3.5在IDE中提供实时代码补全、函数生成和对话式编程辅助。"},{"n": "Cursor", "c": "AI编程/代码", "p": "Anysphere", "u": "https://cursor.sh", "t": "桌面IDE", "r": "付费", "d": "【产品名片】Cursor | AI编程/代码 | Anysphere | https://cursor.sh | 收费：付费\n\n【详细介绍】\nCursor是由美国创业公司Anysphere开发的AI原生代码编辑器，基于VS Code开源架构深度改造，2023年发布后迅速成为全球最受欢迎的AI编程工具之一。与传统IDE插件方案不同，Cursor从底层将AI能力融入编辑器的每一个交互环节。核心创新在于其AI优先的交互范式：用户可以直接用Cmd+K在任意位置唤起AI重写代码、用Ctrl+Enter对整个代码库进行全局编辑、通过@符号引用特定文件或函数进行精确上下文控制。Cursor底层支持多模型切换，包括GPT-4o、Claude 3.5 Sonnet、Cursor Small（自研模型）等，满足不同场景的性能和成本需求。Cursor的Composer（多文件编辑模式）可以一次性修改整个项目的多个文件，解决跨文件重构的痛点。2024年Cursor新增了代码库索引功能，AI可以理解整个项目的架构和依赖关系。在SWE-Bench编程基准测试中，使用Claude 3.5 Sonnet的Cursor在复杂软件工程任务上表现出色。\n\n【核心功能】\n1. AI原生编辑：在任何代码位置按Cmd+K用自然语言描述修改意图，AI直接重写选中代码\n2. 内联聊天（Ctrl+L）：在侧边栏或内联面板与AI讨论当前文件或选中代码\n3. 多文件编辑（Composer）：一次需求同时修改多个文件适用于跨文件重构\n4. 代码库索引：AI自动索引整个项目结构全局搜索时能理解代码间的调用关系\n5. 多模型切换：支持GPT-4o、Claude 3.5 Sonnet、Cursor Small等不同模型\n6. Bug诊断与修复：选中错误代码后AI直接分析根因并提供可应用的修复方案\n\n【应用场景】\n1. 全栈Web开发：用自然语言描述一个CRUD接口后Cursor自动生成前端组件和后端路由\n2. 大规模代码重构：指令将整个项目从JavaScript迁移到TypeScript后Composer批量处理所有文件\n3. Debug排查错误：选中报错堆栈让AI分析包依赖冲突或类型错误根因\n4. 新项目初始化：描述项目目标后Cursor生成项目骨架、目录结构和核心配置\n5. 代码审查和优化：选中性能热点代码让AI推荐优化方案和替代实现\n6. API集成开发：描述目标API的功能后生成完整的请求构建和响应解析代码\n\n【收费情况】\n免费版每月2000次补全+50次高级模型请求。Pro版$20/月（约￥144/月）无限补全+500次高级请求。Business版$40/月（约￥288/月）。\n\n【使用形态】\n桌面IDE：需下载并安装Cursor桌面客户端使用，本质是深度定制化的VS Code分支。\n\n【使用说明】\n1. 访问cursor.sh下载对应操作系统的安装包\n2. 安装后导入VS Code扩展和设置（可选）\n3. 按Cmd+I（Mac）或Ctrl+I（Windows）打开AI输入框\n4. 选中代码后按Cmd+K输入修改指令\n5. 按Ctrl+L打开聊天面板进行多轮对话\n6. 使用@file、@func、@sym引用文件或函数作为上下文\n7. 按Ctrl+Shift+I打开Composer进行多文件编辑\n\n【优势】\n1. AI原生架构而非插件方案交互体验更流畅自然\n2. Composer多文件编辑在跨文件重构场景下无可替代\n3. 多模型灵活切换用户可根据任务难度选择最合适的模型\n4. 代码库索引让AI理解项目全局而非单文件\n5. 兼容VS Code扩展生态无缝迁移已有开发环境\n6. 内联编辑模式大幅减少上下文切换\n\n【劣势】\n1. 基于VS Code分支版本更新滞后于原生VS Code\n2. 付费版使用高级模型有次数限制（Pro版500次/月）\n3. 对超大代码库（10万+文件）索引速度较慢\n4. 完全依赖云端AI断网后只能作为普通编辑器使用\n5. 中国地区访问稳定性受网络环境影响\n6. 自研模型(Cursor Small)在复杂推理任务上不如GPT-4o\n\n【支持平台】\nmacOS、Windows、Linux", "s": "Cursor是Anysphere开发的AI原生代码编辑器，从底层将AI融入编辑体验，支持Cmd+K内联编辑、Composer多文件编辑和代码库索引等创新功能。"},{"n": "文心一言", "c": "通用AI大模型", "p": "百度", "u": "https://yiyan.baidu.com", "t": "对话", "r": "免费+付费", "d": "【产品名片】文心一言 | 通用AI大模型 | 百度 | https://yiyan.baidu.com | 收费：免费+付费\n\n【详细介绍】\n文心一言（ERNIE Bot）是百度基于文心大模型（ERNIE系列）开发的生成式AI对话产品，2023年3月16日发布，8月31日正式向公众开放，是国内首批通过生成式人工智能服务管理暂行办法备案的大模型产品之一。底层文心ERNIE 4.0 Turbo在多项中文理解基准测试（CLUE、SuperCLUE）中达到领先水平。百度凭借在搜索和自然语言处理领域二十年的积累，将文心一言深度整合到百度搜索、百度文库、百度网盘、百度地图等全线产品中。文心一言的核心差异化在于其对中文语境和中华文化知识的深度理解，在中国古诗词、成语典故、传统医学等方面的表现优于大部分通用模型。文心一言的插件生态允许开发者创建自定义插件扩展AI能力。2024年百度推出ERNIE Speed和ERNIE Lite等轻量化API版本，大幅降低企业调用成本，输入价格低至0.3元/百万token。文心一言在知识问答和文本创作场景中表现突出，特别在需要深度中文理解的场景下优势明显。\n\n【核心功能】\n1. 多轮对话：支持连续问答和上下文记忆在长对话中保持话题一致性\n2. 知识问答：覆盖科学技术、历史文化、商业金融等广泛领域的中文知识\n3. 文本创作：生成公众号文章、新闻稿、广告文案、工作报告等多种文体\n4. 代码辅助：支持Python/JavaScript/Java/C++/Go等语言的代码生成和调试\n5. 插件生态：支持联网搜索、图片生成（文心一格）、文档处理等官方和第三方插件\n6. API接口：ERNIE 4.0/3.5及轻量版ERNIE Speed/Lite兼容OpenAI调用格式\n\n【应用场景】\n1. 学生论文辅助：上传参考文献让AI提炼核心观点并辅助撰写开题报告\n2. 营销文案生成：输入产品卖点和目标受众后AI生成多版广告文案和社交媒体推文\n3. 百度搜索增强：在搜索结果页直接使用文心一言对搜索结果进行智能汇总\n4. 百度文库整合：基于文库文档内容进行问答、摘要和格式转换\n5. 企业知识问答：基于企业文档构建知识库助手员工用自然语言查询内部信息\n6. 多语言翻译：支持中英日韩法德等主流语言的互译和本地化\n\n【收费情况】\n基础版完全免费（对话+搜索+文档）。会员版￥49.9/月起（约7美元/月）解锁更多高级能力和优先响应。API按量计费：ERNIE 4.0约3元/百万token，ERNIE Speed 0.3元/百万token。\n\n【使用形态】\n在线使用。Web端和移动端App需网络连接。API接口为云端调用。\n\n【使用说明】\n1. 访问 yiyan.baidu.com 用百度账号登录\n2. 手机端下载文心一言App（iOS/Android）\n3. 底部输入框打字提问支持语音输入\n4. 点击输入框左侧加号上传图片/PDF/Word/Excel等文件\n5. 在侧边栏启用插件（联网搜索/图片生成等）\n6. 点击右上角加号开启新对话设置角色和语气\n7. API集成：访问 console.bce.baidu.com/qianfan 获取API Key\n\n【优势】\n1. 中文理解能力在国产模型中位居第一梯队\n2. 深度整合百度搜索、文库、网盘等产品生态\n3. 会员价格仅为ChatGPT Plus的四分之一\n4. 首批通过国内AI备案企业使用合规\n5. 插件生态丰富可定制扩展能力\n6. 轻量版API价格极低（0.3元/百万token）\n\n【劣势】\n1. 创意写作和深度推理能力不如GPT-4o和Claude\n2. 长文本理解上限较低（约32K token）\n3. 部分高级功能需付费\n4. 代码能力显著弱于GitHub Copilot和Cursor\n5. 海外可用性受限\n6. 高峰期偶有响应延迟和排队\n\n【支持平台】\nWeb端(Chrome/Edge/Firefox)、iOS App、Android App、百度搜索集成、百度文库集成、API接口", "s": "文心一言是百度基于文心ERNIE大模型开发的AI对话产品，深度整合百度搜索生态，在中文理解和知识问答方面具有显著优势。"},{"n": "讯飞星火", "c": "AI语音/合成", "p": "科大讯飞", "u": "https://xinghuo.xfyun.cn", "t": "对话/API", "r": "免费+付费", "d": "【产品名片】讯飞星火 | AI语音/合成 | 科大讯飞 | https://xinghuo.xfyun.cn | 收费：免费+付费\n\n【详细介绍】\n讯飞星火是科大讯飞研发的认知智能大模型，2023年5月6日正式发布，目前已迭代至V4.0版本。科大讯飞是中国人工智能领域的龙头企业，在语音识别和语音合成技术上拥有二十余年积累（连续多届国际语音合成大赛Blizzard Challenge冠军），星火大模型的核心独特性在于其原生的语音-文字多模态能力。星火V4.0在中文理解、数学推理、代码生成等维度全面对标GPT-4 Turbo，在SuperCLUE中文综合基准测试中达到领先分数。星火大模型深度整合了讯飞旗下的C端产品生态，包括讯飞输入法、讯飞听见（语音转文字）、讯飞智文、讯飞智慧教育等。星火的语音交互能力在业界独树一帜——不仅支持文字对话，还支持自然流畅的语音问答、语音指令和情感识别。教育领域是星火的核心优势场景，讯飞AI学习机内置星火大模型后可以为学生提供个性化学习规划、作文智能批改和口语评测。2024年星火推出API开放平台，企业可通过标准API调用星火的文本生成、语音合成、语音识别等能力。\n\n【核心功能】\n1. 语音交互：原生的语音输入和语音问答支持自然对话式的人机语音交互\n2. 多轮对话：支持上下文感知的多轮深度对话记忆能力强\n3. 文本创作：写作辅助、文案生成、报告撰写等多种文本生成任务\n4. 代码生成：支持Python/Java/C++等主流编程语言的代码生成和解释\n5. 语音合成(TTS)：200+种音色支持中英日韩多语种情感可调\n6. 语音识别(ASR)：支持中英文混读、方言识别、噪声环境下高精度转录\n\n【应用场景】\n1. 教育辅导：学生使用讯飞AI学习机进行个性化习题推荐和作文智能批改\n2. 会议纪要：结合讯飞听见将会议录音实时转文字并生成摘要和行动项\n3. 语音创作：口述写文章的体验——用语音描述内容后AI整理成文\n4. 智能客服：企业接入星火API构建支持语音交互的7x24小时智能客服\n5. 语音助手：基于星火语音能力开发智能音箱的语音控制界面\n6. 外语学习：语音对话练习外语口语AI实时纠正发音和语法\n\n【收费情况】\nWeb端和App基础版免费（对话+文件+语音）。专业版￥49.9/月（约7美元/月）更快响应+更多调用次数。API按量计费：文本生成2元/百万token，语音合成1.5元/万次，语音识别2元/小时音频。\n\n【使用形态】\n在线使用。Web端、移动端App和语音硬件均可使用。API接口为云端调用。\n\n【使用说明】\n1. 访问 xinghuo.xfyun.cn 注册并登录账号\n2. 手机端下载讯飞星火App（iOS/Android）支持语音输入\n3. Web端在输入框打字或点击麦克风图标进行语音输入\n4. 上传文件：支持PDF/Word/Excel/PPT/TXT/Markdown\n5. 启用插件：在侧边栏选择需要的插件（文档/搜索/翻译等）\n6. 语音合成：访问 console.xfyun.cn 开通TTS API并测试不同音色\n7. API集成：登录开放平台获取AppKey和AppSecret\n\n【优势】\n1. 语音交互能力业内最强二十年语音技术积累\n2. 教育场景深耕AI学习机产品落地成熟\n3. 中文理解和生成能力在国产模型中领先\n4. 200+语音合成音色覆盖多语种\n5. 讯飞听见和讯飞输入法的生态整合\n6. 适合需要语音交互的业务场景\n\n【劣势】\n1. 纯文字对话体验不如文心一言和通义千问\n2. 英文能力明显弱于GPT-4o和Claude\n3. API定价相对较高（2元/百万token）\n4. 推理和逻辑能力在复杂场景下不够稳定\n5. 跨平台协作功能不如通义千问\n6. 部分高级功能（长文本处理）需付费解锁\n\n【支持平台】\nWeb端(Chrome/Edge/Firefox)、iOS App、Android App、讯飞AI学习机、讯飞听见、API接口（RESTful/WebSocket）", "s": "讯飞星火是科大讯飞研发的认知智能大模型，以原生语音交互能力为核心差异化，在教育、语音合成和智能客服场景中具有独特优势。"},{"n": "DeepL", "c": "AI教育/学习", "p": "DeepL GmbH", "u": "https://www.deepl.com", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】DeepL | AI翻译 | DeepL GmbH | https://www.deepl.com | 收费：免费+付费\n\n【详细介绍】\nDeepL是德国科隆的DeepL GmbH开发的AI翻译工具，2017年8月上线，以其远超Google Translate和微软翻译的翻译质量迅速成名。DeepL的翻译引擎基于专有的卷积神经网络（CNN）架构（不同于常见的Transformer架构），在盲测中多次被专业译员评为更自然、更地道的翻译。DeepL支持31种语言（中英日韩法德西意葡荷俄阿等），覆盖全球主要语种。其核心优势在于对上下文语境的深度理解，翻译结果在措辞选择、语法结构和语气风格上更接近人工翻译水平。2023年DeepL推出DeepL Write Pro（AI写作助手）和DeepL API，企业可以将DeepL的翻译能力集成到自己的产品中。DeepL文档翻译功能支持PDF、Word、PowerPoint等格式的原地翻译，保持原始排版不变。截至2024年，DeepL全球用户超过10亿，企业客户超过10万家。2024年DeepL发布DeepL Voice实时语音翻译产品，进一步扩展翻译场景。在WMT（机器翻译）国际评测中，DeepL在多个语对上的BLEU得分持续领先。\n\n【核心功能】\n1. 高质量文本翻译：31种语言互译翻译质量多次在盲测中排名第一\n2. 文档翻译：直接上传PDF/Word/PPT/TXT文件保持原格式进行全文翻译\n3. 网页翻译：通过浏览器扩展一键翻译整个网页\n4. DeepL Write Pro：AI写作助手优化翻译后文本的自然度和语法\n5. 术语表词典：自定义特定术语的翻译保证企业术语的一致性\n6. API接口：企业可将DeepL翻译引擎嵌入自有系统或工作流\n\n【应用场景】\n1. 学术论文翻译：研究者翻译SCI论文摘要和正文保持学术语言的严谨性\n2. 商务邮件撰写：外企员工撰写多语言商务邮件确保语气和措辞得体\n3. 软件本地化：开发团队将产品UI文本批量翻译为多语言版本\n4. 法律合同翻译：法律从业者翻译合同条款高准确性减少人工审校工作量\n5. 跨境电商运营：卖家翻译商品详情和客户沟通支持多语言管理\n6. 技术文档翻译：工程师翻译API文档和技术手册术语保持准确一致\n\n【收费情况】\n免费版每月30万字符翻译+3份文档翻译。Starter版$8.99/月（约65元/月）无限翻译+文档翻译+术语表。Advanced版$22.99/月（约165元/月）增加TMs和CAT工具集成。Ultimate版$49.99/月（约360元/月）含DeepL Write Pro。\n\n【使用形态】\nSaaS/Web：在线翻译平台需网络连接。桌面端和移动端App支持离线词库。\n\n【使用说明】\n1. 访问 deepl.com 或下载DeepL桌面端App（Windows/Mac）\n2. 免费注册账号选择订阅方案\n3. 在Web端输入或粘贴文本自动检测源语言选择目标语言\n4. 点击文档翻译按钮上传PDF/Word/PPT等文件\n5. 安装浏览器扩展后选中网页文本即可一键翻译\n6. API集成：访问 developer.deepl.com 获取API Key\n7. 专业版可创建术语表指定行业术语的翻译方式\n\n【优势】\n1. 翻译质量在机器翻译领域公认最佳尤其欧洲语言\n2. 文档翻译保留原始格式和排版\n3. 术语表功能保障企业翻译一致性\n4. 浏览器扩展支持即时翻译\n5. 德国公司的数据隐私标准（GDPR合规）\n6. API延迟低适合实时翻译场景\n\n【劣势】\n1. 中文翻译质量不如英文到欧洲语言之间那么出色\n2. 免费版字符配额较低（30万字符/月）\n3. 支持语言种类少于Google Translate（31种 vs 130+种）\n4. 不支持图片翻译和手写识别\n5. 语言支持更新缓慢\n6. 中国用户访问速度受国际网络影响\n\n【支持平台】\nWeb端(Chrome/Edge/Firefox/Safari)、Windows桌面端、macOS桌面端、iOS App、Android App、浏览器扩展(Chrome/Edge/Firefox)、API接口", "s": "DeepL是德国DeepL GmbH开发的AI翻译工具，以业界领先的翻译质量著称，在WMT评测中屡获第一，支持31种语言的文本和文档翻译。"},{"n": "Runway", "c": "AI视频生成", "p": "Runway ML", "u": "https://runwayml.com", "t": "SaaS/Web", "r": "付费", "d": "【产品名片】Runway | AI视频生成 | Runway ML | https://runwayml.com | 收费：付费\n\n【详细介绍】\nRunway由Cristobal Valenzuela、Anastasis Germanidis和Alejandro Matamala于2018年在纽约创立，最初是一个面向创作者和研究者的AI工具平台，2023年推出Gen-1/Gen-2视频生成模型后成为AI视频生成领域的标杆企业。Runway Gen-3 Alpha于2024年6月发布，在视频一致性、运动连贯性和文本对齐方面大幅超越前代产品。Gen-3基于扩散Transformer架构（DiT），能够根据文本描述生成10秒的1080p高清视频每秒30帧。Runway的工具集远不止文本生成视频，还包括视频修复（移除/替换视频中的物体）、无限扩展（将视频片段向前后无限延伸）、运动画笔（选中画面中的物体让AI控制其运动轨迹）等创意工具。好莱坞和广告创意行业已将Runway深度融入工作流——A24、Vans、New Balance等品牌使用Runway生成广告素材。2024年Runway推出Act-One功能，用户的手机拍摄表演视频即可驱动AI角色的面部动画和肢体动作，大幅降低动画制作门槛。Runway在CVPR和SIGGRAPH等重要学术会议上持续发表研究成果。\n\n【核心功能】\n1. 文生视频（Text-to-Video）：输入文本描述AI生成2-10秒的高清视频片段\n2. 图生视频（Image-to-Video）：上传静态图片AI生成图片中场景的动态延续\n3. 视频修复（Inpainting）：选中视频中的物体或区域AI将其移除或替换\n4. 无限扩展（Infinite Video）：将视频片段向前或向后无限延伸适合创建循环背景\n5. 运动画笔（Motion Brush）：在画面中画出运动轨迹AI控制物体沿轨迹运动\n6. Act-One面部驱动：上传手机自拍视频驱动AI角色的面部表情和动作\n\n【应用场景】\n1. 广告创意：品牌方输入秋季落叶中的跑车生成15秒广告片快速测试不同创意方向\n2. 电影预视化（Pre-Viz）：导演用文字描述场景AI生成分镜头预视化降低拍摄试错成本\n3. 社交媒体内容：自媒体创作者用图生视频将摄影作品变成动态短视频\n4. 产品展示：电商卖家上传产品图让AI生成展示视频替代实拍\n5. 音乐MV制作：独立音乐人输入歌词意境生成匹配的AI视频作为MV\n6. 游戏背景素材：游戏开发者用无限扩展生成动态环境背景\n\n【收费情况】\nStandard版$15/月（约108元/月）每月625个信用点+Gen-3访问。Pro版$35/月（约252元/月）2250信用点+无水印+优先队列。Unlimited版$95/月（约684元/月）无限生成+团队协作。企业版按需定制。\n\n【使用形态】\nSaaS/Web：完全在线使用所有计算在云端完成用户通过Web界面操作。\n\n【使用说明】\n1. 访问 runwayml.com 注册账号（Google/Apple/邮箱）\n2. 选择订阅方案（免费试用含125个信用点）\n3. 进入Dashboard点击Start with Video创建新项目\n4. 选择Gen-3 Alpha模型输入文本Prompt描述目标视频\n5. 调整参数（时长2-10秒、画面比例、运动强度等）\n6. 点击Generate等待云端渲染（约30秒-2分钟）\n7. 使用视频修复或运动画笔对生成结果进行精修\n8. 导出MP4文件或直接分享到社交媒体\n\n【优势】\n1. Gen-3视频质量和运动连贯性在AI视频生成领域顶尖\n2. Act-One面部驱动功能开创业界先河\n3. 工具矩阵完整（文生/图生/修复/扩展/运动控制）\n4. 好莱坞级别的输出质量（1080p 30fps）\n5. 活跃的学术研究和持续模型迭代\n6. 在广告和电影行业的实际应用已规模化\n\n【劣势】\n1. 月费较高免费试用额度极少（125信用点）\n2. 每次生成等待30秒-2分钟\n3. 生成视频时长限制在10秒以内\n4. 对特定类型（人脸特写、快速动作）的生成质量不稳定\n5. 中国用户访问速度受国际网络影响\n6. 输出视频中偶尔出现物体形变和运动扭曲\n\n【支持平台】\nWeb端(Chrome/Edge/Firefox/Safari)、API接口（企业版）", "s": "Runway是纽约Runway ML开发的AI视频生成平台，Gen-3 Alpha模型在视频质量和运动连贯性上处于业界领先水平，广泛用于广告、电影和社交媒体内容创作。"},{"n": "百度智能云千帆", "c": "AI开发平台", "p": "百度", "u": "https://cloud.baidu.com/product/qianfan.html", "t": "SaaS/Web", "r": "付费", "d": "【产品名片】百度智能云千帆 | AI开发平台 | 百度 | https://cloud.baidu.com/product/qianfan.html | 收费：付费\n\n【详细介绍】\n百度智能云千帆（Qianfan）是百度推出的企业级AI原生应用开发平台，2023年9月正式上线，定位为AI应用的App Store。千帆平台整合了百度文心ERNIE 4.0/3.5系列模型、开源模型（Llama 3、Qwen等）以及第三方模型，提供统一的模型调用、微调、部署和应用构建能力。千帆的核心价值在于它大幅降低了企业构建AI应用的门槛——对话引擎、知识库（RAG）、智能体（Agent）和工作流编排等模块都以可视化拖拽方式提供，不需要AI专业团队即可上手。千帆的知识库能力尤为突出：企业上传私有文档后平台自动完成文档解析、向量化存储和检索增强生成（RAG）的完整链路，构建可在5分钟内完成。千帆的工作流编排器支持条件分支、循环、子流程和函数调用等复杂逻辑。2024年千帆推出AppBuilder，进一步简化了AI应用的UI构建，企业可用自然语言描述需求后自动生成AI应用界面。千帆已在金融、政务、医疗、教育等行业落地大量案例。\n\n【核心功能】\n1. 模型广场：接入文心ERNIE全系列+开源模型+第三方模型统一管理调用额度\n2. 知识库构建(RAG)：上传PDF/Word/TXT等文档自动构建检索增强生成引擎\n3. 智能体(Agent)构建：可视化配置AI助手的角色、提示词、工具和知识库\n4. 工作流编排：拖拽式配置AI应用的多步骤流程（条件/分支/循环/子流程）\n5. AppBuilder：自然语言描述即可自动生成AI应用的前端界面和后端逻辑\n6. 模型微调(SFT)：基于企业私有数据对模型进行低成本的监督微调\n\n【应用场景】\n1. 企业智能客服：企业上传产品手册和FAQ文档千帆5分钟搭建7x24小时问答机器人\n2. 文档智能化处理：律师事务所上传合同模板让AI自动审查条款风险并生成摘要\n3. 内部知识问答：企业将内部SOP和培训资料导入千帆员工用自然语言查询\n4. 营销内容生成：配置品牌风格指引后AI自动生成符合品牌调性的营销文案\n5. 流程自动化：配置工作流实现从用户提问到数据库查询到结果汇总的自动化链路\n6. AI原生应用开发：用AppBuilder自然语言描述需求自动生成落地应用\n\n【收费情况】\n基础功能按API调用量计费（ERNIE 4.0约3元/百万token）。平台服务费根据模型和调用量阶梯报价。企业级部署按需定制报价（含私有化部署和SLA保障）。\n\n【使用形态】\nSaaS/Web：通过百度智能云控制台在线使用。支持私有化部署（企业版）。\n\n【使用说明】\n1. 访问 cloud.baidu.com 注册百度智能云账号并完成企业认证\n2. 在控制台搜索千帆并开通服务\n3. 进入千帆控制台选择模型广场查看可用模型\n4. 创建知识库：上传文档后自动解析后配置检索参数后发布\n5. 创建智能体：配置角色描述后关联知识库后绑定工具后测试发布\n6. 使用工作流编辑器拖拽配置多步骤AI逻辑\n7. 通过千帆API或AppBuilder将AI应用嵌入现有业务系统\n\n【优势】\n1. 百度文心ERNIE大模型作为底座中文理解能力强\n2. 5分钟快速搭建RAG知识库开箱即用\n3. 可视化拖拽操作不需AI技术背景\n4. AppBuilder可用自然语言描述生成完整应用\n5. 已通过国内大模型备案企业部署合规\n6. 支持私有化部署保障数据安全\n\n【劣势】\n1. API费用较高大规模调用成本不低\n2. 平台学习曲线较陡功能模块繁多\n3. 模型微调需要AI工程师支持\n4. 与国外云平台（AWS/Azure）的AI服务相比集成度有差距\n5. 对非百度云用户来说需额外学习云平台操作\n6. 工作流编辑器在复杂逻辑场景下不够灵活\n\n【支持平台】\nWeb端(Chrome/Edge/Firefox)、百度智能云控制台、RESTful API、AppBuilder SDK（Python/Java/Go）", "s": "百度智能云千帆是企业级AI应用开发平台，整合文心ERNIE模型能力，以可视化方式提供知识库、智能体和工作流编排，5分钟即可构建AI应用。"},{"n": "Notion AI", "c": "AI办公/文档", "p": "Notion Labs", "u": "https://www.notion.so/product/ai", "t": "SaaS/Web", "r": "付费", "d": "【产品名片】Notion AI | AI办公/文档 | Notion Labs | https://www.notion.so/product/ai | 收费：付费\n\n【详细介绍】\nNotion AI是Notion Labs在其全能协作平台Notion中集成的AI助手，2023年2月推出Alpha版本，同年11月正式全面上线。Notion本身就是全球最受欢迎的文档、知识库、项目管理一体化工具，拥有超过1亿用户。Notion AI将大语言模型能力无缝嵌入到用户日常写作和知识管理的每一个环节——写文档时按空格即可让AI续写、选中任意内容让AI改写或翻译、在数据库中让AI自动生成摘要和属性。Notion AI的核心设计理念是AI不打扰工作流：它不以聊天机器人的形式独立存在，而是作为编辑器内原生功能，用户在写作和整理知识的过程中自然调用。底层模型最初基于GPT-4，2024年增加了Claude模型作为备选。Notion AI还支持Q&A问答功能——用户可以直接向AI提问上个月的销售总结是什么，AI会自动搜索整个工作空间中的相关页面并给出答案。Notion AI在跨国团队协作场景中特别受欢迎，AI翻译功能支持页面内容一键转换为30+种语言，Wiki助手可以从现有知识库自动生成新员工指南。\n\n【核心功能】\n1. AI写作辅助：在编辑器中按空格或选中文本即可调用AI续写、改写、摘要、翻译\n2. Q&A知识问答：用自然语言向工作空间提问AI自动检索相关页面并汇总答案\n3. 数据库AI属性：自动从文本生成摘要、关键词、待办列表等数据库字段\n4. 内容翻译：一键将页面翻译为30+种语言保持格式排版不变\n5. 文案润色：选中文本后可要求AI改变语气（简练/专业/活泼）修改语法错误\n6. 项目动态摘要：自动生成项目的周报摘要和关键进展汇总\n\n【应用场景】\n1. 团队Wiki维护：市场团队每月更新Wiki时用AI从聊天记录自动提炼新增内容\n2. 会议记录整理：记录员写下会议要点后让AI自动整理为结构化的会议纪要\n3. 产品需求文档：产品经理列出要点后用AI扩写为完整的PRD文档\n4. 多语言协作：跨国团队的页面一键翻译中英日法团队无需人工翻译即可协作\n5. 新员工入职：HR将公司资料汇总后用AI自动为新员工生成个性化入职指南\n6. 项目管理报告：项目经理让AI从任务数据库自动汇总每周进展和风险点\n\n【收费情况】\nNotion AI为附加付费功能：个人版$10/月（约72元/月）不限使用次数，Business版$18/月（约130元/月），Enterprise版按需报价。使用Notion AI需先拥有Notion账号。\n\n【使用形态】\nSaaS/Web：在线协作平台需网络连接。桌面端和移动端App离线时部分功能受限。\n\n【使用说明】\n1. 注册Notion账号访问 notion.so\n2. 在Settings & Billing中订阅Notion AI附加服务\n3. 编辑器中按空格键或在选中文本后出现AI菜单\n4. 选择写作类型：续写/改写/摘要/翻译/列表生成等\n5. 使用Q&A：点击页面右上角的AI问答图标输入问题\n6. 数据库属性编辑中选择Add a Property后AI后选择生成摘要或关键词\n7. 右键点击任意页面选择Translate进行一键翻译\n\n【优势】\n1. AI深度嵌入编辑器无需切换上下文即可使用\n2. Q&A问答可搜索整个工作空间价值远高于单文档工具\n3. 翻译功能保持文档排版跨国团队协作利器\n4. 数据库AI属性可在知识管理场景中自动化大量重复操作\n5. Notion生态本身已是全球最流行的协作工具之一\n6. 不限使用次数的付费模式适合高频用户\n\n【劣势】\n1. 必须订阅Notion AI附加服务（额外付费）\n2. AI生成内容质量受限于已存在于工作空间中的文档质量\n3. 中文支持不如英文流畅\n4. Notion本身在国内访问速度不稳定\n5. 离线不可用\n6. 对超大工作空间（1000+页面）Q&A检索效率下降\n\n【支持平台】\nWeb端(Chrome/Edge/Firefox/Safari)、Windows桌面端、macOS桌面端、iOS App、Android App、API接口", "s": "Notion AI是Notion协作平台的原生AI助手，将写作辅助、知识问答、翻译和数据库自动化无缝嵌入用户工作流，覆盖1亿+用户。"},{"n": "聚宽(JoinQuant)", "c": "AI金融/量化", "p": "北京聚宽科技有限公司", "u": "https://www.joinquant.com", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】聚宽(JoinQuant) | AI金融/量化 | 北京聚宽科技有限公司 | https://www.joinquant.com | 收费：免费+付费\n\n【详细介绍】\n聚宽（JoinQuant）是北京聚宽科技有限公司于2015年推出的国内领先的量化交易平台，为中国量化投资者提供从研究策略、回测验证到实盘交易的完整闭环解决方案。聚宽的核心用户群体包括个人量化投资者、私募基金和专业金融机构。平台内置完整的数据库（覆盖A股全市场日线和分钟线K线数据、财务数据、龙虎榜、北向资金、行业板块数据等），用户无需自行搭建数据基础设施。聚宽提供基于Python的Jupyter Notebook在线研究环境，支持Pandas/Numpy/Scikit-learn等标准数据科学库，用户可以在浏览器中完成数据处理、因子构建和模型训练的全流程。聚宽的回测引擎经过专业机构验证，支持日线回测和Tick级回测，回测速度在同类平台中名列前茅。2024年聚宽推出AI策略助手功能，基于大语言模型辅助用户生成策略框架、优化参数和解读回测报告。聚宽还建立了社区生态，用户之间可以分享策略思路和研究心得。截至2024年，聚宽平台上已有超过50万注册用户，上架了来自社区和私募的数百个高质量策略。\n\n【核心功能】\n1. 在线研究环境：基于Jupyter Notebook的全功能量化研究IDE内置数据科学库\n2. 全市场数据：A股日线/分钟线K线、财务数据、估值数据、龙虎榜、北向资金等\n3. 回测引擎：高性能日线和分钟线回测支持滑点和手续费模拟\n4. AI策略助手：用自然语言描述策略思路AI自动生成Python策略代码框架\n5. 实盘交易：对接多家券商实现策略的自动化实盘交易执行\n6. 策略社区：浏览和订阅其他量化投资者的策略思路和研究笔记\n\n【应用场景】\n1. 因子挖掘：金融数据分析师利用历史数据进行多因子模型研究和Alpha因子测试\n2. 策略回测：交易员在建仓前对策略进行历史数据回测验证收益和风险指标\n3. 自动交易：量化投资者将在平台开发的策略绑定券商账户实现自动化交易\n4. 选股研究：用Python对全市场股票进行多维度筛选和打分（PE/PB/ROE/均线等）\n5. 风险管理：构建投资组合的风险模型计算VaR和最大回撤等风险指标\n6. AI策略生成：用自然语言描述交易思路后AI自动生成可运行的策略代码\n\n【收费情况】\n研究版免费（访问所有数据+回测）。专业版￥999/年（约83元/月）增加更高回测频率和更多实盘接口。机构版按需报价。\n\n【使用形态】\nSaaS/Web：通过Web浏览器访问Jupyter Notebook进行研究和回测。\n\n【使用说明】\n1. 访问 joinquant.com 注册账号\n2. 在首页进入研究环境创建新的Notebook\n3. 使用聚宽API获取数据（get_price/get_fundamentals等）\n4. 编写策略代码：导入聚宽API后选股逻辑后交易信号后止盈止损规则\n5. 在回测模块设置回测参数（时间范围/初始资金/滑点/手续费）\n6. 执行回测查看收益曲线、夏普比率、最大回撤等指标\n7. 策略优化通过AI策略助手或手动参数调优\n8. 绑定券商账户后开启实盘交易\n\n【优势】\n1. 数据基础设施完善研究者无需自行搭建数据库\n2. 回测引擎经过专业机构验证结果可信度高\n3. 活跃的量化社区策略交流氛围浓厚\n4. 研究版完全免费对个人投资者友好\n5. AI策略助手降低量化入门门槛\n6. 支持从研究到实盘的完整链路\n\n【劣势】\n1. 数据更新有一定延迟（T+1日）不适合高频交易\n2. 实盘交易仅支持国内部分券商\n3. 分钟线数据历史长度有限（约3-5年）\n4. 平台学习曲线较陡需Python编程基础\n5. 回测服务器在高峰时段可能排队\n6. 美股和海外市场数据覆盖不足\n\n【支持平台】\nWeb端(Chrome/Edge/Firefox/Safari)、API接口(RESTful)、券商交易终端", "s": "聚宽是国内领先的量化交易平台，从数据获取、策略研究、回测验证到实盘交易一站式闭环，拥有超50万量化投资者用户和AI策略辅助功能。"},{"n": "Stable Diffusion", "c": "AI设计/图像", "p": "Stability AI", "u": "https://stability.ai", "t": "开源/本地", "r": "开源免费", "d": "【产品名片】Stable Diffusion | AI设计/图像 | Stability AI | https://stability.ai | 收费：开源免费\n\n【详细介绍】\nStable Diffusion是由Stability AI联合慕尼黑大学等学术机构开发的深度学习文生图模型，2022年8月开源发布后彻底改变了AI图像生成领域。与Midjourney和DALL-E不同，Stable Diffusion是开源的——模型权重免费下载用户可以在自己的电脑上运行无需支付每次生成的费用。Stable Diffusion基于潜在扩散模型（LDM）架构，通过在潜在空间（而非像素空间）中执行去噪扩散过程大幅降低计算资源需求。社区围绕Stable Diffusion形成了庞大的生态系统——Civitai（模型分享平台）上已有超过10万个微调模型（Checkpoint/LoRA），涵盖写实、动漫、像素、3D等数百种画风。ControlNet、T2I-Adapter等扩展技术让用户可以用姿态图、深度图、边缘图等条件精确控制生成结果。2024年发布的Stable Diffusion 3采用了全新的MMDiT架构（多模态扩散Transformer），在文字渲染和图像质量上大幅提升。Stable Diffusion的开源生态催生了秋叶启动器、WebUI Forge、ComfyUI等一站式的部署和操作工具，极大降低了非技术用户的使用门槛。\n\n【核心功能】\n1. 文生图：从自然语言描述生成高质量图像支持写实/动漫/油画/水墨等多种风格\n2. 图生图：上传参考图片让AI在保留构图和色彩的基础上改变风格或细节\n3. ControlNet精准控制：通过人体姿态、深度图、线稿图等条件精确控制生成图像的结构\n4. 局部重绘(Inpainting)：选中图片中特定区域让AI重新生成这部分内容\n5. 超分辨率放大：将低分辨率图片无损放大至2K/4K/8K分辨率\n6. LoRA微调模型：用少量图片（10-20张）对模型进行轻量微调生成特定角色或物体的形象\n\n【应用场景】\n1. 游戏概念设计：游戏美术师用文生图快速生成角色原画和环境概念稿\n2. 电商产品图：卖家拍摄产品图后用图生图更换背景和配色\n3. 摄影师后期：用ControlNet提取照片的构图后引导AI进行创意变体\n4. 室内设计：设计师上传毛坯房照片用AI进行不同风格的装修效果渲染\n5. 插画创作：插画师用LoRA训练自己的角色风格后批量生成系列作品\n6. 教学素材生成：教师用Stable Diffusion生成特定场景的示意图和教学插图\n\n【收费情况】\n完全开源免费（模型权重从HuggingFace下载使用）。在线服务DreamStudio按量计费（约10美元/5000积分）。云端部署服务按需付费。\n\n【使用形态】\n本地/开源：下载模型后在本地GPU上运行推荐NVIDIA显卡6GB以上显存。推荐使用秋叶启动器或Stable Diffusion WebUI。\n\n【使用说明】\n1. 安装：推荐使用秋叶启动器（bilibili搜索秋叶Stable Diffusion）一键安装\n2. 下载模型：从Civitai或HuggingFace下载Checkpoint模型放入models目录\n3. 启动WebUI后进入txt2img（文生图）或img2img（图生图）界面\n4. 输入Prompt（英文提示词）和Negative Prompt（负面提示词）\n5. 选择采样器（推荐DPM++ 2M Karras）调整宽度高度和步数\n6. 点击Generate生成查看结果并调整参数\n7. 高级使用：安装ControlNet插件后上传控制条件图进行精准控制\n8. LoRA训练：使用Dreambooth或Kohya GUI用10-20张图片训练专属LoRA\n\n【优势】\n1. 完全开源免费本地运行无需支付每次生成费用\n2. 社区生态极其庞大（10万+模型无数插件扩展）\n3. ControlNet提供了行业领先的生成控制精度\n4. 可在本地运行保护隐私和数据安全\n5. 无限生成次数适合商业批量使用\n6. 社区持续推出新模型和新技术迭代速度极快\n\n【劣势】\n1. 需要GPU硬件（推荐NVIDIA 6GB以上显存）\n2. 安装配置相比Midjourney有较高技术门槛\n3. 英文Prompt效果远好于中文Prompt\n4. 默认模型在人物手部等细节上仍有缺陷\n5. 生成速度取决于本地GPU性能\n6. 社区模型质量参差不齐需自行筛选\n\n【支持平台】\n本地运行（Windows/macOS/Linux）、WebUI（Gradio界面）、ComfyUI（节点式界面）、DreamStudio（在线版）、HuggingFace（模型库）", "s": "Stable Diffusion是Stability AI开源的大模型文生图工具，在本地运行免费无限生成，拥有10万+社区微调模型和ControlNet等精准控制能力。"},{"n": "Claude", "c": "通用AI大模型", "p": "Anthropic", "u": "https://claude.ai", "t": "对话", "r": "付费", "d": "【产品名片】Claude | 通用AI大模型 | Anthropic | https://claude.ai | 收费：付费\n\n【详细介绍】\nClaude是Anthropic公司开发的AI大语言模型系列，由前OpenAI研究团队创立。Claude 3.5 Sonnet在编程和多步骤推理任务表现突出，在SWE-bench测试中排名第一。Claude以安全性著称，使用了Constitutional AI训练方法。Artifacts功能让AI生成可交互的代码/文档/图表。百万token上下文窗口使其在企业文档处理场景中极具优势。\n\n【核心功能】\n1. 百万token长上下文：可一次性处理《战争与和平》体量的文本\n2. Artifacts交互式输出：生成可运行的HTML/React/SVG代码小部件\n3. Analysis Tool数据分析：上传CSV/Excel自动完成数据清洗和可视化\n4. Claude Code编程：终端内AI编程助手支持复杂代码库操作\n5. Constitutional AI安全机制：通过宪法AI训练确保回答安全性\n6. 多模态理解：上传图片/PDF/文档进行内容分析\n\n【应用场景】\n1. 软件工程师：用Claude Code在终端中调试大型代码库\n2. 产品经理：用Artifacts快速生成产品原型和交互式线框图\n3. 数据分析师：上传CSV文件让AI自动做数据分析可视化\n4. 学术研究者：上传论文PDF让AI   {"n": "聚合数据", "c": "API数据接口", "p": "聚合科技", "u": "https://www.juhe.cn", "t": "API平台", "r": "免费+付费", "d": "【产品名片】聚合数据 | API数据接口 | 聚合科技 | https://www.juhe.cn | 收费：免费+付费\n\n【详细介绍】\n聚合数据（Juhe.cn）是国内领先的API数据接口服务平台，成立于2010年，总部位于苏州。聚合数据提供超过200种API数据接口，覆盖生活服务、金融、电商、交通、教育、医疗、天气、短信、物流等几乎所有行业领域。平台采用API市场模式，开发者注册后即可在线购买或免费申请各类数据接口，系统自动生成API Key，集成到应用中即可使用。聚合数据是国内最早也是最大的API聚合平台之一，累计服务超过100万开发者，日均API调用量超过10亿次。平台提供详尽的API文档、SDK、代码示例和技术支持，帮助开发者快速集成各类数据能力。聚合数据的稳定性和可靠性经过大规模生产环境验证，是众多企业和个人开发者的首选API数据服务商。\n\n【核心功能】\n1. API数据市场：200+种数据接口，涵盖短信/物流/天气/身份证/银行卡/股票/汇率等\n2. 一键接入：注册即生成API Key，HTTP/HTTPS调用，支持JSON/XML格式返回\n3. 自助购买：在线选购数据包，按次/包月/包年计费，实时开通\n4. 开发者文档：每个接口提供完整文档、请求示例、返回参数说明\n5. SDK支持：提供Java/Python/PHP/Node.js等主流语言SDK\n6. 调用统计：控制台实时查看API调用量、成功率、耗时等指标\n\n【应用场景】\n1. 短信验证码：电商/APP注册登录场景，通过聚合数据短信API发送验证码\n2. 身份证实名认证：金融/网贷/酒店行业需要实名认证的场景\n3. 天气查询：旅游APP/智能家居/农业系统需要实时天气数据\n4. 股票行情：炒股软件/财经网站获取实时股票数据\n5. 物流查询：电商平台/快递系统通过单号自动查询物流状态\n6. 银行卡四要素：支付场景验证银行卡号/姓名/身份证/手机号一致性\n\n【收费情况】\n免费+按次计费。注册送免费调用额度，后续按接口按量计费。短信验证码约0.035元/条，身份证实名认证0.2元/次，股票行情0.001元/次。支持包月/包年套餐更优惠。\n\n【使用形态】\n在线API调用。HTTP/HTTPS RESTful API，需要网络连接。\n\n【使用说明】\n1. 访问 juhe.cn 注册账号（邮箱/手机号）\n2. 登录后在「API市场」浏览并选择所需接口\n3. 点击「申请」或「购买」获取该接口的API Key\n4. 查看接口文档，按请求示例调用\n5. 在控制台「我的API」中查看调用量、余额和数据分析\n6. 技术支持：联系在线客服或查看开发者社区\n\n【优势】\n1. 接口种类最多（200+），一站式解决数据需求\n2. 接入门槛低，注册即可使用\n3. 文档完善，SDK齐全\n4. 稳定性高，日均调用10亿+\n5. 提供免费额度，低成本试错\n\n【劣势】\n1. 部分接口数据更新不及时\n2. 高级接口价格较高\n3. 免费额度有限\n4. 客户服务响应速度一般\n\n【支持平台】\nWeb控制台、HTTP API、Java SDK、Python SDK、PHP SDK、Node.js SDK", "s": "聚合数据（Juhe.cn）是国内领先的API数据接口服务平台，提供超过200种数据接口，覆盖各行业领域，服务超100万开发者。"},

  {"n": "易源数据", "c": "API数据接口", "p": "易源科技", "u": "https://www.datayuan.cn", "t": "API平台", "r": "免费+付费", "d": "【产品名片】易源数据 | API数据接口 | 易源科技 | https://www.datayuan.cn | 收费：免费+付费\n\n【详细介绍】\n易源数据（DataYuan）是国内综合性API数据接口平台，专注于为企业和开发者提供稳定、高效、安全的数据接口服务。平台汇集了近百种高质量API接口，涵盖身份证实名认证、银行卡信息查询、手机号归属地、IP地址定位、企业工商信息查询、知识产权查询、交通违章查询、驾驶证信息查询、车辆信息查询、新闻资讯、天气查询、天气预报、股票行情、基金信息、汇率换算、黄金价格、短信通知、语音通知等。易源数据所有接口均采用HTTPS加密传输，保障数据安全。平台拥有完善的权限管理体系，支持子账号和API Key权限分离，适合企业级使用。\n\n【核心功能】\n1. 数据安全：HTTPS加密传输，防篡改防窃听\n2. 权限管理：主账号/子账号/API Key三级权限\n3. 接口丰富：近百种API覆盖多行业\n4. 文档详尽：每个接口含请求示例、返回示例、错误说明\n5. 调用分析：按接口、时间、来源等多维度分析\n6. 财务管理：在线充值、消费明细、发票申请\n\n【应用场景】\n1. 企业级应用：需要权限管理和安全传输的企业系统\n2. 车辆相关：二手车平台查询车辆信息、违章数据\n3. 金融合规：KYC实名认证、反欺诈数据\n4. 法律查询：法律法规、裁判文书数据\n5. 教育行业：学历学位认证、学籍查询\n6. 电商平台：实名认证、企业认证\n\n【收费情况】\n免费+按次计费。注册送体验金，0.001-0.5元/次。企业定制方案按需报价。\n\n【使用形态】\n在线API调用。HTTPS RESTful API。\n\n【使用说明】\n1. 访问 datayuan.cn 注册企业或个人账号\n2. 在API列表找到所需接口\n3. 查看文档和价格\n4. 购买后获取API Key\n5. 按文档调用，支持JSON格式返回\n6. 企业用户可以创建子账号管理API权限\n\n【优势】\n1. 数据安全传输\n2. 权限管理完善\n3. 接口稳定\n4. 企业级功能\n\n【劣势】\n1. 知名度一般\n2. 部分接口价格偏高\n3. 社区生态不够活跃\n\n【支持平台】\nWeb控制台、HTTPS API", "s": "易源数据（DataYuan）是综合性API数据接口平台，注重数据安全和权限管理，适合企业级使用。"},
  {"n": "数据宝", "c": "API数据接口", "p": "数据宝", "u": "https://www.shujubao.com", "t": "API平台", "r": "付费", "d": "【产品名片】数据宝 | API数据接口 | 数据宝 | https://www.shujubao.com | 收费：付费\n\n【详细介绍】\n数据宝（DataBao）是国内专业的数据API接口服务商，专注于为企业提供高质量的商业数据接口服务。平台核心优势在于数据来源正规、权威可靠，所有数据均来自官方授权或公开合法渠道。数据宝提供包括企业工商信息查询、司法涉诉信息、知识产权信息、招标投标信息、信用报告、身份核验、车辆信息、房产信息等专业数据API。数据宝的数据更新及时、准确率高，特别适合金融风控、企业尽调、法律服务等对数据准确性要求极高的专业场景。平台还提供数据定制服务，可以根据客户需求定制专属数据接口。数据宝已服务数百家银行、保险、互联网金融和法律服务机构。\n\n【核心功能】\n1. 权威数据：数据来自官方授权渠道，权威可靠\n2. 企业信息：工商注册/年报/变更/经营异常/行政处罚/司法协助\n3. 司法数据：裁判文书/执行信息/失信被执行人/开庭公告\n4. 信用服务：企业信用报告/个人信用报告/多头借贷检测\n5. 身份核验：身份证二三四要素/人脸比对/活体检测\n6. 数据定制：根据企业需求定制专属数据接口\n\n【应用场景】\n1. 金融风控：银行/消费金融/小贷公司做贷前审核和贷后监控\n2. 企业尽调：投资机构/律所在投资并购前做目标企业尽职调查\n3. 法务服务：律师事务所查询案件相关方信息和涉诉记录\n4. 人力资源：企业在招聘时核验候选人的学历和工作经历\n5. 供应链管理：制造业/贸易企业审核供应商资质\n6. 合规审核：金融机构KYC和AML合规数据支撑\n\n【收费情况】\n按次计费。企业工商查询1-5元/次，司法数据0.5-3元/次，信用报告5-20元/份。企业套餐可议价。\n\n【使用形态】\n在线API调用。HTTPS RESTful API。支持私有化部署。\n\n【使用说明】\n1. 访问 shujubao.com 注册企业账号\n2. 提交企业资质审核\n3. 审核通过后在数据列表选择所需接口\n4. 签署服务合同并付费\n5. 获取API Key，按文档调用\n6. 在控制台查看调用明细\n\n【优势】\n1. 数据来源权威可靠\n2. 数据更新及时\n3. 覆盖企业/司法/信用\n4. 支持数据定制\n5. 已服务数百家金融机构\n\n【劣势】\n1. 价格较高\n2. 仅面向企业客户\n3. 个人开发者无法使用\n4. 需要企业资质审核\n\n【支持平台】\nWeb控制台、HTTPS API", "s": "数据宝（DataBao）专注于企业级商业数据API，数据来自官方授权渠道，权威可靠，适合金融风控和尽调场景。"},
  {"n": "高德开放平台", "c": "API数据接口", "p": "高德/阿里巴巴", "u": "https://lbs.amap.com", "t": "API平台", "r": "免费+付费", "d": "【产品名片】高德开放平台 | API数据接口 | 高德/阿里巴巴 | https://lbs.amap.com | 收费：免费+付费\n\n【详细介绍】\n高德开放平台（LBS开放平台）是高德地图面向开发者和企业提供的位置服务与地理数据API平台。平台提供地图SDK（含2D/3D地图渲染）、定位SDK（GPS+基站+WiFi混合定位）、导航SDK（驾车/步行/骑行/公交路径规划）、搜索API（POI检索/关键词搜索/周边搜索/行政区划）、地理编码API（地址转坐标/坐标转地址）、路径规划API（驾车/步行/骑行/公交路线规划）、交通态势API（实时路况/拥堵路段）、实时天气API（实况天气/未来天气预报）等丰富的位置服务能力。高德地图是中国最大的数字地图和导航服务商之一，数据覆盖全国全量道路和POI信息。高德开放平台日调用量超过1000亿次，服务超百万开发者和数十万企业客户。平台提供免费额度（个人开发者每日10万次），超过后按量计费。\n\n【核心功能】\n1. 地图SDK：2D/3D地图渲染、地图标注、地图交互\n2. 定位SDK：GPS+基站+WiFi混合定位，室内外无缝切换\n3. 导航SDK：驾车/步行/骑行/公交路径规划+语音导航\n4. 搜索API：关键字/周边/分类/行政区划POI检索\n5. 地理编码：地址解析为经纬度，经纬度反解为地址\n6. 交通态势：实时路况查询、拥堵路段分析\n\n【应用场景】\n1. 外卖配送：实时定位配送员、规划最优路线\n2. 出行打车：乘客司机定位、路径规划、里程计算\n3. 物流快递：配送路线优化、快递员轨迹追踪\n4. 社交应用：附近的人、位置分享、签到打卡\n5. 旅游出行：景点POI信息、周边交通、导航指引\n6. 智慧城市：交通流量监测、城市热力图\n\n【收费情况】\n免费+按量计费。个人开发者每日免费10万次调用。超出后套餐0.3-3元/万次不等。企业级按需洽谈。\n\n【使用形态】\nSDK集成+API调用。SDK支持iOS/Android/Web/小程序。API为HTTP/HTTPS。\n\n【使用说明】\n1. 访问 lbs.amap.com 注册高德开放平台账号\n2. 创建应用并获取Key（iOS/Android/Web分别申请）\n3. 下载SDK集成到项目中\n4. 调用API\n5. 在控制台查看配额使用情况和调用分析\n6. 升级服务：控制台-服务配额-购买扩展包\n\n【优势】\n1. 国内最大的LBS数据提供商\n2. 数据覆盖完整，更新及时\n3. 免费额度充足（10万次/天）\n4. SDK功能完善，文档详尽\n5. 阿里系生态支持\n\n【劣势】\n1. 部分高级功能收费较高\n2. SDK包体积较大\n3. 高并发场景需要企业方案\n4. 数据精度不如GPS设备\n\n【支持平台】\niOS SDK、Android SDK、Web JS API、小程序SDK、HTTP/HTTPS API", "s": "高德开放平台是中国最大的LBS服务商之一，提供地图/定位/导航/搜索/路况等位置服务API，日调用量超1000亿次。"},

  {"n": "百度AI开放平台", "c": "API数据接口", "p": "百度", "u": "https://ai.baidu.com", "t": "API平台", "r": "免费+付费", "d": "【产品名片】百度AI开放平台 | API数据接口 | 百度 | https://ai.baidu.com | 收费：免费+付费\n\n【详细介绍】\n百度AI开放平台是百度旗下最大的人工智能能力开放平台，面向开发者和企业提供超过240项AI能力API接口。平台涵盖图像识别（通用物体识别/菜品识别/车型识别/动物识别等）、文字识别OCR（身份证/银行卡/营业执照/驾驶证/通用文字/票据等）、人脸识别（人脸检测/人脸对比/人脸搜索/活体检测）、自然语言处理（情感分析/评论观点抽取/文章标签/文本分类）、语音技术（语音识别/语音合成/语音唤醒）、视频分析（视频内容审核/视频标签/短视频分析）、知识图谱、内容审核（文本/图片/音频审核）、大数据分析等全方位的AI能力。百度AI开放平台累计服务超过200万开发者，日均API调用量超过2000亿次。平台提供丰富的免费调用额度（如通用文字识别每天500次免费），是国内外开发者接入AI能力最主流的平台之一。\n\n【核心功能】\n1. 图像识别：通用物体/菜品/车型/植物/动物等200+类目识别\n2. 文字识别OCR：身份证/银行卡/营业执照/通用文字/票据/表格\n3. 人脸识别：人脸检测/比对/搜索/活体检测/人脸库管理\n4. NLP：情感分析/评论观点/文章分类/词法分析/对话理解\n5. 语音技术：语音识别/合成/唤醒/评测\n6. 内容审核：文本/图片/音视频的涉黄/涉政/暴恐/广告审核\n\n【应用场景】\n1. 文档数字化：企业合同/发票/身份证的OCR识别和录入\n2. 内容安全：UGC平台的文本和图片审核实时检测违规内容\n3. 人脸门禁：企业和园区的人脸识别通行\n4. 智能客服：NLP情感分析和智能问答\n5. 产品识别：电商/零售场景的拍照识物\n6. 智能驾驶：车辆/交通标识识别\n\n【收费情况】\n免费+按量计费。免费额度每个接口每天500-1000次。超出后按次收费，OCR 0.001-0.01元/次，人脸0.001-0.003元/次。企业套餐可签约。\n\n【使用形态】\nHTTP API+SDK。SDK支持Python/Java/PHP/C#/Node.js/Go/iOS/Android。\n\n【使用说明】\n1. 访问 ai.baidu.com 用百度账号登录\n2. 在控制台创建应用\n3. 选择所需AI能力并获取API Key和Secret Key\n4. 获取Access Token（用于API鉴权）\n5. 按文档调用API\n6. 控制台查看调用量和配额\n\n【优势】\n1. 240+项AI能力，覆盖最广\n2. 免费额度丰富\n3. 百度AI技术领先\n4. SDK覆盖全平台\n5. 文档详尽、Demo丰富\n6. 开发者社区活跃\n\n【劣势】\n1. Access Token需定期刷新\n2. 高并发需申请\n3. 部分能力限时免费\n4. 接口版本更新快\n\n【支持平台】\nHTTP API、Python/Java/PHP/C#/Node.js/Go/iOS/Android SDK", "s": "百度AI开放平台提供240+项AI能力API，覆盖图像/OCR/人脸/NLP/语音/内容审核等，免费额度丰富。"},
  {"n": "Hermes Agent", "c": "AI Agent/智能体", "p": "Nous Research", "u": "https://hermes-agent.nousresearch.com", "t": "CLI/Agent", "r": "开源免费", "d": "【产品名片】Hermes Agent | AI Agent/智能体 | Nous Research | https://hermes-agent.nousresearch.com | 收费：开源免费\n\n【详细介绍】\nHermes Agent是Nous Research开发的开源AI Agent框架和终端工具，专为智能体工作流设计。Hermes Agent支持多种主流AI模型（Claude、GPT-4、DeepSeek等），提供丰富的工具集成能力——包括文件操作、终端执行、浏览器自动化、代码执行、网络搜索、GitHub操作、记忆管理和定时任务等。Hermes Agent的最大特色是其「背景计算机使用」（Computer Use）能力，智能体可以在后台驱动用户桌面进行操作，不抢占用户光标和键盘焦点。Agent还支持多智能体并行任务分发、持久化记忆跨会话保持、以及可定制的技能系统（Skill）。Hermes Agent完全开源，社区活跃，GitHub上受到广泛关注。Agent采用YAML配置文件管理所有设置，支持多Profile切换，非常适合开发者和高级用户构建自定义AI工作流自动化。\n\n【核心功能】\n1. 多模型支持：兼容OpenAI/Claude/DeepSeek/OpenRouter等数十种模型提供商\n2. 计算机使用：后台驱动桌面，点击/输入/滚动/截图，不抢占用户焦点\n3. 工具集成：文件读写/终端执行/浏览器/代码沙箱/网络搜索/GitHub/飞书等\n4. 多智能体并行：delegate_task可并行分发子任务给多个Agent\n5. 持久记忆：跨会话保存用户偏好和重要信息\n6. 技能系统：可自定义可复用的Skill工作流\n\n【应用场景】\n1. 自动化开发：AI驱动代码编写、调试、测试和部署全流程\n2. 桌面自动化：后台操作Windows桌面应用，如股票软件/办公软件\n3. 数据采集：网络搜索和API调用组合完成复杂信息收集\n4. 定时任务：通过cronjob设置定时执行的任务，如日报生成/监控\n5. 多平台消息：连接飞书/Telegram/微信等IM平台进行智能对话\n6. 研究辅助：多Agent并行搜索和分析学术资料\n\n【收费情况】\n开源免费。使用需要自有API Key（调用模型API的费用由用户承担）。\n\n【使用形态】\n本地CLI工具 + Agent框架。支持Windows/macOS/Linux。\n\n【使用说明】\n1. 从GitHub克隆仓库或通过pip安装\n2. 配置config.yaml设置模型提供商和API Key\n3. 运行hermes命令进入交互模式\n4. 输入任务描述，Agent自动调用工具执行\n5. 通过skill系统保存可复用的工作流\n6. 配置cronjob设置定时任务\n\n【优势】\n1. 完全开源，社区驱动\n2. 计算机使用能力独特\n3. 多模型/多工具集成\n4. 多智能体并行\n5. 持久化记忆\n\n【劣势】\n1. 需要自备API Key\n2. 配置有一定学习成本\n3. 命令行界面对非技术用户不友好\n4. Windows生态支持仍在完善中\n\n【支持平台】\nWindows、macOS、Linux", "s": "Hermes Agent是Nous Research开发的开源AI Agent框架，支持多模型/多工具/计算机使用/多智能体并行等能力。"},
  {"n": "Claude Code", "c": "AI编程/代码", "p": "Anthropic", "u": "https://docs.anthropic.com/en/docs/claude-code/overview", "t": "CLI工具", "r": "付费", "d": "【产品名片】Claude Code | AI编程/代码 | Anthropic | https://docs.anthropic.com/en/docs/claude-code/overview | 收费：付费\n\n【详细介绍】\nClaude Code是Anthropic推出的AI编程命令行工具（CLI Agent），基于Claude模型为开发者提供沉浸式的AI辅助编码体验。Claude Code运行在终端中，可以直接理解项目结构、读写文件、执行命令、搜索代码库、管理Git操作和GitHub PR。Claude Code的最大特色是深度代码库理解能力——它可以一次性分析整个项目，理解代码架构和依赖关系，然后执行跨文件的复杂重构和功能实现。工具支持Claude Sonnet 4和Opus模型，在SWE-bench编程基准测试中表现突出。Claude Code采用ACP（Agent Communication Protocol）协议与IDE和CI系统集成。Anthropic为Claude Code提供了20美元/月的团队方案。\n\n【核心功能】\n1. 代码库理解：一次性加载和分析整个项目代码\n2. 文件操作：读写/创建/编辑/重构代码文件\n3. 终端执行：在项目目录中直接运行命令\n4. Git管理：自动commit、创建分支、提交PR\n5. 代码搜索：语义搜索和理解代码\n6. ACP协议：与IDE/CI/CD系统深度集成\n\n【应用场景】\n1. 大型重构：跨多个文件的架构级代码重构\n2. 功能开发：从需求描述到完整功能实现\n3. Bug修复：分析错误日志定位并修复代码问题\n4. 代码审查：自动审查PR并生成修改建议\n5. 文档生成：为代码库自动生成API文档和README\n6. 测试编写：自动生成单元测试和集成测试\n\n【收费情况】\n付费。使用Max方案需要Claude Pro订阅（$20/月）或Team方案。每次调用按token计费。\n\n【使用形态】\n终端CLI工具。在项目目录中运行claude命令进入交互式编码模式。\n\n【使用说明】\n1. 安装Claude Code CLI（npm/github发布）\n2. 在终端中导航到项目目录\n3. 运行claude命令启动对话式编码会话\n4. 描述要完成的任务（如「为这个API添加错误处理」）\n5. Claude自动分析代码库并执行操作\n6. 审查修改结果，接受或拒绝变更\n\n【优势】\n1. 深度代码库理解能力\n2. 跨文件重构能力强\n3. Claude模型推理能力领先\n4. ACP协议可扩展\n5. Git/GitHub深度集成\n\n【劣势】\n1. 需要付费订阅\n2. 大型代码库加载较慢\n3. 需联网使用\n4. 不支持所有编程语言\n\n【支持平台】\nmacOS、Linux、Windows（通过WSL）", "s": "Claude Code是Anthropic推出的AI编程CLI工具，基于Claude模型提供深度代码库理解和跨文件重构能力。"},
  {"n": "Codex CLI", "c": "AI编程/代码", "p": "OpenAI", "u": "https://github.com/openai/codex", "t": "CLI工具", "r": "付费", "d": "【产品名片】Codex CLI | AI编程/代码 | OpenAI | https://github.com/openai/codex | 收费：付费\n\n【详细介绍】\nCodex CLI是OpenAI推出的AI编程命令行工具，是OpenAI Codex模型的终端实现。与GitHub Copilot（IDE插件）不同，Codex CLI是独立运行的终端AI编程助手，可以直接在命令行中与开发者协作完成编码任务。Codex CLI能够理解项目目录结构，创建、编辑和删除文件，执行终端命令，管理Git仓库等。OpenAI Codex模型专门针对代码生成进行了优化，对Python/JavaScript/TypeScript/Java/Go/Rust等主流语言有出色的支持。Codex CLI的设计理念是「AI作为协作编程伙伴」，开发者可以用自然语言描述意图，Codex自动转换为可执行的代码修改。工具支持交互式模式和单次命令模式。Codex CLI的开源发布使其在开发者社区获得了广泛关注。\n\n【核心功能】\n1. 项目理解：扫描项目目录结构，理解代码组织\n2. 文件编辑：创建/修改/删除代码文件\n3. 命令执行：在项目中运行构建/测试等命令\n4. 代码生成：从自然语言描述生成完整函数/模块\n5. Git集成：自动commit、分支管理\n6. 多语言支持：Python/JS/TS/Java/Go/Rust等\n\n【应用场景】\n1. 快速原型：从描述到可运行代码的快速迭代\n2. 代码补全：实现函数、类、模块的完整结构\n3. 迁移升级：将代码从旧版本迁移到新框架\n4. 学习编程：用自然语言探索和理解代码\n5. 自动化脚本：快速编写自动化脚本\n6. 代码审查：分析代码问题和改进建议\n\n【收费情况】\n付费。使用需要OpenAI API Key，按模型token计费。Codex模型定价高于GPT-4o基础模型。\n\n【使用形态】\n终端CLI工具。在项目目录中运行codex命令。\n\n【使用说明】\n1. 安装Codex CLI（可通过pip或npm安装）\n2. 设置OpenAI API Key为环境变量\n3. 在项目目录中运行codex\n4. 描述编码任务\n5. Codex分析项目并执行代码修改\n6. 审查变更，决定是否保留\n\n【优势】\n1. OpenAI Codex模型专门的代码能力\n2. 独立于IDE运行\n3. 多语言支持好\n4. 开源可审查\n5. 与OpenAI生态无缝衔接\n\n【劣势】\n1. 需要OpenAI API Key\n2. 按token计费成本较高\n3. 对大型项目理解有限\n4. 不支持多模态输入\n\n【支持平台】\nmacOS、Linux、Windows", "s": "Codex CLI是OpenAI推出的AI编程命令行工具，基于Codex模型提供终端中的AI编程协作能力。"},
  {"n": "可灵AI/Kling", "c": "AI视频生成", "p": "快手", "u": "https://kling.kuaishou.com", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】可灵AI/Kling | AI视频生成 | 快手 | https://kling.kuaishou.com | 收费：免费+付费\n\n【详细介绍】\n可灵AI（Kling）是快手科技推出的AI视频生成工具，基于快手自研的视频生成大模型。可灵AI支持文生视频（Text-to-Video）和图生视频（Image-to-Video）两种模式，能够根据文字描述或参考图片生成高质量的视频内容。可灵AI在视频生成的连贯性、运动合理性和画面质量方面表现优异，是国内最受欢迎的AI视频生成工具之一。可灵AI生成的视频最长可达120秒，支持多种画面风格（写实/动画/3D/科幻/水墨等），同时提供视频续写、运动笔刷、镜头控制等高级功能。可灵AI的模型在多个视频生成基准测试中取得领先成绩。快手作为国内头部短视频平台，为可灵AI提供了丰富的视频数据和场景理解能力，使其在运动表现和时间一致性方面具有独特优势。\n\n【核心功能】\n1. 文生视频：输入文字描述，AI自动生成高质量视频\n2. 图生视频：上传图片作为起点，AI生成动态视频\n3. 视频续写：在已有视频基础上继续延展内容\n4. 运动笔刷：指定画面中物体的运动轨迹\n5. 镜头控制：控制镜头推拉摇移等运动方式\n6. 风格迁移：多种艺术风格一键切换\n\n【应用场景】\n1. 短视频创作：为抖音/快手/视频号快速生成创意视频素材\n2. 广告营销：产品展示视频、品牌推广短片\n3. 内容运营：公众号/社交媒体配图视频\n4. 概念可视化：将文案创意快速可视化\n5. 教育动画：教学内容的动画演示\n6. 艺术创作：实验性视频和数字艺术\n\n【收费情况】\n免费+付费。每日免费生成一定数量视频（约5-10个）。付费版按月订阅，￥99-￥299/月，无限生成+高级功能。\n\n【使用形态】\n在线SaaS服务。Web端和App端。\n\n【使用说明】\n1. 访问 kling.kuaishou.com 注册快手账号\n2. 选择文生视频或图生视频模式\n3. 文生视频：输入视频描述文案\n4. 图生视频：上传参考图片\n5. 选择风格和参数（时长/分辨率/镜头动作）\n6. 点击生成，等待30秒-2分钟出结果\n\n【优势】\n1. 视频质量领先国内同行\n2. 支持120秒长视频\n3. 运动连贯性好\n4. 快手平台数据支撑\n5. 图生视频效果好\n\n【劣势】\n1. 免费额度有限\n2. 生成速度较慢\n3. 复杂场景效果不稳定\n4. 细节有时不自然\n\n【支持平台】\nWeb端、iOS App、Android App", "s": "可灵AI（Kling）是快手推出的AI视频生成工具，支持文生视频和图生视频，最长120秒，画面质量领先。"},

  {"n": "Luma Dream Machine", "c": "AI视频生成", "p": "Luma AI", "u": "https://lumalabs.ai/dream-machine", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Luma Dream Machine | AI视频生成 | Luma AI | https://lumalabs.ai/dream-machine | 收费：免费+付费\n\n【详细介绍】\nLuma Dream Machine是Luma AI推出的AI视频生成模型和平台，于2024年发布后迅速成为最受欢迎的AI视频工具之一。Dream Machine以其极快的生成速度著称——只需约120秒即可生成120帧的高质量视频。Dream Machine支持文生视频和图生视频，对文字描述的语义理解能力很强，能够准确捕捉用户的创意意图。Dream Machine生成的视频在光影效果、色彩表现和画面构图方面特别出色，具有电影级的视觉质感。除了视频生成，Luma AI还提供3D建模（NeRF技术）和3D扫描能力，与Dream Machine形成互补的产品矩阵。Dream Machine提供慷慨的免费额度，每天可免费生成数十个视频，是目前性价比最高的AI视频工具之一。\n\n【核心功能】\n1. 文生视频：详细文字描述生成高质量视频\n2. 图生视频：上传图片生成动态视频\n3. 极速生成：约120秒生成120帧视频\n4. 电影画质：出色的光影和色彩表现\n5. 多画幅：支持多种视频宽高比\n6. 3D能力：兼容Luma 3D扫描和建模\n\n【应用场景】\n1. 电影概念设计：快速生成电影场景预览\n2. 广告制作：制作高质量产品展示视频\n3. 社交媒体内容：创意短视频素材\n4. 游戏资产：游戏过场动画和宣传材料\n5. 建筑设计：建筑和室内设计动态演示\n6. 艺术创作：实验性视觉艺术和动态插画\n\n【收费情况】\n免费+付费。免费用户每天约30次生成。付费版$29.99-$99.99/月，无限生成+高清+商业使用。\n\n【使用形态】\n在线SaaS服务。Web端使用。\n\n【使用说明】\n1. 访问 lumalabs.ai/dream-machine 注册\n2. 选择文生视频或图生视频\n3. 文生视频：输入详细的场景描述\n4. 图生视频：上传起始图片\n5. 选择生成参数\n6. 点击生成，等待约2分钟\n\n【优势】\n1. 生成速度极快（120秒）\n2. 免费额度慷慨\n3. 电影级画质\n4. 语义理解好\n5. 3D+视频一体化\n\n【劣势】\n1. 视频最长时间有限\n2. 运动复杂度不够\n3. 多人场景容易混乱\n4. 需特殊网络访问\n\n【支持平台】\nWeb端", "s": "Luma Dream Machine是Luma AI的AI视频生成平台，以极快速度（120秒）和电影级画质著称，免费额度慷慨。"},
  {"n": "Leonardo AI", "c": "AI设计/图像", "p": "Leonardo AI", "u": "https://leonardo.ai", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Leonardo AI | AI设计/图像 | Leonardo AI | https://leonardo.ai | 收费：免费+付费\n\n【详细介绍】\nLeonardo AI是澳大利亚Leonardo AI公司开发的AI图像生成平台，以其丰富的模型选择、精细的控制能力和游戏/概念艺术领域的卓越表现而闻名。Leonardo AI提供数十种经过微调的预训练模型，涵盖写实、动漫、像素风、3D渲染、概念艺术、建筑可视化、产品设计等多种风格。平台的特色功能包括：Canvas Editor（画布编辑器，支持局部重绘和扩展）、Motion（将静态图转为动态视频）、Real-Time Generation（实时生成，边画边生成）、Model Training（用自己的图片训练专属模型）、Image-to-Image（图生图）等。Leonardo AI在游戏美术、角色设计和场景概念方面特别强大，很多独立游戏开发者和工作室将其作为主要的美术生产工具。平台提供慷慨的免费额度（每天150个token），足以满足轻度使用需求。\n\n【核心功能】\n1. 多模型支持：数十种预训练模型覆盖多种艺术风格\n2. Canvas Editor：类似Photoshop的AI画布编辑\n3. 实时生成：画笔绘制同时AI实时生成\n4. 模型训练：用自己的图像训练专属模型\n5. 图生图：基于参考图片生成新作品\n6. AI运动：静态图像转动态视频\n\n【应用场景】\n1. 游戏开发：角色设计/场景概念/UI素材/道具设计\n2. 概念艺术：电影/游戏/动画的前期概念设计\n3. 产品设计：产品外观/包装/材质效果图\n4. 建筑可视化：建筑设计/室内设计效果图\n5. 插画创作：书籍插图/漫画/海报\n6. 品牌设计：Logo/品牌视觉/营销素材\n\n【收费情况】\n免费+付费。免费用户每天150Token。付费版$10-$60/月，更多Token+优先生成+商业版权。\n\n【使用形态】\n在线SaaS服务。Web端为主，社区版提供Discord集成。\n\n【使用说明】\n1. 访问 leonardo.ai 注册账号\n2. 创建账号后获得每日免费Token\n3. 在AI Image Generation中输入提示词\n4. 选择模型、风格和参数\n5. 点击Generate消耗Token生成\n6. 使用Canvas Editor进行精细编辑\n\n【优势】\n1. 模型选择丰富，风格覆盖广\n2. 免费额度充足（150Token/天）\n3. 游戏和概念艺术领域表现突出\n4. Canvas Editor功能强大\n5. 支持模型自定义训练\n\n【劣势】\n1. 完全中文支持不足\n2. 高级功能需要付费\n3. 图像分辨率有限\n4. 生成人像细节不稳定\n\n【支持平台】\nWeb端、Discord Bot", "s": "Leonardo AI是功能丰富的AI图像生成平台，以多模型选择、Canvas编辑器和游戏概念艺术能力著称。"},
  {"n": "Replit AI", "c": "AI开发平台", "p": "Replit", "u": "https://replit.com/ai", "t": "SaaS/Web", "r": "免费+付费", "d": "【产品名片】Replit AI | AI开发平台 | Replit | https://replit.com/ai | 收费：免费+付费\n\n【详细介绍】\nReplit AI是Replit平台内置的AI编程辅助能力集成。Replit本身是一个云端在线IDE和部署平台，支持超过50种编程语言，无需本地配置即可在浏览器中编写、运行和部署代码。Replit AI在其基础上提供了AI编程功能，包括AI代码补全（与Copilot类似的智能补全）、AI代码生成（用自然语言描述需求自动生成代码）、AI Debugging（自动分析错误并修复）和AI Explain（解释代码功能）。Replit最独特的功能是Ghostwriter AI Agent——用户可以描述一个完整的应用需求，AI自动生成全部代码、配置文件并部署上线。Replit还提供了AI Chat功能，开发者可以在编辑器中与AI对话解决技术问题。Replit AI特别适合快速原型开发、教学学习和全栈应用的快速构建。\n\n【核心功能】\n1. AI代码补全：智能上下文感知的代码补全\n2. AI代码生成：自然语言描述生成完整函数或文件\n3. Ghostwriter Agent：从需求描述到完整应用一键部署\n4. AI Debug：自动识别并修复代码错误\n5. AI Chat：编辑器内与AI对话解决编程问题\n6. 一键部署：编写+托管+部署全在浏览器中完成\n\n【应用场景】\n1. 快速原型：从想法到可运行Demo只需几分钟\n2. 编程教学：无需配置环境即可学习编程\n3. 全栈开发：前后端+数据库一站式构建\n4. 代码分享：与他人协作编辑和调试代码\n5. 面试准备：在线编码面试和算法练习\n6. 小工具开发：快速开发内部小工具和自动化脚本\n\n【收费情况】\n免费+付费。免费版支持有限AI请求。Pro版$25/月，更多AI请求+私密项目+更多计算资源。\n\n【使用形态】\n云端SaaS服务。浏览器使用，无需安装。\n\n【使用说明】\n1. 访问 replit.com 注册账号\n2. 创建新Repl选择编程语言和模板\n3. 在代码编辑器中编写代码或使用AI\n4. 按Ctrl+K打开AI命令面板\n5. 输入自然语言描述生成代码\n6. 点击Run运行，点击Deploy部署\n\n【优势】\n1. 零配置，浏览器即开即用\n2. AI能力集成度高\n3. Ghostwriter Agent全自动开发\n4. 一键部署\n5. 适合教学和快速原型\n\n【劣势】\n1. 免费版计算资源有限\n2. 依赖网络连接\n3. 大型项目性能不足\n4. 离线无法使用\n\n【支持平台】\nWeb端（所有现代浏览器）", "s": "Replit AI是云端IDE集成的AI编程能力，支持代码生成/补全/调试/部署，零配置浏览器即开即用。"},
  {"n": "LangChain", "c": "AI开发平台", "p": "LangChain Inc.", "u": "https://www.langchain.com", "t": "开源框架", "r": "开源免费", "d": "【产品名片】LangChain | AI开发平台 | LangChain Inc. | https://www.langchain.com | 收费：开源免费\n\n【详细介绍】\nLangChain是一个开源AI应用开发框架，由Harrison Chase于2022年创立，是目前最流行的LLM应用开发框架之一。LangChain提供了一套完整的工具链，帮助开发者构建基于大语言模型的应用程序。核心模块包括：Models（模型封装，支持OpenAI/Anthropic/Google等）、Prompts（提示词管理和模板）、Chains（将多个LLM调用组合成流水线）、Agents（智能体系统，让LLM自主使用工具）、Memory（对话记忆管理）、Retrieval（文档检索增强RAG）、Callbacks（回调系统和监控）。LangChain的LCEL（LangChain Expression Language）语法让链式调用变得简洁优雅。LangChain生态还包括LangSmith（调试/测试/监控平台）和LangServe（API部署工具）。LangChain支持Python和TypeScript，GitHub上拥有超过90万star。\n\n【核心功能】\n1. 模型集成：统一接口接入OpenAI/Anthropic/Google等数十种LLM\n2. 链式调用：通过LCEL组合多个LLM调用\n3. Agent系统：构建让LLM自主调用工具的智能体\n4. RAG检索：文档分块/向量嵌入/检索增强生成\n5. 记忆管理：对话历史存储和上下文管理\n6. LangSmith平台：调试/测试/评估/监控LLM应用\n\n【应用场景】\n1. 智能客服：构建基于文档的问答系统\n2. 数据分析Agent：让AI自动查询数据库并分析\n3. 文档处理：PDF/网页的读取、总结和问答\n4. 自动化工作流：多步骤的AI驱动业务流程\n5. 代码生成：构建基于代码库的编程助手\n6. 多模态应用：处理文本+图像+音频的复合应用\n\n【收费情况】\n开源免费（MIT协议）。LangSmith平台有免费版和企业版。\n\n【使用形态】\nPython/TypeScript库，可集成到任何应用中。\n\n【使用说明】\n1. 通过pip安装langchain\n2. 设置LLM API Key\n3. 从简单的LLMChain开始\n4. 添加检索、记忆和Agent功能\n5. 使用LCEL组合更复杂的流水线\n6. 用LangSmith调试和监控应用\n\n【优势】\n1. 社区最大，生态最完善\n2. 模型集成最全面\n3. LCEL语法简洁\n4. Agent和RAG支持好\n5. LangSmith调试方便\n\n【劣势】\n1. 学习曲线较陡\n2. 抽象层级多，调试复杂\n3. 版本更新快，兼容性问题\n4. 过度封装有时反而不灵活\n\n【支持平台】\nPython、TypeScript（Node.js）", "s": "LangChain是最流行的LLM应用开发框架，提供模型集成/Agent/RAG/记忆等完整工具链，GitHub超90万star。"},
  {"n": "LlamaIndex", "c": "AI开发平台", "p": "LlamaIndex Inc.", "u": "https://www.llamaindex.ai", "t": "开源框架", "r": "开源免费", "d": "【产品名片】LlamaIndex | AI开发平台 | LlamaIndex Inc. | https://www.llamaindex.ai | 收费：开源免费\n\n【详细介绍】\nLlamaIndex（原名GPT Index）是一个开源数据框架，专门用于构建LLM应用中的检索增强生成（RAG）系统。LlamaIndex专注于解决「如何让LLM与用户自己的数据连接」这个核心问题。它提供了一套强大的数据连接器（Data Connectors），可以从PDF/网页/数据库/Notion/Slack/Google Docs等数十种数据源中读取数据；提供灵活的索引结构（Vector Index/Summary Index/Keyword Index/Knowledge Graph Index等）来组织数据；提供高级检索策略（Hybrid Search/BM25/Reciprocal Rank Fusion/Agentic RAG等）来精准获取信息。LlamaIndex的Agent系统支持工具调用、多步推理和任务规划。LlamaIndex在RAG场景中的表现尤其出色，被广泛应用于知识库问答、文档分析、研究报告生成等场景。LlamaIndex与LangChain互补，可以配合使用。\n\n【核心功能】\n1. 数据连接器：从PDF/网页/数据库/云端文档等读取数据\n2. 索引构建：多种索引策略（向量/摘要/关键词/知识图谱）\n3. 高级检索：Hybrid Search/BM25/Agentic RAG\n4. Agent系统：基于数据的智能体推理和问答\n5. 查询引擎：灵活的多步查询和结果合成\n6. 可观测性：集成Arize/Arize Phoenix等监控平台\n\n【应用场景】\n1. 企业知识库：公司的内部文档/制度/规范问答\n2. 学术研究：论文PDF的检索、总结和交叉分析\n3. 法律文档：法律法规/合同文件的智能检索\n4. 产品文档：API文档和产品手册的智能问答\n5. 数据分析：连接数据库用自然语言查询数据\n6. 客服系统：基于产品知识库的智能客服\n\n【收费情况】\n开源免费（MIT协议）。LlamaCloud托管服务有免费版和付费版。\n\n【使用形态】\nPython库。可集成到Web应用/CLI工具/API服务等。\n\n【使用说明】\n1. 通过pip安装llama-index\n2. 配置LLM和Embedding模型\n3. 使用SimpleDirectoryReader加载数据\n4. 构建VectorStoreIndex索引\n5. 创建QueryEngine进行查询\n6. 添加高级检索和Agent功能\n\n【优势】\n1. RAG能力最专业\n2. 数据连接器最丰富\n3. 多种索引策略灵活\n4. Agent+RAG结合好\n5. 与LangChain互补\n\n【劣势】\n1. 核心功能聚焦RAG，范围较窄\n2. 学习曲线存在\n3. 文档更新不够及时\n4. 调试工具不如LangSmith成熟\n\n【支持平台】\nPython", "s": "LlamaIndex是专业RAG框架，提供丰富的数据连接器和检索策略，帮助LLM连接用户私有数据。"},
  {"n": "Google Gemini", "c": "通用AI大模型", "p": "Google", "u": "https://gemini.google.com", "t": "对话", "r": "免费+付费", "d": "【产品名片】Google Gemini | 通用AI大模型 | Google | https://gemini.google.com | 收费：免费+付费\n\n【详细介绍】\nGoogle Gemini是Google推出的多模态AI大模型系列，是Google在AI领域的核心产品。Gemini模型从设计之初就是多模态的——原生支持文本、图像、音频、视频和代码的混合理解与生成，不像其他模型需要通过多个独立模型拼接实现多模态。Gemini系列包括：Gemini Ultra（最强版，擅长推理和多模态理解）、Gemini Pro（性能与成本平衡版）和Gemini Nano（端侧设备高效版）。Gemini 2.0 Flash版本在速度和成本上取得了突破，支持100万token超长上下文和实时音视频交互。Gemini的Project Astra展示了AI助手的实时视觉理解和对话能力。Gemini深度整合Google生态，与Gmail/Google Docs/Google Maps/YouTube等产品联动，可以读取和分析用户在各Google服务中的数据。Gemini在MMLU/MMMU等多个基准测试中取得了领先成绩。\n\n【核心功能】\n1. 多模态理解：原生支持文本/图像/音频/视频/代码\n2. 超长上下文：Gemini 2.0支持100万token上下文\n3. Google生态：与Gmail/Drive/Maps/YouTube等深度集成\n4. 实时对话：支持实时语音和视频交互\n5. 代码执行：内置Python代码沙箱\n6. 应用扩展：通过Extension连接第三方服务\n\n【应用场景】\n1. 多模态分析：分析图表/视频/音频混合内容\n2. 长文档处理：处理百页级PDF和研究论文\n3. Google工作流：在Gmail/Google Docs中用AI辅助工作\n4. 编程辅助：代码生成/调试/解释\n5. 学习研究：学术资料的检索和综合分析\n6. 创意写作：从YouTube视频分析到内容创作\n\n【收费情况】\n免费+付费。Gemini Advanced（含Ultra模型）$19.99/月，包含2TB Google One存储。免费版使用Gemini Pro。\n\n【使用形态】\nWeb端、移动App、API接口。\n\n【使用说明】\n1. 访问 gemini.google.com 用Google账号登录\n2. 在对话框输入问题或上传文件/图片\n3. 支持语音输入和实时对话\n4. 点击Extension图标连接Google服务\n5. 使用Gemini Advanced升级解锁Ultra模型\n6. API调用通过Google AI Studio获取Key\n\n【优势】\n1. 原生多模态能力强\n2. 100万token超长上下文\n3. Google生态深度整合\n4. 免费版功能强大\n5. 实时语音视频交互\n\n【劣势】\n1. 中文能力不如国产模型\n2. 创意写作偏保守\n3. 亚太地区访问受限\n4. 隐私顾虑（Google数据）\n\n【支持平台】\nWeb端、iOS App、Android App、API（Google AI Studio/Vertex AI）", "s": "Google Gemini是Google的多模态AI大模型，原生支持文本/图像/音频/视频理解，与Google生态深度整合。"},
  {"n": "Grok", "c": "通用AI大模型", "p": "xAI", "u": "https://x.ai", "t": "对话", "r": "付费", "d": "【产品名片】Grok | 通用AI大模型 | xAI | https://x.ai | 收费：付费\n\n【详细介绍】\nGrok是由Elon Musk创立的xAI公司开发的AI大语言模型产品。Grok的名称来源于科幻小说《银河系漫游指南》中的概念，意为「深刻而直观的理解」。Grok的最大特色是其「叛逆幽默」的人格设定——回答风格直率幽默，不回避争议话题，愿意给出其他AI助手通常回避的坦率答案。Grok通过X平台（Twitter）的实时数据流获得即时信息优势，能够回答最新发生的事情。Grok-2和Grok-3在多个基准测试中表现优异，具备多模态理解能力（文本+图像）。Grok的另一个重要功能是DeepSearch深度搜索——能够对复杂问题进行多步搜索和分析。Grok深度整合X平台，可以分析X上的帖子、趋势和用户资料。xAI还在不断迭代Grok模型，Grok-3在数学推理和编程方面取得了显著进步。\n\n【核心功能】\n1. 实时信息：通过X数据流获取最新信息\n2. 叛逆个性：直率幽默的回答风格\n3. 多模态理解：支持文本和图像输入\n4. DeepSearch：深度多步搜索和分析\n5. X平台整合：分析X帖子和趋势\n6. 编程辅助：代码生成和调试\n\n【应用场景】\n1. 实时新闻：获取和分析最新发生的事件\n2. 社交媒体分析：分析X平台话题和趋势\n3. 技术问答：编程和技术问题的直率解答\n4. 创意讨论：头脑风暴和创意探索\n5. 市场调研：分析社交媒体上的产品口碑\n6. 争议话题：需要坦率答案的敏感问题\n\n【收费情况】\n付费。包含在X Premium+订阅中（$16/月或$168/年）。独立API按量计费。\n\n【使用形态】\nWeb端、移动App。通过X平台访问。\n\n【使用说明】\n1. 订阅X Premium+\n2. 在X平台中打开Grok\n3. 输入问题或上传图片\n4. 使用DeepSearch进行深度分析\n5. 开启实时模式获取最新信息\n6. 在对话中随时切换话题\n\n【优势】\n1. 实时信息获取无可匹敌\n2. 回答风格坦率有趣\n3. X平台深度整合\n4. DeepSearch功能强大\n5. 多模态能力\n\n【劣势】\n1. 需要X Premium+订阅\n2. 个性风格不适用于所有场景\n3. 中文能力一般\n4. 品牌可能带来的争议\n\n【支持平台】\nWeb端（X平台）、iOS App、Android App、API", "s": "Grok是xAI开发的AI助手，以实时X数据整合和叛逆幽默的回答风格著称，具备DeepSearch深度搜索能力。"},
